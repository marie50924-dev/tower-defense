<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd9ec">
<title>まほうのおかしの国をまもって</title>
<style>
  :root{
    --pink:#ff8fc4;
    --pink-d:#e05f9e;
    --lav:#c9a7ff;
    --mint:#8fe3c4;
    --cream:#fff6e9;
    --ink:#6b4a63;
    --card:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    font-weight:800;
    color:var(--ink);
    background:
      radial-gradient(90% 60% at 20% 0%,  #fff0f8 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 30%, #eef0ff 0%, transparent 60%),
      linear-gradient(180deg,#ffe6f3 0%, #f3e8ff 55%, #e6f6ff 100%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    overflow-x:hidden;user-select:none;
  }
  #app{width:100%;max-width:480px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}

  /* ---------- HUD ---------- */
  #hud{display:flex;gap:6px}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    box-shadow:0 4px 14px rgba(190,140,180,.22);backdrop-filter:blur(6px);
  }
  .stat{flex:1;padding:6px 4px;text-align:center;line-height:1.1}
  .stat .k{font-size:10px;opacity:.6;letter-spacing:.06em}
  .stat .v{font-size:19px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:3px}
  .stat .sub{font-size:9px;color:#e0a52e;line-height:1.2}
  #hpBox.low .v{color:#ff5a8a;animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.45}}

  /* ---------- board ---------- */
  #wrap{position:relative;align-self:center}
  canvas{display:block;border-radius:20px;touch-action:none;
    box-shadow:0 8px 26px rgba(180,130,175,.3), inset 0 0 0 3px rgba(255,255,255,.85)}

  /* ---------- bottom panel ---------- */
  #panel{min-height:96px}
  #shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px}
  .tw{
    position:relative;border:2px solid transparent;border-radius:14px;padding:6px 2px 5px;
    background:rgba(255,255,255,.6);cursor:pointer;text-align:center;line-height:1.15;
    transition:transform .1s, border-color .1s;
  }
  .twC{color:#b98ae0}
  .tw:active{transform:scale(.94)}
  .tw.sel{border-color:var(--pink);background:#fff;box-shadow:0 0 0 3px rgba(255,143,196,.28)}
  .tw.poor{opacity:.42}
  .tw .ic{font-size:21px;line-height:1.2}
  .tw .nm{font-size:10.5px}
  .tw .cs{font-size:11px;color:var(--pink-d)}

  #info{display:none;padding:9px 11px;gap:8px;align-items:center}
  #info.on{display:flex}
  #infoIc{font-size:31px}
  #infoTx{flex:1;font-size:11.5px;line-height:1.5}
  #infoTx b{font-size:14px}
  .mini{border:none;border-radius:12px;padding:9px 11px;font:inherit;font-size:12px;color:#fff;
    background:linear-gradient(180deg,#ffa6d0,var(--pink));box-shadow:0 3px 0 var(--pink-d);cursor:pointer}
  .mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink-d)}
  .mini.gray{background:linear-gradient(180deg,#cfc4dd,#a898bd);box-shadow:0 3px 0 #857399}
  .mini:disabled{opacity:.4}

  /* ---------- なかまワザ（タスクバー：横スクロール・7スロット） ---------- */
  #skillBar{display:flex;gap:5px;padding:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;flex-shrink:0}
  .sk{flex:0 0 68px;scroll-snap-align:start;position:relative;border:none;border-radius:12px;
    padding:3px 2px 4px;font:inherit;background:rgba(255,255,255,.6);cursor:pointer;
    text-align:center;line-height:1.1;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:60px}
  .sk.empty{border:2px dashed rgba(185,138,224,.45);background:rgba(255,255,255,.3);color:#b98ae0}
  .sk.off{opacity:.45}
  .sk:active{transform:scale(.95)}
  .sk:disabled{opacity:.45}
  .sk canvas{display:block;margin:0 auto}
  .skN{font-size:9.5px}
  .skC{font-size:9.5px;color:var(--pink-d)}
  .skCd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.66);border-radius:12px;font-size:17px;color:var(--pink-d)}
  .skStock{position:absolute;top:-4px;right:-3px;background:linear-gradient(180deg,#ffb3dc,var(--pink));
    color:#fff;font-size:9px;border-radius:9px;padding:1px 4px;box-shadow:0 1px 0 var(--pink-d)}

  /* ---------- controls ---------- */
  #ctrl{display:flex;gap:6px}
  .btn{
    flex:1;border:none;border-radius:16px;padding:12px 8px;font:inherit;font-size:15px;color:#fff;
    background:linear-gradient(180deg,#ffb3dc,var(--pink));
    box-shadow:0 4px 0 var(--pink-d), 0 6px 16px rgba(224,95,158,.3);cursor:pointer;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
  .btn.sm{flex:0 0 50px;font-size:13px;background:linear-gradient(180deg,#c9b6ff,#a586f5);box-shadow:0 4px 0 #7d5fd0}
  .btn.sm:active{box-shadow:0 1px 0 #7d5fd0}
  .btn:disabled{opacity:.45}

  /* ---------- overlay ---------- */
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;border-radius:20px;background:rgba(255,240,250,.9);backdrop-filter:blur(5px);text-align:center;padding:22px}
  #ov.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  #ovT{font-size:26px;color:var(--pink-d)}
  #ovB{font-size:13.5px;line-height:1.7;opacity:.8}

  /* ---------- コレクション図鑑 ---------- */
  #colOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.96);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:2}
  #colOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #colHead{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--pink-d)}
  #colHead>div{flex:1}
  #colTabs{display:flex;gap:5px}
  .ctab{flex:1;border:none;border-radius:11px;padding:7px 2px;font:inherit;font-size:11px;color:var(--ink);
    background:rgba(255,255,255,.65);cursor:pointer}
  .ctab.sel{background:linear-gradient(180deg,#ffb3dc,var(--pink));color:#fff;box-shadow:0 2px 0 var(--pink-d)}
  #colDone{background:linear-gradient(90deg,#ffe9b8,#ffd9ec);border-radius:12px;padding:8px;
    text-align:center;font-size:12.5px}
  #colGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .cCard{background:rgba(255,255,255,.85);border:2px solid #ffd9ec;border-radius:14px;
    padding:7px 3px 6px;text-align:center}
  .cCard.no{opacity:.6;filter:grayscale(.7)}
  .cCard canvas{display:block;margin:0 auto}
  .cNm{font-size:11px;margin-top:2px}
  .cTt{font-size:9px;opacity:.6;line-height:1.3}
  .cLv{font-size:9px;color:#e0a52e;letter-spacing:.08em}
  .cGet{font-size:8.5px;opacity:.5;line-height:1.3;margin-top:1px}
  .cCard{position:relative}
  .cPin{position:absolute;top:-7px;right:-5px;font-size:15px;filter:drop-shadow(0 1px 1px rgba(120,90,120,.4))}
  #colHint{text-align:center;font-size:10px;color:#b98ae0;background:rgba(255,255,255,.55);
    border-radius:10px;padding:5px 4px}

  /* ---------- おかしの国のパノラマ ---------- */
  #kingOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:4}
  #kingOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #kingCv{width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(180,130,175,.35)}
  #kingCap{text-align:center;font-size:11px;opacity:.7;line-height:1.5}

  /* ---------- たたかいかたガイド ---------- */
  #helpOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:3}
  #helpOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  .hSec{background:rgba(255,255,255,.8);border:2px solid #ffd9ec;border-radius:14px;padding:9px 11px}
  .hSec h3{margin:0 0 5px;font-size:13px;color:var(--pink-d)}
  .hSec p, .hSec li{font-size:11px;line-height:1.6;margin:0}
  .hSec ul{margin:0;padding-left:0;list-style:none}
  .hSec li{margin-bottom:4px}
  .hSec b{color:var(--pink-d)}
  #colTotal{text-align:center;font-size:11px;opacity:.7;padding:2px 0 4px}
  #colStats{display:flex;gap:6px}
  .cst{flex:1;background:rgba(255,255,255,.8);border:2px solid rgba(255,255,255,.9);
    border-radius:12px;padding:6px 2px;text-align:center;line-height:1.25}
  .cst .ck{font-size:9px;opacity:.6}
  .cst .cn{font-size:15px;color:var(--pink-d);font-variant-numeric:tabular-nums}
  .cst.best{background:linear-gradient(135deg,#fff3cf,#ffe2f0);border-color:#ffd76e}
  .cst.best .cn{color:#c9821e}

  #tip{font-size:10.5px;text-align:center;opacity:.55;line-height:1.5}

  /* ---------- 画面ぜんたいにあふれる紙吹雪 ---------- */
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}
  .cf{position:absolute;top:-7vh;will-change:transform;animation:confFall linear forwards}
  @keyframes confFall{
    0%{transform:translateY(0) rotate(0) scale(1)}
    100%{transform:translateY(115vh) rotate(var(--rot)) scale(.85)}
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="card stat" id="hpBox"><div class="k">ハート</div><div class="v"><span>💗</span><span id="vHp">20</span></div></div>
    <div class="card stat"><div class="k">おほしさま</div><div class="v"><span>⭐</span><span id="vSt">250</span></div></div>
    <div class="card stat"><div class="k">ウェーブ</div><div class="v"><span id="vWv">0</span></div><div class="sub" id="vBw"></div></div>
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="ov">
      <div id="ovT"></div>
      <div id="ovB"></div>
      <button class="btn" id="ovBtn" style="flex:0 0 auto;padding:12px 30px"></button>
      <button class="mini" id="ovShare" style="display:none">きろくをシェア 📤</button>
    </div>
    <div id="kingOv">
      <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--pink-d)">
        <div style="flex:1">🏰 わたしの おかしの国</div>
        <button class="mini" id="kingShare">📤</button>
        <button class="mini gray" id="kingClose">とじる</button>
      </div>
      <canvas id="kingCv"></canvas>
      <div id="kingCap"></div>
    </div>
    <div id="helpOv">
      <div id="colHeadH" style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--pink-d)">
        <div style="flex:1">❓ たたかいかたガイド</div>
        <button class="mini gray" id="helpClose">とじる</button>
      </div>
      <div id="helpBody"></div>
    </div>
    <div id="colOv">
      <div id="colHead">
        <div>👑 これくしょん <span id="colCount" style="white-space:nowrap"></span></div>
        <button class="mini" id="colKing">🏰</button>
        <button class="mini" id="colShare">📤</button>
        <button class="mini gray" id="colClose">とじる</button>
      </div>
      <div id="colTabs">
        <button class="ctab sel" data-t="all">ぜんぶ</button>
        <button class="ctab" data-t="tw">おかし</button>
        <button class="ctab" data-t="en">てき</button>
        <button class="ctab" data-t="ch">なかま</button>
        <button class="ctab" data-t="lg">でんせつ</button>
      </div>
      <div id="colStats"></div>
      <div id="colHint" style="display:none">📌 あつめたなかまをタップすると ワザバーに はったり はがしたり できるよ（7こまで）</div>
      <div id="colDone" style="display:none">🏰 おかしの国が かんせいしたよ！ みんな あつまった 🎉</div>
      <div id="colGrid"></div>
      <div id="colTotal"></div>
    </div>
  </div>

  <div class="card" id="skillBar"></div>

  <div class="card" id="panel">
    <div id="shop"></div>
    <div id="info">
      <div id="infoIc"></div>
      <div id="infoTx"></div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <button class="mini" id="btnUp">つよくする</button>
        <button class="mini gray" id="btnSell">うる</button>
      </div>
    </div>
  </div>

  <div id="ctrl">
    <button class="btn" id="btnWave">つぎのウェーブ ▶</button>
    <button class="btn sm" id="btnSpd">1x</button>
    <button class="btn sm" id="btnCol">👑</button>
    <button class="btn sm" id="btnHelp">❓</button>
    <button class="btn sm" id="btnSnd">♪</button>
  </div>

  <div id="tip">ウェーブは自動でやってくる！ボタンで「はやよび」すると⭐ボーナス✨<br>たたかいかたは ❓ を見てね</div>

</div>

<div id="confetti"></div>

<script>
(() => {
"use strict";

/* iOSでピンチやダブルタップで画面が拡大したまま戻らなくなるのを防ぐ */
for (const ev of ['gesturestart','gesturechange','gestureend'])
  document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ==========================================================
   マップ
   ========================================================== */
const COLS = 9, ROWS = 12;
// 敵が通る道の曲がり角（セル座標）。-1 と ROWS は画面外の出入口。
const WAY = [[1,-1],[1,2],[7,2],[7,5],[1,5],[1,8],[7,8],[7,12]];

/* ==========================================================
   おかし（タワー）の設定
   ========================================================== */
const TOWERS = {
  candy: { name:'キャンディ', ic:'🍬', cost:50,  dmg:9,  rate:0.45, range:2.3, color:'#ff8fc4', dark:'#e05f9e',
           desc:'すばやく1体をねらう' },
  ice:   { name:'アイス',     ic:'🍧', cost:70,  dmg:5,  rate:0.70, range:2.0, color:'#8fd8ff', dark:'#4aa8dd',
           slow:0.45, slowT:1.4, desc:'あてた敵をおそくする' },
  choco: { name:'チョコ',     ic:'🍫', cost:110, dmg:16, rate:1.10, range:1.9, color:'#d09a6a', dark:'#a06a3c',
           splash:0.95, desc:'まわりの敵もまとめて攻撃' },
  star:  { name:'スター',     ic:'⭐', cost:160, dmg:34, rate:1.50, range:3.6, color:'#ffd76e', dark:'#e0a52e',
           desc:'遠くまでとどく強力な一撃' },
};
const ORDER = ['candy','ice','choco','star'];
const UP_MUL = [0, 0.8, 1.4, 2.2, 3.2];        // レベル2〜5 の値段 = cost * これ
// レベル上限は じぶんベストで解放されていく（一度解放すればずっと有効）
const maxLv = () => rec.bw >= 100 ? 5 : rec.bw >= 60 ? 4 : 3;

/* ==========================================================
   敵の設定
   ========================================================== */
const ENEMIES = {
  slime:   { name:'スライム',   hp:28,  spd:1.15, gold:5,   r:0.30, color:'#c9a7ff', dark:'#9a72e0' },
  fast:    { name:'ぴょん',     hp:20,  spd:2.20, gold:7,   r:0.26, color:'#ffa8c8', dark:'#e06f9c' },
  tank:    { name:'もちもち',   hp:115, spd:0.62, gold:15,  r:0.38, color:'#8fe3c4', dark:'#4fb392' },
  crystal: { name:'クリスタル', hp:80,  spd:0.95, gold:14,  r:0.32, color:'#bfe8ff', dark:'#6fa8d8', armor:6 },
  bat:     { name:'こうもり',   hp:60,  spd:1.85, gold:14,  r:0.27, color:'#d8c6ff', dark:'#8f6fd8' },
  golem:   { name:'ゴーレム',   hp:420, spd:0.45, gold:45,  r:0.44, color:'#c09068', dark:'#7a5030', armor:4 },
  boss:    { name:'ボス',       hp:700, spd:0.50, gold:120, r:0.50, color:'#ffb36e', dark:'#dd8028' },
};

function waveList(n){
  const out = [];
  // 数はほどほどで打ち止めにして、後半はHP・敵の種類で手強くする
  const total = 8 + Math.min(28, n*2);
  for (let i=0;i<total;i++){
    let t = 'slime';
    if (n >= 2  && i%4 === 3) t = 'fast';
    if (n >= 4  && i%6 === 5) t = 'tank';
    if (n >= 9  && i%7 === 2) t = 'crystal';
    if (n >= 16 && i%5 === 4) t = 'bat';
    if (n >= 28 && i%9 === 8) t = 'golem';
    out.push(t);
  }
  if (n % 10 === 0) out.push('boss');
  if (n % 10 === 0 && n >= 40) out.push('boss');
  return out;
}
// 序盤からじわっと痛く、18をこえたらゆるやかな複利。
// Lv5タワー＋ワザをつかいこなせば、がんばればW200に届くカーブにしてある
const hpScale = n => (1 + (n-1)*0.30) * Math.pow(1.02, Math.max(0, n-18));
// 後半はもらえるおほしさまも少しずつ増やして、強化が追いつくようにする
// （ベリーおうじが なかまだと さらに +10%）
const goldOf = k => Math.round(ENEMIES[k].gold * (1 + Math.max(0, wave-30)*0.04) * (hasCh('prince') ? 1.1 : 1) * (buffs.gold > 0 ? 2 : 1));

/* ==========================================================
   ステージ（20ウェーブクリアごとに景色が変わる）
   ========================================================== */
const STAGE_WAVES = 20;
const THEMES = [
  { name:'シュガーガーデン',     g1:'#d9f7e6', g2:'#cdf2dd', p1:'#f0c9a0', p2:'#ffe8c8',
    spr:['#ff9ec9','#9ed8ff','#b6f0c4','#ffe08a'] },
  { name:'いちごのおかしばたけ', g1:'#ffe4ef', g2:'#ffd9e8', p1:'#c98a5e', p2:'#eec49a',
    spr:['#ff7fae','#ffffff','#ffd0df','#b6f0c4'] },
  { name:'チョコレートのたに',   g1:'#eed9c2', g2:'#e6cdb2', p1:'#8a5a34', p2:'#b07d4e',
    spr:['#ffffff','#ffd76e','#ff9ec9','#9ed8ff'] },
  { name:'こおりのくに',         g1:'#e2f3fc', g2:'#d6ecf8', p1:'#a8cfe6', p2:'#eef9ff',
    spr:['#ffffff','#bfe8ff','#c9a7ff','#ffd0df'] },
  { name:'よぞらのくに',         g1:'#ded4f6', g2:'#d3c7f1', p1:'#d9b96a', p2:'#f6e2a4',
    spr:['#ffffff','#ffe27a','#ff9ec9','#bfe8ff'] },
  // ---- 後半戦（W101〜200）はさらに新しい国へ ----
  { name:'キャラメルのさばく',   g1:'#f5dfb0', g2:'#efd49c', p1:'#b5722f', p2:'#dda45e',
    spr:['#ffffff','#ffd76e','#ff9ec9','#b98ae0'] },
  { name:'ソーダのうみべ',       g1:'#d3f2f5', g2:'#c2ebf0', p1:'#e8c49a', p2:'#fff0d8',
    spr:['#ffffff','#8fd8ff','#b6f0c4','#ffd0df'] },
  { name:'マカロンのもり',       g1:'#c8e6c0', g2:'#b8dcae', p1:'#8a5a34', p2:'#b07d4e',
    spr:['#ffd0df','#fff0b8','#c9a7ff','#ffffff'] },
  { name:'ゆきのケーキやま',     g1:'#f2f4fa', g2:'#e6eaf5', p1:'#a8c4e6', p2:'#dceafc',
    spr:['#ffffff','#bfe8ff','#ffd0df','#e8d8ff'] },
  { name:'にじのてんくう',       g1:'#eadcf8', g2:'#f6d9ee', p1:'#d9a54e', p2:'#ffe9b0',
    spr:['#ff9ec9','#ffd76e','#8fe3c4','#9ed8ff'] },
];
// ウェーブ w をたたかっている間のテーマ（w=0 はまだ始まっていないのでステージ1）
const themeOf = w => THEMES[Math.max(0, Math.ceil(w/STAGE_WAVES)-1) % THEMES.length];

/* ==========================================================
   なかまキャラ（ステージクリアごとに1人ずつ集まる）
   ========================================================== */
const CHARS = [

/* ==========================================================
   ユーティリティ
   ========================================================== */
const key = (c,r) => c + ',' + r;
const cx  = c => (c + 0.5) * CELL;
const cy  = r => (r + 0.5) * CELL;

function roundRect(x,y,w,h,rad){
  const k = Math.min(rad, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.arcTo(x+w,y,x+w,y+h,k); ctx.arcTo(x+w,y+h,x,y+h,k);
  ctx.arcTo(x,y+h,x,y,k);     ctx.arcTo(x,y,x+w,y,k);
  ctx.closePath();
}

/* 4方向にとがったキラキラ */
function sparkle(x,y,r,rot,color){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.fillStyle = color||'#fff';
  ctx.beginPath();
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function buildPath(){
  pathCells.clear();
  for (let i=0;i<WAY.length-1;i++){
    let [c0,r0] = WAY[i]; const [c1,r1] = WAY[i+1];
    const dc = Math.sign(c1-c0), dr = Math.sign(r1-r0);
    while (c0 !== c1 || r0 !== r1){ pathCells.add(key(c0,r0)); c0 += dc; r0 += dr; }
    pathCells.add(key(c1,r1));
  }
}
function measurePath(){
  pathPts = WAY.map(([c,r]) => ({ x:cx(c), y:cy(r) }));
  segLen = []; pathLen = 0;
  for (let i=0;i<pathPts.length-1;i++){
    const L = Math.hypot(pathPts[i+1].x-pathPts[i].x, pathPts[i+1].y-pathPts[i].y);
    segLen.push(L); pathLen += L;
  }
}
function posAt(d){
  let left = d;
  for (let i=0;i<segLen.length;i++){
    if (left <= segLen[i]){
      const t = segLen[i] ? left/segLen[i] : 0;
      return { x: pathPts[i].x + (pathPts[i+1].x-pathPts[i].x)*t,
               y: pathPts[i].y + (pathPts[i+1].y-pathPts[i].y)*t };
    }
    left -= segLen[i];
  }
  return pathPts[pathPts.length-1];
}

/* ==========================================================
   サウンド
   ========================================================== */
let actx = null, sndOn = true;
function beep(f, dur, type='sine', vol=0.05, slide=1.4){
  if (!sndOn) return;
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*slide, actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

// THEMESと同じならび：テンポ・音色・メロディ（MIDI番号、0は休符）・ベース
const BGMS = [
  { bpm: 96,  wv:'triangle', vol:.030,   // シュガーガーデン：あかるいハ長調
    mel:[72,76,79,76, 81,79,76,72, 74,76,77,74, 76,74,72,67],

    bass:[45,52,48,52] },
  { bpm: 70,  wv:'sine',     vol:.030,   // よぞら：ゆめみるホ短調
    mel:[76,79,83,88, 0,83,79,76,  74,79,83,86, 0,88,91,88],
    bass:[40,47,43,45] },
  { bpm: 88,  wv:'triangle', vol:.032,   // キャラメルのさばく：エキゾチックなト調
    mel:[67,70,74,72, 67,65,67,70, 72,74,77,74, 72,70,67,65],
    bass:[43,48,46,41] },
  { bpm: 112, wv:'triangle', vol:.030,   // ソーダのうみべ：しゅわっとはずむホ長調
    mel:[76,80,83,80, 88,83,80,76, 81,80,78,76, 80,78,76,71],
    bass:[52,45,47,52] },
  { bpm: 80,  wv:'sine',     vol:.032,   // マカロンのもり：やさしいワルツふうト長調
    mel:[79,83,86,0,  84,81,79,0,  78,81,84,86, 84,81,79,74],
    bass:[43,48,50,43] },
  { bpm: 66,  wv:'triangle', vol:.026,   // ゆきのケーキやま：オルゴールのしずけさ
    mel:[84,88,91,0,  89,88,86,0,  84,86,88,84, 81,0,79,0],
    bass:[45,50,52,45] },
  { bpm: 100, wv:'triangle', vol:.034,   // にじのてんくう：クロノスへむかう最終ステージ
    mel:[72,76,79,84, 83,79,76,79, 74,77,81,86, 84,81,77,72],
    bass:[48,53,45,55] },
];
let bgmTimer = null, bgmStep = 0, bgmNext = 0;
const midiF = m => 440 * Math.pow(2, (m-69)/12);
function bgmNote(f, t, dur, wv, vol){
  const o = actx.createOscillator(), gg = actx.createGain();
  o.type = wv; o.frequency.value = f;
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.linearRampToValueAtTime(vol, t + 0.02);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gg).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function bgmTick(){
  if (!sndOn || !actx) return;
  // ミュートしていた間のぶんを一気に鳴らさないための巻きなおし
  if (bgmNext < actx.currentTime - 0.1) bgmNext = actx.currentTime + 0.05;
  // いまのステージの曲（ウェーブが変わると自動でつぎの曲へ）
  const B = BGMS[Math.max(0, Math.ceil(Math.max(wave,1)/STAGE_WAVES)-1) % BGMS.length];
  const stepDur = 60 / B.bpm / 2;    // 8分音符
  while (bgmNext < actx.currentTime + 0.25){
    const i = bgmStep % 16;
    if (B.mel[i]) bgmNote(midiF(B.mel[i]), bgmNext, stepDur*0.95, B.wv, B.vol);
    if (i % 4 === 0) bgmNote(midiF(B.bass[(bgmStep >> 2) % 4]), bgmNext, stepDur*3.5, 'sine', B.vol*1.15);
    bgmStep++; bgmNext += stepDur;
  }
}
function bgmStart(){
  if (bgmTimer) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){ return; }
  bgmNext = actx.currentTime + 0.1; bgmStep = 0;
  bgmTimer = setInterval(bgmTick, 120);
}
function bgmStop(){ if (bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }

function syncShop(){
  for (const el of shopEl.children){
    const T = TOWERS[el.dataset.k];

    el.classList.toggle('poor', stars < T.cost);

function openInfo(t){
  const T = TOWERS[t.k];
  infoEl.classList.add('on'); shopEl.style.display = 'none';
  infoIc.textContent = T.ic;
  const cap = maxLv();
  const up = t.lv < cap ? Math.round(T.cost * UP_MUL[t.lv]) : null;
  infoTx.innerHTML =
    `<b>${T.name} Lv.${t.lv}</b>　こうげき ${Math.round(dmgOf(t))}　はんい ${rangeOf(t).toFixed(1)}<br>` +
    `<span style="opacity:.65">${T.desc}</span>`;
  btnUp.disabled = !up || stars < up;
  btnUp.textContent = up ? `つよくする ⭐${up}`
    : t.lv < 5 ? `Lv${t.lv+1}はベストW${t.lv === 3 ? 60 : 100}で解放`
    : 'さいだいレベル';

}
function closeInfo(){
  infoEl.classList.remove('on'); shopEl.style.display = '';

// なかまの「おうえん」ボーナス（ずっと有効）と、ワザの一時バフ（数秒だけ）
const dmgOf   = t => TOWERS[t.k].dmg   * Math.pow(1.6, t.lv-1)  * (hasCh('king')  ? 1.1  : 1) * (buffs.dmg > 0 ? 2   : 1);
const rangeOf = t => TOWERS[t.k].range * Math.pow(1.12, t.lv-1) * (hasCh('fairy') ? 1.05 : 1) * (buffs.rng > 0 ? 1.4 : 1);
const rateOf  = t => TOWERS[t.k].rate  * Math.pow(0.9, t.lv-1)  * (hasCh('taffy') ? 0.93 : 1) * (buffs.spd > 0 ? 0.5 : 1);
const sellOf  = t => {
  let paid = TOWERS[t.k].cost;
  for (let i=1;i<t.lv;i++) paid += Math.round(TOWERS[t.k].cost*UP_MUL[i]);
  return Math.round(paid*0.6);
};

btnUp.onclick = () => {
  const t = selTower; if (!t || t.lv >= maxLv()) return;
  const c = Math.round(TOWERS[t.k].cost * UP_MUL[t.lv]);
  if (stars < c) return;
  stars -= c; t.lv++; t.pulse = 1;
  // ずかんに「ここまで育てた」記録を残す
  const rc = dex['tw_' + t.k];
  if (rc && (rc.lv || 1) < t.lv){ rc.lv = t.lv; saveDex(); }
  const px = cx(t.c), py = cy(t.r);
  ring(px, py, '#ffffff', CELL*1.5);
  ring(px, py, t.lv >= 5 ? '#ffd76e' : TOWERS[t.k].color, CELL*2.1);
  for (let i=0;i<18;i++) puff(px, py, '#fff2a8');
  for (let i=0;i<10;i++) puff(px, py, '#ffffff');
  for (let i=0;i<8;i++) mote(px, py - CELL*0.2, '#ffe27a');
  floatTx(px, py - CELL*0.65, t.lv >= 5 ? 'さいきょう！' : 'レベルアップ！', '#ffb43f');
  if (t.lv >= 5) celebrate({ conf: 60, rays: 2 });        // さいきょうはひときわ祝う
  else if (t.lv >= 3) celebrate({ conf: 30 });
  beep(620,.12,'triangle',.06);
  setTimeout(()=>beep(830,.12,'triangle',.06),110);
  setTimeout(()=>beep(1050,.22,'triangle',.07),220);
  syncHUD(); openInfo(t);
};
btnSell.onclick = () => {
  const t = selTower; if (!t) return;
  stars += sellOf(t);
  towers = towers.filter(x => x !== t);
  beep(420,.15,'sine',.05,.6);
  for (let i=0;i<12;i++) puff(cx(t.c), cy(t.r), '#ffd7ec');
  closeInfo(); syncHUD(); syncShop();
};

/* ==========================================================
   入力
   ========================================================== */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (over) return;
  const b = cv.getBoundingClientRect();
  const px = (e.clientX-b.left) * (COLS*CELL/b.width);
  const py = (e.clientY-b.top)  * (ROWS*CELL/b.height);
  const c = Math.floor(px/CELL), r = Math.floor(py/CELL);
  if (c<0||c>=COLS||r<0||r>=ROWS) return;

  // ボーナス中は、ふってくるおかしのキャッチ専用
  if (bonus){
    for (let i=bonus.items.length-1;i>=0;i--){
      const it = bonus.items[i];
      if (Math.hypot(px-it.x, py-it.y) <= CELL*0.62){
        bonus.items.splice(i,1); bonus.got++;
        for (let j=0;j<8;j++) puff(it.x, it.y, '#ff9ec9');
        sparkle(it.x, it.y, CELL*0.2, 0, '#fff');
        floatTx(it.x, it.y - CELL*0.4, 'ゲット！', '#ffb43f');
        beep(760,.08,'triangle',.05);
        return;
      }
    }
    return;
  }

  const hit = towers.find(t => t.c === c && t.r === r);
  if (hit){ selTool = null; selTower = hit; syncShop(); openInfo(hit); return; }

  if (!selTool){ closeInfo(); return; }
  if (pathCells.has(key(c,r))){ beep(160,.09,'square',.03,.7); return; }

  const T = TOWERS[selTool];
  if (stars < T.cost){ beep(160,.09,'square',.03,.7); return; }

  stars -= T.cost;
  towers.push({ k:selTool, c, r, lv:1, cd:0, ang:-Math.PI/2, pulse:1, ph:Math.random()*6.3 });
  if (unlock('tw_' + selTool)){
    dex['tw_' + selTool].lv = 1; saveDex();
    floatTx(cx(c), cy(r) - CELL*0.95, 'ずかんに とうろく！', '#b98ae0');
  }
  beep(620,.16,'triangle',.05);
  for (let i=0;i<14;i++) puff(cx(c), cy(r), T.color);
  syncHUD();
});

function startWave(early){
  if (running || over) return;
  if (early && nextT > 0 && wave > 0){
    const b = Math.ceil(nextT * (2 + wave*0.4));
    stars += b;
    floatTx(COLS*CELL/2, CELL*1.4, 'はやよび +⭐' + b, '#ffb43f');
  }
  nextT = 0;
  wave++;
  bgmStart();          // 最初のウェーブからBGM開始（タップ後なので再生できる）
  spawnQ = waveList(wave).slice();
  spawnT = 0; running = true;
  btnWave.disabled = true;
  btnWave.innerHTML = 'ウェーブ' + wave + '<br>しんこう中';
  // 新しいステージの最初のウェーブでは、景色の名前をお披露目する
  if ((wave-1) % STAGE_WAVES === 0)
    floatTx(COLS*CELL/2, CELL*2.2, '「' + themeOf(wave).name + '」', '#b98ae0');
  beep(560,.2,'triangle',.06);
  syncHUD();
}

/* ==========================================================
   お祝いエンジン（達成の瞬間を画面いっぱいに祝う）
   ========================================================== */
const confettiEl = document.getElementById('confetti');
const CONF_EMOJI = ['🎉','⭐','💗','🍬','✨','🌸','💖','🧁'];
/* 画面ぜんたい（盤面の外まで）に紙吹雪を降らせる */
function confettiBurst(n){
  n = Math.min(n, 260 - confettiEl.children.length);   // 出しすぎて重くならないように
  for (let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'cf';
    s.textContent = CONF_EMOJI[(Math.random()*CONF_EMOJI.length)|0];
    s.style.left = (Math.random()*100) + '%';
    s.style.fontSize = (13 + Math.random()*16) + 'px';
    s.style.setProperty('--rot', ((Math.random() < .5 ? -1 : 1)*(360 + Math.random()*540)) + 'deg');
    s.style.animationDuration = (1.8 + Math.random()*1.7) + 's';
    s.style.animationDelay = (Math.random()*0.5) + 's';
    s.addEventListener('animationend', () => s.remove());
    confettiEl.append(s);
  }
}
/* 豪華なファンファーレ（big=true でさらに長く） */
function fanfare(big){
  beep(660,.12,'triangle',.06);
  setTimeout(()=>beep(830,.12,'triangle',.06),110);
  setTimeout(()=>beep(990,.14,'triangle',.06),220);
  setTimeout(()=>beep(1320,.25,'triangle',.07),340);
  if (big){
    setTimeout(()=>beep(990,.1,'triangle',.05),560);
    setTimeout(()=>beep(1180,.12,'triangle',.06),660);
    setTimeout(()=>beep(1580,.35,'triangle',.07),780);
  }
}
/* 演出の重ねがけ： {rays:秒, conf:枚数, rings:true, flash:true, fanfare:1|2, x,y} */
function celebrate(o){
  o = o || {};
  if (o.rays) celebT = Math.max(celebT, o.rays);
  if (o.conf) confettiBurst(o.conf);
  if (o.flash) wflash = 1;
  if (o.rings){
    const x = o.x !== undefined ? o.x : COLS*CELL/2;
    const y = o.y !== undefined ? o.y : ROWS*CELL/2;
    ring(x, y, '#ffffff', CELL*3);
    setTimeout(()=>ring(x, y, '#ffd76e', CELL*4.2), 120);
    setTimeout(()=>ring(x, y, '#ff9ec9', CELL*5.4), 240);
  }
  if (o.fanfare) fanfare(o.fanfare >= 2);
}

/* ==========================================================
   ボーナスウェーブ（空からおかしが降ってくる！ぜんぶタップで💗+3）
   ウェーブ数にはカウントしない。落ちる速さはゲーム速度に関係なく一定
   ========================================================== */
const BONUS_EMO = ['🍬','🍩','🍪','🧁','🍓','🍭','🍰','🍮'];
function startBonus(){
  bonus = { spawnLeft: 10, total: 10, spT: 0.4, items: [], got: 0, missed: 0 };
  btnWave.disabled = true;
  btnWave.innerHTML = '🎁 ボーナスタイム！<br>おかしを タップ！';
  floatTx(COLS*CELL/2, ROWS*CELL*0.35, '🎁 ボーナスウェーブ！', '#ff8fc4');
  floatTx(COLS*CELL/2, ROWS*CELL*0.45, 'ふってくるおかしを ぜんぶタップ！', '#b98ae0');
  beep(700,.12,'triangle',.06);
  setTimeout(()=>beep(930,.15,'triangle',.06),130);
}
function bonusUpdate(dt){
  if (!bonus) return;
  // ずかんなどを見ているあいだは止めてあげる
  if (ov.classList.contains('on') || colOv.classList.contains('on') ||
      helpOv.classList.contains('on') || kingOv.classList.contains('on')) return;
  const H = ROWS*CELL;
  if (bonus.spawnLeft > 0){
    bonus.spT -= dt;
    if (bonus.spT <= 0){
      bonus.spT = 0.55;                       // 出てくる間かく（毎回同じ）
      bonus.spawnLeft--;
      bonus.items.push({ x: CELL*(0.8 + Math.random()*(COLS-1.6)), y: -CELL*0.4,
                         vy: H/3.8,           // 上から下まで約3.8秒（毎回同じ）
                         em: BONUS_EMO[(Math.random()*BONUS_EMO.length)|0],
                         ph: Math.random()*6.3 });
    }
  }
  for (let i=bonus.items.length-1;i>=0;i--){
    const it = bonus.items[i];
    it.y += it.vy*dt; it.ph += dt*4;
    if (it.y > H + CELL*0.4){
      bonus.items.splice(i,1); bonus.missed++;
      floatTx(it.x, H - CELL*0.5, 'あっ…', '#b98ae0');
    }
  }
  if (bonus.spawnLeft === 0 && !bonus.items.length) endBonus();
}
function endBonus(){
  const perfect = bonus.got >= bonus.total;
  const gotN = bonus.got;
  bonus = null;
  btnWave.innerHTML = 'つぎのウェーブ ▶';    // カウントダウン表示がすぐ引きつぐ
  if (perfect){
    hearts = Math.min(maxHearts(), hearts + 3);
    syncHUD();
    // おうじさまとおひめさまが お祝いにかけつける
    paraders.push({ pid:'prince', x:-CELL*1.2, y:ROWS*CELL - CELL*0.85, vx:CELL*2.1, ph:0,   msg:'やったね！' });
    paraders.push({ pid:'apple',  x:-CELL*3.0, y:ROWS*CELL - CELL*0.85, vx:CELL*2.1, ph:2.2, msg:'💗をプレゼントします' });
    floatTx(COLS*CELL/2, ROWS*CELL*0.4, 'パーフェクト！💗+3', '#ff6f9c');
    celebrate({ rays: 2.5, conf: 90, rings: true, fanfare: 1 });
  } else {
    floatTx(COLS*CELL/2, ROWS*CELL*0.4, gotN + 'こゲット！またこんどね🍬', '#b98ae0');
    beep(420,.2,'sine',.05,.7);
  }
}

/* ==========================================================
   更新
   ========================================================== */
function update(dt){
  time += dt;
  if (flash > 0) flash = Math.max(0, flash - dt*2.2);
  if (wflash > 0) wflash = Math.max(0, wflash - dt*1.8);
  if (celebT > 0) celebT = Math.max(0, celebT - dt);

  // 全キャラコンプリートのお披露目は、たたかいと他の画面が落ちついてから
  if (pendingComplete && !running &&
      !ov.classList.contains('on') && !colOv.classList.contains('on') &&
      !helpOv.classList.contains('on') && !kingOv.classList.contains('on'))
    showComplete();

  // 応援パレードのなかまたち
  for (let i=paraders.length-1;i>=0;i--){
    const p = paraders[i];
    p.ph += dt*8;
    if (p.vx){ p.x += p.vx*dt; if (p.x > COLS*CELL + CELL*1.5) paraders.splice(i,1); }
    else { p.life -= dt; if (p.life <= 0) paraders.splice(i,1); }
  }

  // そらをとぶでんせつ。出会う前は影だけがよぎって期待をさそう
  if (!flyer){
    flyT -= dt;
    if (flyT <= 0){
      flyT = 22 + Math.random()*18;
      const owned = LEGENDS.filter(l => dex['lg_' + l.id]);
      const next = LEGENDS.find(l => !dex['lg_' + l.id]);
      let pick = null, sil = false;
      if (owned.length && Math.random() < 0.7) pick = owned[(Math.random()*owned.length)|0];
      else if (next && rec.bw >= next.wave - 30){ pick = next; sil = true; }  // 条件が近いと影が見える
      else if (owned.length) pick = owned[(Math.random()*owned.length)|0];
      if (pick){
        const dir = Math.random() < .5 ? 1 : -1;
        flyer = { pid: pick.id, sil, dir,
                  x: dir > 0 ? -CELL*2 : COLS*CELL + CELL*2,
                  y: CELL*(1.2 + Math.random()*2),
                  v: CELL*(1.2 + Math.random()*0.8) };
        if (sil) floatTx(COLS*CELL/2, CELL*1.2, '…なにかが みている✨', '#b98ae0');
      }
    }
  } else {
    flyer.x += flyer.dir * flyer.v * dt;
    if (flyer.x < -CELL*3 || flyer.x > COLS*CELL + CELL*3) flyer = null;
  }

  // なかまワザのクールダウンと一時バフ（表示は1秒きざみで十分）
  let cdMoved = false;
  for (const k in skCd) if (skCd[k] > 0){ skCd[k] = Math.max(0, skCd[k] - dt); cdMoved = true; }
  for (const k in buffs) if (buffs[k] > 0) buffs[k] = Math.max(0, buffs[k] - dt);
  if (cdMoved && (time*2|0) !== skTick){ skTick = time*2|0; syncSkills(); }

  // つぎのウェーブへのカウントダウン（画面を見ているときだけ進む。
  // はやよびすると のこり秒数ぶんボーナス⭐がもらえる）
  if (!running && !over && wave > 0 && nextT > 0 && !bonus &&
      !ov.classList.contains('on') && !colOv.classList.contains('on') &&
      !helpOv.classList.contains('on') && !kingOv.classList.contains('on')){
    nextT -= dt;
    if (nextT <= 0){
      nextT = 0;
      startWave(false);
    } else if ((time*4|0) !== wvTick){
      wvTick = time*4|0;
      const b = Math.ceil(nextT * (2 + wave*0.4));
      btnWave.innerHTML = '▶ はやよび +⭐' + b + '<br>あと' + Math.ceil(nextT) + 'びょう';
    }
  }

  // 敵の出現（ウェーブが進むと間かくが少しずつ短くなる）
  if (running && spawnQ.length){
    spawnT -= dt;
    if (spawnT <= 0){
      const k = spawnQ.shift();
      spawnEnemy(k, 0);
      spawnT = (k === 'boss' || k === 'golem') ? 1.2 : Math.max(0.4, 0.62 - wave*0.004);
    }
  }

  // 敵の移動
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i], E = ENEMIES[e.k];
    if (e.slow > 0) e.slow -= dt;
    if (e.stun > 0) e.stun -= dt;                    // まもりのたての足止め
    // ボスはスライムをしょうかんしてくる（数がふえすぎたら休む）
    if (e.k === 'boss'){
      e.sum = (e.sum === undefined ? 3 : e.sum) - dt;
      if (e.sum <= 0 && enemies.length < 60){
        e.sum = 4;
        const p = posAt(e.d);
        for (let j=0;j<2;j++) spawnEnemy('slime', Math.max(0, e.d - CELL*(0.6 + j*0.5)));
        ring(p.x, p.y, ENEMIES.boss.dark, CELL*1.6);
        floatTx(p.x, p.y - CELL*0.9, 'しょうかん！', '#dd8028');
        beep(240,.15,'square',.04,.8);
      }
    }
    const mul = e.stun > 0 ? 0 : (e.slow > 0 ? (1 - e.slowAmt) : 1);
    e.d += E.spd * CELL * mul * dt;
    e.wob += dt*9;
    if (e.d >= pathLen){
      enemies.splice(i,1);
      hearts -= (e.k === 'boss' ? 5 : 1);
      flash = 1; beep(200,.28,'sawtooth',.06,.5);
      if (hearts <= 0){
        // ふしちょうのしゅくふく：1プレイに1回だけふみとどまる
        if (hasLg('phoenix') && !phoenixUsed){
          phoenixUsed = true; hearts = 1;
          celebrate({ conf: 50, rings: true, fanfare: 1 });
          floatTx(COLS*CELL/2, ROWS*CELL/2, 'ふしちょうの ごかご！🔥', '#ff8a3a');
        } else {
          syncHUD(); gameOver(); return;
        }
      }
      syncHUD();
    }
  }

  // タワーの攻撃
  for (const t of towers){
    if (t.lv >= 2 && Math.random() < dt*(t.lv-1)*1.7)
      mote(cx(t.c), cy(t.r) - CELL*0.08, t.lv >= 4 ? '#ffe27a' : '#ffffff');
    if (t.pulse > 0) t.pulse = Math.max(0, t.pulse - dt*2.6);
    t.cd -= dt;
    const R = rangeOf(t)*CELL, ox = cx(t.c), oy = cy(t.r);
    let best = null, bestD = -1;
    for (const e of enemies){
      const p = posAt(e.d);
      if (Math.hypot(p.x-ox, p.y-oy) <= R && e.d > bestD){ best = e; bestD = e.d; }
    }
    if (!best) continue;
    const p = posAt(best.d);
    t.ang = Math.atan2(p.y-oy, p.x-ox);
    if (t.cd > 0) continue;
    t.cd = rateOf(t);
    t.pulse = 0.5;
    shots.push({ k:t.k, x:ox, y:oy, target:best, dmg:dmgOf(t), lv:t.lv, life:0, trail:[] });
    beep(t.k==='star'?880:t.k==='choco'?300:660, .07, 'triangle', .028);
  }

  // 弾
  for (let i=shots.length-1;i>=0;i--){
    const s = shots[i];
    s.life += dt;
    if (!enemies.includes(s.target) || s.life > 2.2){ shots.splice(i,1); continue; }
    const p = posAt(s.target.d);
    const dx = p.x-s.x, dy = p.y-s.y, L = Math.hypot(dx,dy) || 1;
    const sp = (s.k==='star' ? 15 : 11) * CELL;
    s.trail.push({x:s.x,y:s.y}); if (s.trail.length > 3 + s.lv*3) s.trail.shift();
    if (L <= sp*dt){ hitTarget(s, p); shots.splice(i,1); continue; }
    s.x += dx/L*sp*dt; s.y += dy/L*sp*dt;
  }

  // パーティクル
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.age += dt;
    if (p.age >= p.life){ parts.splice(i,1); continue; }
    p.vy += (p.g === 0 ? 0 : 130)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*4;
  }
  for (let i=rings.length-1;i>=0;i--){
    const rg = rings[i]; rg.age += dt;
    if (rg.age >= rg.life){ rings.splice(i,1); continue; }
    const k = rg.age/rg.life;
    rg.r = rg.max * (1 - (1-k)*(1-k));
  }
  for (let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.age += dt; f.y -= dt*34;
    if (f.age >= f.life) floats.splice(i,1);
  }
  for (const s of sparks){
    s.y -= s.sp*dt; s.ph += dt*3;
    if (s.y < -8){ s.y = ROWS*CELL+8; s.x = Math.random()*COLS*CELL; }
  }

  // プレゼントキャンディがワザバーへ飛んでいく（山なりの軌道）
  for (let i=gifts.length-1;i>=0;i--){
    const gf = gifts[i]; gf.t += dt;
    const k = Math.min(1, gf.t/gf.life), e2 = k*k*(3-2*k);
    gf.x = gf.sx + (gf.tx-gf.sx)*e2;
    gf.y = gf.sy + (gf.ty-gf.sy)*e2 - Math.sin(k*Math.PI)*CELL*1.6;
    gf.rot += dt*6;
    if (k >= 1){
      gifts.splice(i,1);
      items[gf.ch] = Math.min(ITEM_MAX, items[gf.ch]+1);
      saveItems();
      floatTx(gf.tx, ROWS*CELL - CELL*0.6, '+1 ' + SKILLS.find(s=>s.ch===gf.ch).name, '#b98ae0');
      beep(880,.08,'triangle',.04);
      syncSkills();
    }
  }

  // ウェーブ終了
  if (running && !spawnQ.length && !enemies.length){
    running = false;
    const bonus = Math.round((20 + wave*4) * (hasCh('cake') ? 1.2 : 1));
    stars += bonus;
    floatTx(COLS*CELL/2, ROWS*CELL/2, '+⭐'+bonus, '#ffb43f');
    beep(700,.15,'triangle',.06); setTimeout(()=>beep(940,.22,'triangle',.06),130);
    btnWave.disabled = false;
    btnWave.textContent = 'つぎのウェーブ ▶';
    nextT = NEXT_WAIT + (hasLg('chronos') ? 3 : 0);   // クロノスのしゅくふくで じっくり
    rec.bw = Math.max(rec.bw, wave); saveRec();
    syncHUD();
    // 10ウェーブの節目はちいさなお祝い（クリアの節目はstageClearが盛大にやる）
    if (wave % 10 === 0 && wave % STAGE_WAVES !== 0) celebrate({ conf: 30, fanfare: 1 });
    if (wave % STAGE_WAVES === 0) stageClear();
    else checkLegends();
    // ときどきボーナスウェーブ（ウェーブ数にはカウントしない）
    if (!ov.classList.contains('on') && !pendingComplete &&
        wave >= 2 && wave % STAGE_WAVES !== 0 && Math.random() < 0.2)
      startBonus();
  }
}

// アーマーもちの敵はダメージを軽減する（最低1は通す）
const dmgTo = (e, d) => Math.max(1, d - (ENEMIES[e.k].armor || 0));

function hitTarget(s, p){
  const T = TOWERS[s.k];
  const dead = [];
  if (T.splash){
    const R = T.splash*CELL*Math.pow(1.1, s.lv-1);
    for (const e of enemies){
      const q = posAt(e.d);
      if (Math.hypot(q.x-p.x, q.y-p.y) <= R){ e.hp -= dmgTo(e, s.dmg); if (e.hp <= 0) dead.push(e); }
    }
    for (let i=0;i<10+5*s.lv;i++) puff(p.x, p.y, '#f0c08a');
    if (s.lv >= 3){ for (let i=0;i<6;i++) puff(p.x, p.y, '#ffffff'); ring(p.x, p.y, '#f0c08a', CELL*1.7); }
  } else {
    s.target.hp -= dmgTo(s.target, s.dmg);
    if (T.slow){ s.target.slow = T.slowT; s.target.slowAmt = T.slow; }
    if (s.target.hp <= 0) dead.push(s.target);
    for (let i=0;i<3+3*s.lv;i++) puff(p.x, p.y, T.color);
    if (s.lv >= 3){ for (let i=0;i<4;i++) puff(p.x, p.y, '#ffffff'); ring(p.x, p.y, T.color, CELL*1.1); }
  }
  for (const e of dead) killEnemy(e, p.x, p.y);
}

/* 敵をひとり道においてスタートさせる（通常出現とボスのしょうかんで共用） */
function spawnEnemy(k, d0){
  const E = ENEMIES[k];
  const hp = E.hp * hpScale(wave);
  enemies.push({ k, d: d0 || 0, hp, max: hp, slow:0, slowAmt:0,
                 wob: Math.random()*6.3, ph: Math.random()*6.3 });
}

/* 敵をたおしたときの共通処理（ごほうび・エフェクト・ずかん） */
function killEnemy(e, px, py){
  const idx = enemies.indexOf(e);
  if (idx < 0) return;
  enemies.splice(idx,1);
  if (unlock('en_' + e.k))
    floatTx(px, py - CELL*0.7, 'ずかんに とうろく！', '#b98ae0');
  const g = goldOf(e.k);
  stars += g;
  rec.kills++;                                            // じぶんきろく（保存はウェーブ終了時）
  floatTx(px, py, '+'+g, '#ffb43f');
  if (e.k === 'boss'){
    // ボス撃破は小さなお祝い＋なかまがひとかけつけてくれる
    celebrate({ conf: 36, rings: true, x: px, y: py, fanfare: 1 });
    cheerOne(px, py + CELL*1.2);
  }
  if (Math.random() < dropRate(e.k)) spawnGift(px, py);   // ときどきワザのプレゼントを落とす
  for (let i=0;i<14;i++) puff(px, py, ENEMIES[e.k].color);
  beep(520,.1,'sine',.035);
  syncHUD();
}

function gameOver(){

/* ==========================================================
   ずかん（あつめた記録はブラウザに残る）
   dex[id] = { w:入手ウェーブ, d:入手日, lv:とうたつレベル(おかしのみ) }
   ========================================================== */
let dex = {};
try{ dex = JSON.parse(localStorage.getItem('sweetTD.dex') || '{}') || {}; }catch(e){}
// 旧バージョンのセーブ（なかまID配列）からの引っこし
try{
  const old = JSON.parse(localStorage.getItem('sweetTD.col') || '[]');
  for (const id of old) if (CHARS.some(c => c.id === id) && !dex['ch_'+id]) dex['ch_'+id] = {};
  if (old.length){ localStorage.removeItem('sweetTD.col'); saveDex(); }
}catch(e){}
function saveDex(){ try{ localStorage.setItem('sweetTD.dex', JSON.stringify(dex)); }catch(e){} }
function dateStr(){
  const d = new Date();
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
/* はじめての登録なら true。いつ手に入れたかも残す */
function unlock(id){
  if (dex[id]) return false;
  dex[id] = { w: wave, d: dateStr() };
  saveDex();
  checkComplete();   // これが最後のひとりだったら、おかしの国がかんせいする
  return true;
}

/* ステージクリア（20ウェーブ）ごとのごほうび。なかまを1人むかえて、次のステージへ */
function stageClear(){
  const stageNo = wave / STAGE_WAVES;
  hearts = Math.min(maxHearts(), hearts + 3 + (hasCh('apple') ? 3 : 0));   // ごほうびにハートを回復
  const ch = CHARS.find(c => !dex['ch_'+c.id]);
  if (ch){
    unlock('ch_' + ch.id);
    // おためし用にストックを1つプレゼントし、あきがあればタスクバーにも自動ではる
    if (SKILLS.some(s => s.ch === ch.id)){
      items[ch.id] = Math.min(ITEM_MAX, items[ch.id] + 1);
      saveItems();
      if (pins.length < PIN_MAX && !pins.includes(ch.id)){ pins.push(ch.id); savePins(); }
    }
  }
  const got = CHARS.filter(c => dex['ch_'+c.id]).length;
  const done = got >= CHARS.length;
  ovT.textContent = (done && ch) ? 'おかしの国 かんせい！🏰' : 'ステージ ' + stageNo + ' クリア！🎉';
  ovB.innerHTML = '';
  if (ch){
    const th = charThumb(ch, 96);
    th.style.display = 'block'; th.style.margin = '0 auto 4px';
    ovB.append(th);
  }
  // Lv解放の節目なら いっしょにお知らせ
  let unlockMsg = '';
  if (wave === 60)  unlockMsg = '<br>🔓 おかしを <b>Lv4</b> まで つよくできるようになった！';
  if (wave === 100) unlockMsg = '<br>🔓 おかしを <b>Lv5</b> まで つよくできるようになった！';
  const d = document.createElement('div');
  d.innerHTML = (ch
    ? '<b>' + ch.name + '</b>（' + ch.title + '）が なかまになった！<br>✨ ' + ch.fx + ' ✨<br>なかま ' + got + ' / ' + CHARS.length +
      (done ? '<br>ぜんいん あつまったよ！ あなたは でんせつのえいゆう ✨' : '')
    : 'ハートが かいふくしたよ 💗<br>つぎのステージも がんばろう！') + unlockMsg;
  ovB.append(d);
  buildSkillBar();   // 新しいなかまのワザをすぐ使えるように
  ovBtn.textContent = 'つぎのステージへ ▶';
  // とじた直後に、なかまの応援パレードがよく見えるように
  ovBtn.onclick = () => {
    ov.classList.remove('on');

  ov.classList.add('on');

}

/* ---------- 図鑑モーダル ---------- */

btnCol.onclick = () => { buildColGrid(); colOv.classList.add('on'); beep(700,.08,'triangle',.04); };

/* 図鑑にのる全カード。pid は似顔絵の描き分けキー */
function dexList(){

    ...DEX_TOWERS.map(o => ({ ...o, cat:'tw', pid:o.id, hint:'おいてみると とうろくされるよ' })),
    ...DEX_ENEMIES.map(o => ({ ...o, cat:'en', pid:o.id, hint:'たおすと とうろくされるよ' })),

    ...LEGENDS.map(l => ({ id:'lg_'+l.id, pid:l.id, name:l.name, title:l.title, cat:'lg', fx:l.fx,

function buildColGrid(){
  const all = dexList();
  const list = colTab === 'all' ? all : all.filter(o => o.cat === colTab);
  colCount.textContent = list.filter(o => dex[o.id]).length + ' / ' + list.length;
  colStats.innerHTML =
    '<div class="cst best"><div class="ck">🏆 じぶんベスト</div><div class="cn">ウェーブ' + rec.bw + '</div></div>' +
    '<div class="cst"><div class="ck">たおしたかず</div><div class="cn">' + rec.kills + '</div></div>' +
    '<div class="cst"><div class="ck">ランキング(めやす)</div><div class="cn">' + (rec.bw > 0 ? 'じょうい' + rankPct() + '%' : '—') + '</div></div>';
  colHint.style.display = (colTab === 'ch' || colTab === 'all') ? '' : 'none';
  colHint.innerHTML = '📌 なかまをタップでバーに はる／はがす（' + pins.length + '/' + PIN_MAX + '）<br>いっぱいのときは いちばん左と こうたい';
  colDone.style.display = CHARS.every(c => dex['ch_'+c.id]) ? '' : 'none';
  colGrid.innerHTML = '';
  for (const o of list){
    const rec = dex[o.id];
    const d = document.createElement('div');
    d.className = 'cCard' + (rec ? '' : ' no');
    if (rec){
      d.append(charThumb(o, 64));
      let html = '<div class="cNm">' + o.name + '</div>';
      if (o.cat === 'tw' && rec.lv) html += '<div class="cLv">' + '★'.repeat(rec.lv) + '</div>';
      const isSk = o.cat === 'ch' && SKILLS.some(s => s.ch === o.pid);
      if (isSk) html += '<div class="cLv" style="color:var(--pink-d)">×' + (items[o.pid] || 0) + ' もってる</div>';
      html += '<div class="cTt">' + o.title + '</div>';
      if (o.fx) html += '<div class="cTt" style="color:#b98ae0">✨' + o.fx + '</div>';
      if (rec.d) html += '<div class="cGet">' + (rec.w ? 'ウェーブ' + rec.w + '・' : '') + rec.d + '</div>';
      d.insertAdjacentHTML('beforeend', html);
      // なかまはタップでワザバーに はる／はがす。0こなら おほしさまで買い足せる
      if (isSk){
        if (pins.includes(o.pid)) d.insertAdjacentHTML('beforeend', '<div class="cPin">📌</div>');
        d.style.cursor = 'pointer';
        d.onclick = () => {
          const sDef = SKILLS.find(s => s.ch === o.pid);
          if (!pins.includes(o.pid) && (items[o.pid] || 0) < 1){
            // 2回タップで1こ購入（スターの使い道）
            const cost = skillCost(sDef);
            if (buyWait === o.pid){
              buyWait = null;
              if (stars < cost){
                colHint.textContent = 'おほしさまが たりない…（⭐' + cost + '）';
                beep(160,.09,'square',.03,.7);
              } else {
                stars -= cost;
                items[o.pid] = Math.min(ITEM_MAX, (items[o.pid]||0) + 1); saveItems();
                beep(760,.1,'triangle',.05); syncHUD(); buildColGrid();
                colHint.innerHTML = o.name + 'を 1こ かった！<br>もういちどタップで はろう';
              }
            } else {
              buyWait = o.pid;
              colHint.innerHTML = '⭐' + cost + 'で ' + o.name + 'を 1こかう？<br>（もういちどタップで けってい）';
              beep(600,.06,'triangle',.04);
            }
            return;
          }
          buyWait = null;
          const r2 = togglePin(o.pid);
          beep(r2 === 'off' ? 480 : 760, .08, 'triangle', .04);
          buildColGrid();
          if (r2 === 'off'){
            colHint.textContent = o.name + 'を ずかんに もどしたよ';
          } else if (r2 && r2.swap){
            const sw = r2.swap === 'rpurin' ? 'にじいろプリン' : (CHARS.find(c => c.id === r2.swap) || {}).name;
            colHint.innerHTML = o.name + 'を はった！<br>（' + sw + 'は ずかんにもどったよ）';
          }
        };
      }
    } else if (o.legend){
      // でんせつはシルエットで「なにかがいる」感を出して期待させる
      d.append(silhouetteThumb(o.pid, 64));
      d.insertAdjacentHTML('beforeend',
        '<div class="cNm">？？？</div><div class="cTt" style="color:#b98ae0">✨' + o.hint + '</div>');
    } else {
      d.innerHTML = '<div style="font-size:32px;line-height:64px">？</div>' +
        '<div class="cNm">？？？</div><div class="cTt">' + o.hint + '</div>';
    }
    colGrid.append(d);
  }
  const gotAll = all.filter(o => dex[o.id]).length;
  colTotal.textContent = 'ぜんぶで ' + gotAll + ' / ' + all.length + ' とうろく';
}

/* ==========================================================
   なかまワザ（あつめたなかまが戦いを手伝ってくれる）
   スターの使い道でもある。ねだんはウェーブとともに上がる
   ========================================================== */
const SKILLS = [
  { ch:'purin',  name:'まもり',     base:70,  cd:12, needEnemy:true,  color:'#ffd98a', desc:'てき全員を3.5びょう足止め。とつげきをしのぐときに' },
  { ch:'choco',  name:'ばくだん',   base:110, cd:15, needEnemy:true,  color:'#a5713f', desc:'てき全体に大ダメージ（HPのわりあい）。ピンチの切りふだ' },
  { ch:'gumgum', name:'スロー',     base:60,  cd:10, needEnemy:true,  color:'#9be89b', desc:'てき全員を6びょうスロー。はやい敵のむれに' },
  { ch:'donut',  name:'かいふく',   base:120, cd:20, needEnemy:false, color:'#ff9ec9', desc:'ハート+4。まもりがくずれたあとに' },
  { ch:'taffy',  name:'マーチ',     base:90,  cd:25, needEnemy:false, color:'#9ed8ff', desc:'8びょう こうげきそくど2ばい。ボスがきたら' },
  { ch:'cake',   name:'おいわい',   base:90,  cd:18, needEnemy:true,  color:'#fff0b8', desc:'てき全体に小ダメージ。ざこそうじに' },
  { ch:'fairy',  name:'こな',       base:80,  cd:25, needEnemy:false, color:'#ffd0df', desc:'8びょう はんい1.4ばい。とどかない敵に' },
  { ch:'prince', name:'はた',       base:90,  cd:30, needEnemy:false, color:'#ff8f8f', desc:'10びょう ⭐2ばい。かせぎどきに' },
  { ch:'apple',  name:'いやし',     base:60,  cd:12, needEnemy:false, color:'#ff5a5a', desc:'ハート+2。かるくて安い回復' },
  { ch:'queen',  name:'いのり',     base:130, cd:45, needEnemy:false, color:'#dcebf8', desc:'ほかのワザのじゅんびを完了させる' },
  { ch:'king',   name:'ごうれい',   base:150, cd:30, needEnemy:false, color:'#ffe27a', desc:'8びょう こうげき2ばい。ボスやゴーレムに' },
  { ch:'rpurin', name:'おくりもの', base:100, cd:35, needEnemy:false, color:'#c9a7ff', desc:'プレゼントを2こもらう' },
];
let skCd = {}, skTick = -1;
for (const s of SKILLS) skCd[s.ch] = 0;
/* ワザの一時バフ（のこり秒数） */
let buffs = { spd:0, dmg:0, rng:0, gold:0 };
function hasCh(id){ return id === 'rpurin' ? !!dex['sp_rpurin'] : !!dex['ch_' + id]; }
const skillCost = s => Math.round(s.base * (1 + wave*0.03) * (hasCh('queen') ? 0.8 : 1));

/* ---------- なかまの所持数（つかうと1こへる。ドロップでふえて、ブラウザに残る） ---------- */
const ITEM_MAX = 99;
let items = {};
for (const s of SKILLS) items[s.ch] = 0;
try{
  const it = JSON.parse(localStorage.getItem('sweetTD.items') || '{}');
  for (const k in items) if (typeof it[k] === 'number') items[k] = Math.max(0, Math.min(ITEM_MAX, it[k]|0));
}catch(e){}
function saveItems(){ try{ localStorage.setItem('sweetTD.items', JSON.stringify(items)); }catch(e){} }
// 消耗式に変わる前のセーブへの引っこし：もっているなかまに1こずつ保証する（1回だけ）
try{
  if (!localStorage.getItem('sweetTD.itemsV2')){
    for (const s of SKILLS) if (hasCh(s.ch) && items[s.ch] < 1) items[s.ch] = 1;
    localStorage.setItem('sweetTD.itemsV2', '1');
    saveItems();
  }
}catch(e){}

/* ---------- タスクバーのピン（はったなかま。7こまで・ブラウザに残る） ---------- */
const PIN_MAX = 7;
let pins = null;
try{ pins = JSON.parse(localStorage.getItem('sweetTD.pins') || 'null'); }catch(e){}
if (Array.isArray(pins)){
  pins = pins.filter(ch => SKILLS.some(s => s.ch === ch)).slice(0, PIN_MAX);
} else {
  // はじめて（旧バージョンから）のときは、もっているワザもちを自動でならべる
  pins = ['purin','choco','gumgum','donut'].filter(ch => hasCh(ch));
}
function savePins(){ try{ localStorage.setItem('sweetTD.pins', JSON.stringify(pins)); }catch(e){} }
/* はる／はがすの切り替え。'on'／'off'／'none'／{swap:もどったなかま} を返す。
   はがしても数はへらない（ずかんにもどるだけ）。へるのはワザを使ったときだけ。
   バーがいっぱいのときは、いちばん左のなかまが ずかんにもどって こうたい */
function togglePin(ch){
  const i = pins.indexOf(ch);
  if (i >= 0){ pins.splice(i, 1); savePins(); buildSkillBar(); return 'off'; }
  if (items[ch] < 1) return 'none';
  let swapped = null;
  if (pins.length >= PIN_MAX) swapped = pins.shift();
  pins.push(ch); savePins(); buildSkillBar();
  return swapped ? { swap: swapped } : 'on';
}

/* たおした敵がプレゼントを落とす確率。大物ほど落としやすい。
   にじいろプリン（ログインボーナス7日目のなかま）がいると1.5倍 */
const DROP_RATE = { golem:0.35, boss:0.6 };
const dropRate = k => (DROP_RATE[k] || 0.07) * (dex['sp_rpurin'] ? 1.5 : 1);

/* プレゼントキャンディがワザバーへ飛んでいく演出 */
let gifts = [];
function spawnGift(x, y){
  const opts = SKILLS.filter(s => hasCh(s.ch) && items[s.ch] < ITEM_MAX);   // 99こでカンスト
  if (!opts.length) return;
  const s = opts[(Math.random()*opts.length)|0];
  // はってあるスロットの位置へ飛ばす（はっていないワザは中央へ）
  const pi = pins.indexOf(s.ch);
  const frac = pi >= 0 ? (Math.min(pi, PIN_MAX-1) + 0.5) / PIN_MAX : 0.5;
  gifts.push({ sx:x, sy:y, x, y,
               tx: frac * COLS*CELL, ty:ROWS*CELL - CELL*0.15,
               t:0, life:0.8, ch:s.ch, rot:Math.random()*6.3 });
}

function useSkill(s){
  if (over || !hasCh(s.ch) || skCd[s.ch] > 0) return;
  if (s.needEnemy && !enemies.length){ beep(160,.09,'square',.03,.7); return; }
  if (items[s.ch] < 1){ beep(160,.09,'square',.03,.7); return; }
  items[s.ch]--; saveItems();          // 1回つかうと1こへる
  skCd[s.ch] = s.cd;
  const W = COLS*CELL, H = ROWS*CELL;
  if (s.ch === 'purin'){
    for (const e of enemies) e.stun = 3.5;
    ring(W/2, H/2, '#ffd98a', H*0.7);
    ring(W/2, H/2, '#ffffff', H*0.5);
    floatTx(W/2, H*0.4, 'まもりのたて！', '#e0a52e');
    beep(500,.2,'triangle',.06);
    setTimeout(()=>beep(660,.18,'triangle',.05),120);
  } else if (s.ch === 'choco'){
    for (const e of [...enemies]){
      const p = posAt(e.d);
      e.hp -= e.max*0.28 + 25;      // わりあいダメージなので後半でも役に立つ
      for (let i=0;i<6;i++) puff(p.x, p.y, '#a5713f');
      if (e.hp <= 0) killEnemy(e, p.x, p.y);
    }
    ring(W/2, H/2, '#a5713f', H*0.8);
    ring(W/2, H/2, '#ffffff', H*0.55);
    floatTx(W/2, H*0.4, 'チョコばくだん！', '#a5713f');
    beep(180,.35,'sawtooth',.07,.5);
  } else if (s.ch === 'gumgum'){
    for (const e of enemies){ e.slow = 6; e.slowAmt = 0.55; }
    ring(W/2, H/2, '#9be89b', H*0.7);
    floatTx(W/2, H*0.4, 'ぷるぷるスロー！', '#4faf5f');
    beep(420,.25,'sine',.05,.7);
  } else if (s.ch === 'donut'){
    hearts = Math.min(maxHearts(), hearts + 4);
    floatTx(W/2, H*0.4, 'ハートかいふく💗', '#ff6f9c');

function buildSkillBar(){
  // つかいきったなかまはバーからはずれる（この整理では1こへらさない）
  const alive = pins.filter(ch => SKILLS.some(s => s.ch === ch) && hasCh(ch) && items[ch] > 0);
  if (alive.length !== pins.length){ pins = alive; savePins(); }
  skillBar.innerHTML = '';
  // はってあるなかまのワザボタン（さいだい7こ・横スクロール）
  for (const ch of pins){
    const s = SKILLS.find(x => x.ch === ch);
    const b = document.createElement('button');
    b.className = 'sk';
    b.dataset.ch = ch;
    b.append(charThumb({ pid:ch }, 30));
    b.insertAdjacentHTML('beforeend',
      '<div class="skN">' + s.name + '</div><div class="skC"></div>' +
      '<div class="skCd" style="display:none"></div>');
    // タップで発動、ながおし（0.55秒）でずかんにもどす
    let lpTimer = null, lpFired = false;
    const cancelLp = () => { if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; } };
    b.addEventListener('pointerdown', () => {
      lpFired = false;
      lpTimer = setTimeout(() => {
        lpFired = true;
        const nm = ch === 'rpurin' ? 'にじいろプリン' : (CHARS.find(c => c.id === ch) || {}).name;
        togglePin(ch);
        floatTx(COLS*CELL/2, ROWS*CELL - CELL*0.6, nm + 'を ずかんにもどした', '#b98ae0');
        beep(480,.1,'triangle',.04);
      }, 550);
    });
    b.addEventListener('pointerup', cancelLp);
    b.addEventListener('pointerleave', cancelLp);
    b.addEventListener('pointercancel', cancelLp);
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.onclick = () => { if (lpFired){ lpFired = false; return; } useSkill(s); };
    skillBar.append(b);
  }
  // のこりは「はれる」空きスロット
  for (let i = skillBar.children.length; i < PIN_MAX; i++){
    const b = document.createElement('button');
    b.className = 'sk empty';
    b.disabled = true;
    b.innerHTML = '<div style="font-size:16px;line-height:30px">＋</div><div class="skN">ずかんではる</div>';
    skillBar.append(b);
  }
  syncSkills();
}
function syncSkills(){
  for (const b of skillBar.children){
    if (!b.dataset.ch) continue;
    const s = SKILLS.find(x => x.ch === b.dataset.ch);
    if (!hasCh(s.ch)) continue;
    const st = items[s.ch];
    b.querySelector('.skC').textContent = 'のこり ×' + st;
    const cd = skCd[s.ch], cdEl = b.querySelector('.skCd');
    cdEl.style.display = cd > 0 ? '' : 'none';
    if (cd > 0) cdEl.textContent = Math.ceil(cd);
    // disabled属性だと「ながおしではがす」もできなくなるので、見た目だけ無効化
    // （発動条件はuseSkill側でチェックずみ）
    b.classList.toggle('off', over || cd > 0 || st < 1);
  }
}

   ========================================================== */
function todayStartStars(){
  // きょうのぶんのスタートおほしさまボーナス（リトライしても有効）
  try{
    const tb = JSON.parse(localStorage.getItem('sweetTD.todayStars') || 'null');
    if (tb && tb.d === dateStr()) return tb.n;
  }catch(e){}
  return 0;
}
function applyLoginReward(day){
  const addStart = n => {
    try{ localStorage.setItem('sweetTD.todayStars', JSON.stringify({ d: dateStr(), n })); }catch(e){}
    stars += n;                          // いま遊んでいるぶんにもすぐ足す
    return 'きょうは スタートおほしさま <b>+' + n + '</b>！';
  };
  const owned = SKILLS.filter(s => hasCh(s.ch));
  const addStock = n => {
    if (!owned.length) return addStart(50 + 50*n);   // まだワザがないうちはおほしさまに
    const names = [];
    for (let i=0;i<n;i++){
      const s = owned[(Math.random()*owned.length)|0];
      items[s.ch] = Math.min(ITEM_MAX, items[s.ch] + 1);
      names.push(s.name);
    }
    saveItems();
    return 'ワザのストック <b>+' + n + '</b>（' + names.join('・') + '）！';
  };
  switch(day){
    case 1: return addStart(100);
    case 2: return addStock(1);
    case 3: return addStart(200);
    case 4: return addStock(2);
    case 5: return addStart(300);
    case 6:
      if (!owned.length) return addStart(300);
      for (const s of owned) items[s.ch] = Math.min(ITEM_MAX, items[s.ch] + 1);
      saveItems();
      return 'もっているワザの ストック <b>ぜんぶ+1</b>！';
    default:
      if (!dex['sp_rpurin']){
        unlock('sp_rpurin');
        if (pins.length < PIN_MAX && !pins.includes('rpurin')){ pins.push('rpurin'); savePins(); }
        return 'でんせつのなかま <b>にじいろプリン</b> が なかまに！！<br>✨ プレゼントが おちやすくなる ✨';
      }
      return addStart(500);
  }
}
function checkLogin(){
  const today = dateStr();
  let lg = { last:'', streak:0 };
  try{ lg = JSON.parse(localStorage.getItem('sweetTD.login') || '{"last":"","streak":0}'); }catch(e){}
  if (lg.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yest = y.getFullYear() + '/' + String(y.getMonth()+1).padStart(2,'0') + '/' + String(y.getDate()).padStart(2,'0');
  const day = (lg.last === yest) ? (lg.streak % 7) + 1 : 1;   // 途切れたら1日目から
  lg.last = today; lg.streak = day;
  try{ localStorage.setItem('sweetTD.login', JSON.stringify(lg)); }catch(e){}
  const msg = applyLoginReward(day);
  buildSkillBar();      // ごほうびのストックや新しいなかまをバーへ反映
  let st = '<div style="display:flex;gap:5px;justify-content:center;margin:8px 0">';
  for (let i=1;i<=7;i++){
    const on = i <= day;
    st += '<div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;' +
      (on ? 'background:linear-gradient(180deg,#ffb3dc,#ff8fc4);color:#fff;box-shadow:0 2px 0 #e05f9e'
          : 'background:rgba(255,255,255,.75);opacity:.6') +
      (i === day ? ';outline:3px solid #ffd76e' : '') + '">' + (on ? '✓' : i) + '</div>';
  }
  st += '</div>';
  ovT.textContent = 'きょうのプレゼント🎁';
  ovB.innerHTML = '<b>' + day + 'にちめ</b>の ログインボーナス！' + st + msg +
    (day === 6 ? '<br><span style="opacity:.7">あしたは でんせつのなかまが…！？</span>' : '');
  ovShare.style.display = 'none';
  ovBtn.textContent = 'うけとる ✨';
  ovBtn.onclick = () => { ov.classList.remove('on'); syncHUD(); };
  ov.classList.add('on');

  if (day >= 7) celebrate({ rays: 3, conf: 160, flash: true, fanfare: 2 });
  else celebrate({ conf: 24 + day*6 });
  beep(700,.12,'triangle',.05);
  setTimeout(()=>beep(930,.15,'triangle',.05),130);
}

function makeShareCard(){
  const W2 = 1200, H2 = 630;
  const c = document.createElement('canvas');
  c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, H2);
  bg.addColorStop(0,'#ffe6f3'); bg.addColorStop(0.55,'#f3e8ff'); bg.addColorStop(1,'#e6f6ff');
  g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
  // キラキラ
  for (let i=0;i<45;i++){
    const x = Math.random()*W2, y = Math.random()*H2, r = 5 + Math.random()*12;
    g.save(); g.translate(x, y); g.rotate(Math.random()*6.3);
    g.fillStyle = 'rgba(255,255,255,' + (0.35 + Math.random()*0.5) + ')';
    g.beginPath();
    for (let j=0;j<4;j++){
      const a = j*Math.PI/2;
      g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      g.quadraticCurveTo(0, 0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
    }
    g.closePath(); g.fill(); g.restore();
  }
  g.textAlign = 'center';
  g.fillStyle = '#e05f9e';
  g.font = "800 48px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillText('まほうのおかしの国をまもって', W2/2, 120);
  g.fillStyle = '#6b4a63';
  g.font = "800 92px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillText('ウェーブ ' + Math.max(1, wave, rec.bw) + ' とうたつ！', W2/2, 260);
  const got = dexList().filter(o => o.cat === 'ch' && dex[o.id]).length;
  g.font = "800 38px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillText('👑 なかま ' + got + 'にん　⭐ たおしたかず ' + rec.kills, W2/2, 340);
  // なかまの似顔絵をならべる（いなければおかしのようせい）
  const picks = dexList().filter(o => o.cat === 'ch' && dex[o.id]).map(o => o.pid);
  const fill = ['tw_candy','tw_ice','tw_choco','tw_star'];
  while (picks.length < 5) picks.push(fill[picks.length % 4]);
  picks.slice(0, 5).forEach((pid, i) => {
    const pc = document.createElement('canvas');
    pc.width = pc.height = 150;
    drawPortrait(pc.getContext('2d'), pid, 150);
    g.drawImage(pc, W2/2 - 375 + i*150, 380);
  });
  g.font = "800 28px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillStyle = '#b98ae0';
  g.fillText('marie50924-dev.github.io/tower-defense', W2/2, H2 - 35);
  return c;
}

/* ==========================================================
   おかしの国のパノラマ（あつめたなかまが住みつく一枚絵）
   ========================================================== */
const kingOv = $('kingOv'), kingCv = $('kingCv'), kingCap = $('kingCap');

function drawKingdom(g, W, H){
  const TAU = 6.2832;
  const ell = (x,y,rx,ry,col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); g.fill(); };
  const rr2 = (x,y,w,h,r) => {
    const k = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+k,y);
    g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
    g.arcTo(x,y+h,x,y,k);     g.arcTo(x,y,x+w,y,k);
    g.closePath();
  };
  const star4 = (x,y,r,col,a) => {
    g.save(); g.translate(x,y); g.rotate(a||0); g.fillStyle = col;
    g.beginPath();
    for (let i=0;i<4;i++){
      const t = i*Math.PI/2;
      g.lineTo(Math.cos(t)*r, Math.sin(t)*r);
      g.quadraticCurveTo(0,0, Math.cos(t+Math.PI/4)*r*0.22, Math.sin(t+Math.PI/4)*r*0.22);
    }
    g.closePath(); g.fill(); g.restore();
  };
  // きまった見た目になるよう、種つきの乱数
  let seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;

  /* --- そら --- */
  const sky = g.createLinearGradient(0,0,0,H*0.62);
  sky.addColorStop(0,'#a8d4f2'); sky.addColorStop(0.5,'#ffd9ec'); sky.addColorStop(1,'#fff0d6');
  g.fillStyle = sky; g.fillRect(0,0,W,H*0.62);
  const sun = g.createRadialGradient(W*0.78,H*0.28,0, W*0.78,H*0.28,W*0.32);
  sun.addColorStop(0,'rgba(255,246,205,.95)'); sun.addColorStop(0.25,'rgba(255,232,170,.45)'); sun.addColorStop(1,'rgba(255,232,170,0)');
  g.fillStyle = sun; g.fillRect(0,0,W,H*0.62);
  ell(W*0.78,H*0.28,W*0.042,W*0.042,'#fff8dd');
  // くも（やわらかいブロッブの重なり）
  const cloud = (x,y,s,a) => {
    g.globalAlpha = a;
    for (const [dx,dy,r] of [[-1,0,0.55],[0,-0.32,0.7],[1,0.02,0.5],[0.1,0.18,0.85]])

    rr2(W/2 - W*0.155, H*0.085, W*0.31, H*0.055, H*0.028); g.fill();
    g.strokeStyle = '#d99a1e'; g.lineWidth = W*0.0025;
    rr2(W/2 - W*0.155, H*0.085, W*0.31, H*0.055, H*0.028); g.stroke();
    g.font = "800 " + (W*0.03) + "px 'Hiragino Maru Gothic ProN',sans-serif";
    g.fillStyle = '#a06a10';
    g.fillText('🎉 ぜんいん だいしゅうごう！ 🎉', W/2, H*0.113);
    let doneD = '';
    try{ doneD = localStorage.getItem('sweetTD.done') || ''; }catch(e){}
    if (doneD){
      g.font = "800 " + (W*0.022) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      g.fillStyle = 'rgba(107,74,99,.75)';
      g.textAlign = 'right';
      g.fillText('かんせい ' + doneD, W*0.955, H*0.955);
      g.textAlign = 'center';
    }
  }
  return { got, lgGot, complete };
}

function buildKingdom(){
  const w = kingOv.clientWidth - 24 || 380;
  const h = Math.round(w * 0.78);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  kingCv.width = w*dpr; kingCv.height = h*dpr;
  kingCv.style.height = h + 'px';
  const g = kingCv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const r = drawKingdom(g, w, h);
  kingCap.textContent = r.complete
    ? '🏆 ずかんぜんいんの かんせいの一枚！ ようせいも てきのみんなも おまつりだよ 🎉'
    : r.got >= 12 && r.lgGot >= 3
    ? '🏰 だいにぎわい！ ずかんをコンプリートすると かんせいの一枚に…✨'
    : 'なかま ' + r.got + '/12・でんせつ ' + r.lgGot + '/3 が くらしているよ。あつめるほど にぎやかに✨';
}

/* ---------- なかまの似顔絵（Canvasに直接描く） ---------- */
function charThumb(ch, size){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size + 'px'; c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  drawPortrait(g, ch.pid || ch.id, size);
  return c;
}

/* まだ出会っていないでんせつの、うすむらさきの影 */
function silhouetteThumb(pid, size){
  const c = charThumb({ pid }, size);
  const g = c.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#c3b3d6';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

function drawPortrait(g, id, S){
  const TAU = 6.2832, M = S/2, R = S*0.27;
  const rrect = (x,y,w,h,r) => {
    const k = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+k,y);
    g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
    g.arcTo(x,y+h,x,y,k);     g.arcTo(x,y,x+w,y,k);
    g.closePath();
  };
  const ball = (x,y,r,col,dark) => {
    const gr = g.createRadialGradient(x-r*0.35, y-r*0.45, r*0.1, x, y, r*1.12);
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.35,col); gr.addColorStop(1,dark);
    g.fillStyle = gr;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    g.globalAlpha = .7; g.strokeStyle = dark; g.lineWidth = r*0.08;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.stroke(); g.globalAlpha = 1;
  };
  const face = (x,y,r,mood) => {
    g.fillStyle = 'rgba(255,120,165,.4)';
    for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.5, y+r*0.18, r*0.16, 0, TAU); g.fill(); }
    if (mood === 'angry'){
      g.strokeStyle = '#4a3348'; g.lineWidth = r*0.08; g.lineCap = 'round';
      for (const s of [-1,1]){
        g.beginPath(); g.moveTo(x+s*r*0.44, y-r*0.42); g.lineTo(x+s*r*0.15, y-r*0.29); g.stroke();
      }
    }
    g.fillStyle = '#503a52';
    for (const s of [-1,1]){ g.beginPath(); g.ellipse(x+s*r*0.26, y-r*0.05, r*0.09, r*0.13, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#fff';
    for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.22, y-r*0.1, r*0.045, 0, TAU); g.fill(); }
    g.strokeStyle = '#503a52'; g.lineWidth = r*0.06; g.lineCap = 'round';
    if (mood === 'angry'){
      g.beginPath(); g.arc(x, y+r*0.38, r*0.13, Math.PI*1.15, Math.PI*1.85); g.stroke();
    } else {
      g.beginPath(); g.arc(x, y+r*0.16, r*0.13, Math.PI*0.15, Math.PI*0.85); g.stroke();
    }
  };
  const star = (x,y,r,col) => {
    g.save(); g.translate(x,y); g.fillStyle = col;
    g.beginPath();
    for (let i=0;i<4;i++){
      const a = i*Math.PI/2;
      g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      g.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
    }
    g.closePath(); g.fill(); g.restore();
  };
  g.clearRect(0,0,S,S);

  if (id.slice(0,3) === 'tw_'){
    /* ---- おかし（タワー）のようせい ---- */
    const key = id.slice(3), T = TOWERS[key];
    // はね（カードの白地でも見えるようにうすいラベンダー）
    g.fillStyle = 'rgba(201,167,255,.4)';
    for (const s of [-1,1]){
      g.beginPath(); g.ellipse(M+s*R*0.95, M-R*0.15, R*0.5, R*0.28, s*0.6, 0, TAU); g.fill();
    }
    // マカロンのだい
    g.fillStyle = '#fff';
    rrect(M-R*0.95, M+R*0.6, R*1.9, R*0.5, R*0.25); g.fill();
    g.fillStyle = 'rgba(224,95,158,.15)';
    rrect(M-R*0.95, M+R*0.82, R*1.9, R*0.28, R*0.14); g.fill();
    g.strokeStyle = 'rgba(160,120,160,.35)'; g.lineWidth = 1.2;
    rrect(M-R*0.95, M+R*0.6, R*1.9, R*0.5, R*0.25); g.stroke();
    ball(M, M, R, T.color, T.dark);
    if (key === 'candy'){
      g.fillStyle = '#fff'; g.fillRect(M-R*0.05, M-R*1.35, R*0.1, R*0.4);
      g.fillStyle = T.color;
      g.beginPath(); g.arc(M, M-R*1.45, R*0.36, 0, TAU); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = R*0.09;
      g.beginPath(); g.arc(M, M-R*1.45, R*0.18, 0, 4.6); g.stroke();
      g.strokeStyle = T.dark; g.lineWidth = R*0.05;
      g.beginPath(); g.arc(M, M-R*1.45, R*0.36, 0, TAU); g.stroke();
    } else if (key === 'ice'){
      g.fillStyle = '#eaf8ff'; g.strokeStyle = '#8fd0f0'; g.lineWidth = R*0.05;
      for (const [dx,h] of [[-0.34,0.34],[0,0.52],[0.34,0.34]]){
        g.beginPath();
        g.moveTo(M+dx*R, M-R*(1.0+h));
        g.lineTo(M+dx*R+R*0.15, M-R*0.95);
        g.lineTo(M+dx*R, M-R*0.8);
        g.lineTo(M+dx*R-R*0.15, M-R*0.95);
        g.closePath(); g.fill(); g.stroke();
      }
    } else if (key === 'choco'){
      g.save(); g.translate(M, M-R*1.15); g.rotate(-0.2);
      g.fillStyle = '#6b3f1f';
      rrect(-R*0.42, -R*0.24, R*0.84, R*0.48, R*0.08); g.fill();
      g.fillStyle = 'rgba(255,255,255,.25)';
      for (let i=0;i<3;i++) for (let j=0;j<2;j++)
        g.fillRect(-R*0.36+i*R*0.26, -R*0.18+j*R*0.22, R*0.2, R*0.16);
      g.restore();
      g.fillStyle = '#ff6f9c';
      g.beginPath(); g.arc(M+R*0.4, M-R*1.42, R*0.13, 0, TAU); g.fill();
    } else {
      g.fillStyle = '#ffe27a'; g.strokeStyle = '#e0a52e'; g.lineWidth = R*0.06;
      g.beginPath();
      for (let i=0;i<5;i++){
        const a = -Math.PI/2 + i*TAU/5, b = a + Math.PI/5;
        g.lineTo(M+Math.cos(a)*R*0.42, M-R*1.25+Math.sin(a)*R*0.42);
        g.lineTo(M+Math.cos(b)*R*0.18, M-R*1.25+Math.sin(b)*R*0.18);
      }
      g.closePath(); g.fill(); g.stroke();
    }
    face(M, M, R*0.85);
  } else if (id.slice(0,3) === 'en_'){
    /* ---- てき ---- */
    const key = id.slice(3), E = ENEMIES[key];
    const angry = key === 'boss' || key === 'golem';
    const grad = (x,y,r) => {
      const gr = g.createRadialGradient(x-r*0.3, y-r*0.4, r*0.1, x, y, r*1.2);
      gr.addColorStop(0,'#fff'); gr.addColorStop(0.35,E.color); gr.addColorStop(1,E.dark);
      return gr;
    };
    if (key === 'tank'){
      g.fillStyle = grad(M, M, R);
      rrect(M-R*1.05, M-R*0.9, R*2.1, R*1.8, R*0.62); g.fill();
      g.globalAlpha = .7; g.strokeStyle = E.dark; g.lineWidth = R*0.07;
      rrect(M-R*1.05, M-R*0.9, R*2.1, R*1.8, R*0.62); g.stroke(); g.globalAlpha = 1;
    } else if (key === 'golem'){
      g.fillStyle = grad(M, M, R);
      rrect(M-R*1.05, M-R*1.0, R*2.1, R*1.95, R*0.5); g.fill();
      g.globalAlpha = .7; g.strokeStyle = E.dark; g.lineWidth = R*0.07;
      rrect(M-R*1.05, M-R*1.0, R*2.1, R*1.95, R*0.5); g.stroke(); g.globalAlpha = 1;
      g.fillStyle = E.dark; g.globalAlpha = .8;
      for (const [dx,len] of [[-0.55,0.42],[-0.1,0.62],[0.4,0.34]]){
        rrect(M+dx*R-R*0.09, M-R*1.0, R*0.18, R*len, R*0.09); g.fill();
      }
      g.globalAlpha = 1;
    } else {
      if (key === 'crystal'){
        g.fillStyle = '#eaf8ff'; g.strokeStyle = '#8fc8e8'; g.lineWidth = R*0.06;
        for (let i=0;i<5;i++){
          const a = Math.PI*1.1 + i*Math.PI*0.2;
          const nx = Math.cos(a), ny = Math.sin(a);
          const bx = M+nx*R*0.8, by = M+ny*R*0.8;
          g.beginPath();
          g.moveTo(bx-ny*R*0.16, by+nx*R*0.16);
          g.lineTo(bx+nx*R*0.62, by+ny*R*0.62);
          g.lineTo(bx+ny*R*0.16, by-nx*R*0.16);
          g.closePath(); g.fill(); g.stroke();
        }
      }
      if (key === 'bat'){
        g.fillStyle = 'rgba(150,110,220,.75)';
        for (const s of [-1,1]){
          g.beginPath();
          g.moveTo(M+s*R*0.72, M-R*0.05);
          g.quadraticCurveTo(M+s*R*1.5, M-R*0.9, M+s*R*1.7, M-R*0.15);
          g.quadraticCurveTo(M+s*R*1.35, M+R*0.15, M+s*R*0.72, M+R*0.15);
          g.closePath(); g.fill();
        }
      }
      if (key === 'fast'){
        for (const s of [-1,1]){
          g.save(); g.translate(M+s*R*0.4, M-R*0.95); g.rotate(s*0.28);
          g.fillStyle = grad(0, 0, R*0.5);
          g.beginPath(); g.ellipse(0, -R*0.25, R*0.2, R*0.55, 0, 0, TAU); g.fill();
          g.fillStyle = 'rgba(255,175,205,.85)';
          g.beginPath(); g.ellipse(0, -R*0.22, R*0.1, R*0.35, 0, 0, TAU); g.fill();
          g.restore();
        }
      }
      ball(M, M, R, E.color, E.dark);
      if (key === 'bat'){
        g.fillStyle = E.dark;
        for (const s of [-1,1]){
          g.beginPath();
          g.moveTo(M+s*R*0.68, M-R*0.5);
          g.lineTo(M+s*R*0.3,  M-R*0.78);
          g.lineTo(M+s*R*0.85, M-R*1.05);
          g.closePath(); g.fill();
        }
      }
      if (key === 'boss'){
        g.fillStyle = '#ffd76e'; g.strokeStyle = '#d99a1e'; g.lineWidth = R*0.05;
        g.beginPath();
        g.moveTo(M-R*0.42, M-R*0.85); g.lineTo(M-R*0.42, M-R*1.2); g.lineTo(M-R*0.18, M-R*1.0);
        g.lineTo(M, M-R*1.3); g.lineTo(M+R*0.18, M-R*1.0); g.lineTo(M+R*0.42, M-R*1.2);
        g.lineTo(M+R*0.42, M-R*0.85);
        g.closePath(); g.fill(); g.stroke();
        g.fillStyle = '#ff6f9c';
        g.beginPath(); g.arc(M, M-R*1.0, R*0.07, 0, TAU); g.fill();
      }
    }
    face(M, M+(key==='golem'||key==='tank' ? 0 : R*0.02), R*0.82, angry ? 'angry' : '');
  } else if (id === 'whale'){
    /* ---- ほしのクジラ ---- */
    const y = M + S*0.02;
    const gr = g.createLinearGradient(0, y - R, 0, y + R);
    gr.addColorStop(0,'#8fb0e8'); gr.addColorStop(1,'#5a7fc8');
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(M - S*0.02, y, R*1.3, R*0.85, 0, 0, TAU); g.fill();
    // しっぽ
    g.beginPath();
    g.moveTo(M + R*1.1, y - R*0.05);
    g.quadraticCurveTo(M + R*1.65, y - R*0.75, M + R*1.8, y - R*0.35);
    g.quadraticCurveTo(M + R*1.6, y - R*0.02, M + R*1.5, y + R*0.12);
    g.quadraticCurveTo(M + R*1.72, y + R*0.55, M + R*1.45, y + R*0.6);
    g.quadraticCurveTo(M + R*1.2, y + R*0.32, M + R*1.1, y + R*0.15);
    g.closePath(); g.fill();
    // しろいおなか
    g.fillStyle = '#dfe9fb';
    g.beginPath(); g.ellipse(M - S*0.02, y + R*0.38, R*1.1, R*0.4, 0, 0, TAU); g.fill();
    // ほしもよう
    star(M - R*0.55, y - R*0.35, S*0.032, '#fff');
    star(M + R*0.25, y - R*0.48, S*0.042, '#ffe27a');
    star(M - R*0.05, y - R*0.05, S*0.026, '#fff');
    // あたまのうえの ほしのしお
    g.strokeStyle = '#bfe0ff'; g.lineWidth = S*0.014; g.lineCap = 'round';
    g.beginPath(); g.moveTo(M - R*0.5, y - R*0.82); g.lineTo(M - R*0.5, y - R*1.1); g.stroke();
    star(M - R*0.5, y - R*1.28, S*0.05, '#bfe0ff');
    face(M - R*0.55, y + R*0.02, R*0.52);
  } else if (id === 'phoenix'){
    /* ---- ふしちょう ---- */
    const y = M + S*0.03;
    for (const s of [-1,1]){
      g.save(); g.translate(M + s*R*0.75, y - R*0.1); g.rotate(s*0.5);
      g.fillStyle = 'rgba(255,170,80,.95)';
      g.beginPath(); g.ellipse(0, 0, R*0.7, R*0.35, s*0.5, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,214,110,.9)';
      g.beginPath(); g.ellipse(s*R*0.1, R*0.12, R*0.45, R*0.22, s*0.5, 0, TAU); g.fill();
      g.restore();
    }
    // しっぽのほのお
    g.lineCap = 'round';
    g.strokeStyle = '#ff9a4a'; g.lineWidth = S*0.024;
    g.beginPath(); g.moveTo(M - R*0.05, y + R*0.6); g.quadraticCurveTo(M - R*0.5, y + R*1.1, M - R*0.75, y + R*0.9); g.stroke();
    g.strokeStyle = '#ffd76e'; g.lineWidth = S*0.02;
    g.beginPath(); g.moveTo(M + R*0.1, y + R*0.6); g.quadraticCurveTo(M + R*0.5, y + R*1.15, M + R*0.72, y + R*0.95); g.stroke();
    ball(M, y, R*0.85, '#ffb35a', '#e07028');
    // あたまのかざりばね
    g.strokeStyle = '#ffd76e'; g.lineWidth = S*0.018;
    for (const [dx,len] of [[-0.25,0.5],[0,0.65],[0.25,0.5]]){
      g.beginPath();
      g.moveTo(M + dx*R*0.6, y - R*0.72);
      g.quadraticCurveTo(M + dx*R, y - R*(0.72+len), M + dx*R*1.4, y - R*(0.55+len));
      g.stroke();
    }
    face(M, y, R*0.7);
  } else if (id === 'chronos'){
    /* ---- クロノスちょうろう（とけいのこうらのカメ） ---- */
    const y = M + S*0.05;
    g.fillStyle = '#9bc48f';
    for (const dx of [-0.85, 0.85]){
      g.beginPath(); g.ellipse(M + dx*R, y + R*0.5, R*0.26, R*0.18, 0, 0, TAU); g.fill();
    }
    const gr2 = g.createRadialGradient(M - R*0.3, y - R*0.5, R*0.2, M, y, R*1.3);
    gr2.addColorStop(0,'#cfe8b8'); gr2.addColorStop(1,'#7fae6a');
    g.fillStyle = gr2;
    g.beginPath(); g.ellipse(M + R*0.1, y - R*0.05, R*1.05, R*0.8, 0, 0, TAU); g.fill();
    g.strokeStyle = '#5f8a4e'; g.lineWidth = S*0.012;
