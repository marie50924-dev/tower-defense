<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd9ec">
<title>まほうのおかしの国をまもって</title>
<style>
  :root{
    --pink:#ff8fc4;
    --pink-d:#e05f9e;
    --lav:#c9a7ff;
    --mint:#8fe3c4;
    --cream:#fff6e9;
    --ink:#6b4a63;
    --card:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    font-weight:800;
    color:var(--ink);
    background:
      radial-gradient(90% 60% at 20% 0%,  #fff0f8 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 30%, #eef0ff 0%, transparent 60%),
      linear-gradient(180deg,#ffe6f3 0%, #f3e8ff 55%, #e6f6ff 100%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    overflow-x:hidden;user-select:none;
  }
  #app{width:100%;max-width:480px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}

  /* ---------- HUD ---------- */
  #hud{display:flex;gap:6px}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    box-shadow:0 4px 14px rgba(190,140,180,.22);backdrop-filter:blur(6px);
  }
  .stat{flex:1;padding:6px 4px;text-align:center;line-height:1.1}
  .stat .k{font-size:10px;opacity:.6;letter-spacing:.06em}
  .stat .v{font-size:19px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:3px}
  #hpBox.low .v{color:#ff5a8a;animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.45}}

  /* ---------- board ---------- */
  #wrap{position:relative;align-self:center}
  canvas{display:block;border-radius:20px;touch-action:none;
    box-shadow:0 8px 26px rgba(180,130,175,.3), inset 0 0 0 3px rgba(255,255,255,.85)}

  /* ---------- bottom panel ---------- */
  #panel{min-height:96px}
  #shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px}
  .tw{
    border:2px solid transparent;border-radius:14px;padding:6px 2px 5px;
    background:rgba(255,255,255,.6);cursor:pointer;text-align:center;line-height:1.15;
    transition:transform .1s, border-color .1s;
  }
  .tw:active{transform:scale(.94)}
  .tw.sel{border-color:var(--pink);background:#fff;box-shadow:0 0 0 3px rgba(255,143,196,.28)}
  .tw.poor{opacity:.42}
  .tw .ic{font-size:21px;line-height:1.2}
  .tw .nm{font-size:10.5px}
  .tw .cs{font-size:11px;color:var(--pink-d)}

  #info{display:none;padding:9px 11px;gap:8px;align-items:center}
  #info.on{display:flex}
  #infoIc{font-size:31px}
  #infoTx{flex:1;font-size:11.5px;line-height:1.5}
  #infoTx b{font-size:14px}
  .mini{border:none;border-radius:12px;padding:9px 11px;font:inherit;font-size:12px;color:#fff;
    background:linear-gradient(180deg,#ffa6d0,var(--pink));box-shadow:0 3px 0 var(--pink-d);cursor:pointer}
  .mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink-d)}
  .mini.gray{background:linear-gradient(180deg,#cfc4dd,#a898bd);box-shadow:0 3px 0 #857399}
  .mini:disabled{opacity:.4}

  /* ---------- controls ---------- */
  #ctrl{display:flex;gap:6px}
  .btn{
    flex:1;border:none;border-radius:16px;padding:12px 8px;font:inherit;font-size:15px;color:#fff;
    background:linear-gradient(180deg,#ffb3dc,var(--pink));
    box-shadow:0 4px 0 var(--pink-d), 0 6px 16px rgba(224,95,158,.3);cursor:pointer;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
  .btn.sm{flex:0 0 58px;font-size:14px;background:linear-gradient(180deg,#c9b6ff,#a586f5);box-shadow:0 4px 0 #7d5fd0}
  .btn.sm:active{box-shadow:0 1px 0 #7d5fd0}
  .btn:disabled{opacity:.45}

  /* ---------- overlay ---------- */
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;border-radius:20px;background:rgba(255,240,250,.9);backdrop-filter:blur(5px);text-align:center;padding:22px}
  #ov.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  #ovT{font-size:26px;color:var(--pink-d)}
  #ovB{font-size:13.5px;line-height:1.7;opacity:.8}

  /* ---------- コレクション図鑑 ---------- */
  #colOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.96);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:2}
  #colOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #colHead{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--pink-d)}
  #colHead>div{flex:1}
  #colTabs{display:flex;gap:5px}
  .ctab{flex:1;border:none;border-radius:11px;padding:7px 2px;font:inherit;font-size:11px;color:var(--ink);
    background:rgba(255,255,255,.65);cursor:pointer}
  .ctab.sel{background:linear-gradient(180deg,#ffb3dc,var(--pink));color:#fff;box-shadow:0 2px 0 var(--pink-d)}
  #colDone{background:linear-gradient(90deg,#ffe9b8,#ffd9ec);border-radius:12px;padding:8px;
    text-align:center;font-size:12.5px}
  #colGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .cCard{background:rgba(255,255,255,.85);border:2px solid #ffd9ec;border-radius:14px;
    padding:7px 3px 6px;text-align:center}
  .cCard.no{opacity:.6;filter:grayscale(.7)}
  .cCard canvas{display:block;margin:0 auto}
  .cNm{font-size:11px;margin-top:2px}
  .cTt{font-size:9px;opacity:.6;line-height:1.3}
  .cLv{font-size:9px;color:#e0a52e;letter-spacing:.08em}
  .cGet{font-size:8.5px;opacity:.5;line-height:1.3;margin-top:1px}
  #colTotal{text-align:center;font-size:11px;opacity:.7;padding:2px 0 4px}

  #tip{font-size:10.5px;text-align:center;opacity:.55;line-height:1.5}
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="card stat" id="hpBox"><div class="k">ハート</div><div class="v"><span>💗</span><span id="vHp">20</span></div></div>
    <div class="card stat"><div class="k">おほしさま</div><div class="v"><span>⭐</span><span id="vSt">250</span></div></div>
    <div class="card stat"><div class="k">ウェーブ</div><div class="v"><span id="vWv">0</span></div></div>
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="ov">
      <div id="ovT"></div>
      <div id="ovB"></div>
      <button class="btn" id="ovBtn" style="flex:0 0 auto;padding:12px 30px"></button>
    </div>
    <div id="colOv">
      <div id="colHead">
        <div>👑 おかしの国 これくしょん <span id="colCount"></span></div>
        <button class="mini" id="colClose">とじる</button>
      </div>
      <div id="colTabs">
        <button class="ctab sel" data-t="all">ぜんぶ</button>
        <button class="ctab" data-t="tw">おかし</button>
        <button class="ctab" data-t="en">てき</button>
        <button class="ctab" data-t="ch">なかま</button>
      </div>
      <div id="colDone" style="display:none">🏰 おかしの国が かんせいしたよ！ みんな あつまった 🎉</div>
      <div id="colGrid"></div>
      <div id="colTotal"></div>
    </div>
  </div>

  <div class="card" id="panel">
    <div id="shop"></div>
    <div id="info">
      <div id="infoIc"></div>
      <div id="infoTx"></div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <button class="mini" id="btnUp">つよくする</button>
        <button class="mini gray" id="btnSell">うる</button>
      </div>
    </div>
  </div>

  <div id="ctrl">
    <button class="btn" id="btnWave">つぎのウェーブ ▶</button>
    <button class="btn sm" id="btnSpd">1x</button>
    <button class="btn sm" id="btnCol">👑</button>
    <button class="btn sm" id="btnSnd">♪</button>
  </div>

  <div id="tip">おかしを置いて、まほうの国をまもろう！<br>30ウェーブごとに なかまがふえて、おかしの国が かんせいに近づくよ 👑✨</div>

</div>

<script>
(() => {
"use strict";

/* iOSでピンチやダブルタップで画面が拡大したまま戻らなくなるのを防ぐ */
for (const ev of ['gesturestart','gesturechange','gestureend'])
  document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ==========================================================
   マップ
   ========================================================== */
const COLS = 9, ROWS = 12;
// 敵が通る道の曲がり角（セル座標）。-1 と ROWS は画面外の出入口。
const WAY = [[1,-1],[1,2],[7,2],[7,5],[1,5],[1,8],[7,8],[7,12]];

/* ==========================================================
   おかし（タワー）の設定
   ========================================================== */
const TOWERS = {
  candy: { name:'キャンディ', ic:'🍬', cost:50,  dmg:9,  rate:0.45, range:2.3, color:'#ff8fc4', dark:'#e05f9e',
           desc:'すばやく1体をねらう' },
  ice:   { name:'アイス',     ic:'🍧', cost:70,  dmg:5,  rate:0.70, range:2.0, color:'#8fd8ff', dark:'#4aa8dd',
           slow:0.45, slowT:1.4, desc:'あてた敵をおそくする' },
  choco: { name:'チョコ',     ic:'🍫', cost:110, dmg:16, rate:1.10, range:1.9, color:'#d09a6a', dark:'#a06a3c',
           splash:0.95, desc:'まわりの敵もまとめて攻撃' },
  star:  { name:'スター',     ic:'⭐', cost:160, dmg:34, rate:1.50, range:3.6, color:'#ffd76e', dark:'#e0a52e',
           desc:'遠くまでとどく強力な一撃' },
};
const ORDER = ['candy','ice','choco','star'];
const UP_MUL = [0, 0.8, 1.4];        // レベル2,3 の値段 = cost * これ

/* ==========================================================
   敵の設定
   ========================================================== */
const ENEMIES = {
  slime:   { name:'スライム',   hp:28,  spd:1.15, gold:5,   r:0.30, color:'#c9a7ff', dark:'#9a72e0' },
  fast:    { name:'ぴょん',     hp:20,  spd:2.20, gold:7,   r:0.26, color:'#ffa8c8', dark:'#e06f9c' },
  tank:    { name:'もちもち',   hp:115, spd:0.62, gold:15,  r:0.38, color:'#8fe3c4', dark:'#4fb392' },
  crystal: { name:'クリスタル', hp:80,  spd:0.95, gold:14,  r:0.32, color:'#bfe8ff', dark:'#6fa8d8', armor:6 },
  bat:     { name:'こうもり',   hp:60,  spd:1.85, gold:14,  r:0.27, color:'#d8c6ff', dark:'#8f6fd8' },
  golem:   { name:'ゴーレム',   hp:420, spd:0.45, gold:45,  r:0.44, color:'#c09068', dark:'#7a5030', armor:4 },
  boss:    { name:'ボス',       hp:700, spd:0.50, gold:120, r:0.50, color:'#ffb36e', dark:'#dd8028' },
};

function waveList(n){
  const out = [];
  // 数はほどほどで打ち止めにして、後半はHP・敵の種類で手強くする
  const total = 8 + Math.min(28, n*2);
  for (let i=0;i<total;i++){
    let t = 'slime';
    if (n >= 3  && i%4 === 3) t = 'fast';
    if (n >= 5  && i%6 === 5) t = 'tank';
    if (n >= 12 && i%7 === 2) t = 'crystal';
    if (n >= 22 && i%5 === 4) t = 'bat';
    if (n >= 35 && i%9 === 8) t = 'golem';
    out.push(t);
  }
  if (n % 10 === 0) out.push('boss');
  if (n % 10 === 0 && n >= 50) out.push('boss');
  return out;
}
// 30ウェーブをこえたあたりから指数的にきつくする（エンドレスの緊張感）
const hpScale = n => (1 + (n-1)*0.28) * Math.pow(1.05, Math.max(0, n-30));
// 後半はもらえるおほしさまも少しずつ増やして、強化が追いつくようにする
const goldOf = k => Math.round(ENEMIES[k].gold * (1 + Math.max(0, wave-30)*0.04));

/* ==========================================================
   ステージ（30ウェーブクリアごとに景色が変わる）
   ========================================================== */
const STAGE_WAVES = 30;
const THEMES = [
  { name:'シュガーガーデン',     g1:'#d9f7e6', g2:'#cdf2dd', p1:'#f0c9a0', p2:'#ffe8c8',
    spr:['#ff9ec9','#9ed8ff','#b6f0c4','#ffe08a'] },
  { name:'いちごのおかしばたけ', g1:'#ffe4ef', g2:'#ffd9e8', p1:'#c98a5e', p2:'#eec49a',
    spr:['#ff7fae','#ffffff','#ffd0df','#b6f0c4'] },
  { name:'チョコレートのたに',   g1:'#eed9c2', g2:'#e6cdb2', p1:'#8a5a34', p2:'#b07d4e',
    spr:['#ffffff','#ffd76e','#ff9ec9','#9ed8ff'] },
  { name:'こおりのくに',         g1:'#e2f3fc', g2:'#d6ecf8', p1:'#a8cfe6', p2:'#eef9ff',
    spr:['#ffffff','#bfe8ff','#c9a7ff','#ffd0df'] },
  { name:'よぞらのくに',         g1:'#ded4f6', g2:'#d3c7f1', p1:'#d9b96a', p2:'#f6e2a4',
    spr:['#ffffff','#ffe27a','#ff9ec9','#bfe8ff'] },
];
// ウェーブ w をたたかっている間のテーマ（w=0 はまだ始まっていないのでステージ1）
const themeOf = w => THEMES[Math.max(0, Math.ceil(w/STAGE_WAVES)-1) % THEMES.length];

/* ==========================================================
   なかまキャラ（30ウェーブクリアごとに1人ずつ集まる）
   ========================================================== */
const CHARS = [
  { id:'purin',  name:'プリン',         title:'プリンのきし' },
  { id:'choco',  name:'チョコ',         title:'ゆうかんなトリュフ' },
  { id:'gumgum', name:'グミグミ',       title:'ぷるぷるグミ' },
  { id:'donut',  name:'ドーナツ',       title:'いやしのパンやさん' },
  { id:'taffy',  name:'タフィー',       title:'ふえふきキャンディ' },
  { id:'cake',   name:'ケーキちゃん',   title:'ちいさなケーキ' },
  { id:'fairy',  name:'ベリーようせい', title:'マカロンのようせい' },
  { id:'prince', name:'ベリーおうじ',   title:'マカロンのおうじ' },
  { id:'apple',  name:'アップルひめ',   title:'あまいひめさま' },
  { id:'queen',  name:'おうひさま',     title:'おうさまのおきさき' },
  { id:'king',   name:'おうさま',       title:'ケーキのおうさま' },
];

/* ずかん用のよみもの。おかし（タワー）は置くと、てきはたおすと登録される */
const ENEMY_TITLES = {
  slime:'ぷにぷにおばけ', fast:'いたずらうさぎ', tank:'おもたいおもち',
  crystal:'こおりのよろい', bat:'よるのつばさ', golem:'チョコのきょじん', boss:'おうかんのボス',
};
const DEX_TOWERS  = ORDER.map(k => ({ id:'tw_'+k, name:TOWERS[k].name, title:TOWERS[k].desc }));
const DEX_ENEMIES = Object.keys(ENEMIES).map(k => ({ id:'en_'+k, name:ENEMIES[k].name, title:ENEMY_TITLES[k] }));

/* ==========================================================
   DOM
   ========================================================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const vHp = $('vHp'), vSt = $('vSt'), vWv = $('vWv'), hpBox = $('hpBox');
const shopEl = $('shop'), infoEl = $('info'), infoIc = $('infoIc'), infoTx = $('infoTx');
const btnUp = $('btnUp'), btnSell = $('btnSell'), btnWave = $('btnWave'), btnSpd = $('btnSpd'), btnSnd = $('btnSnd');
const ov = $('ov'), ovT = $('ovT'), ovB = $('ovB'), ovBtn = $('ovBtn');
const colOv = $('colOv'), colGrid = $('colGrid'), colCount = $('colCount'), colDone = $('colDone');
const btnCol = $('btnCol'), colClose = $('colClose'), colTabsEl = $('colTabs'), colTotal = $('colTotal');

/* ==========================================================
   状態
   ========================================================== */
let CELL = 40;
let towers = [], enemies = [], shots = [], parts = [], floats = [], sparks = [], rings = [];
let hearts, stars, wave, selTool, selTower, running, spawnQ, spawnT, over;
let speed = 1, time = 0, flash = 0;

let pathCells = new Set(), pathPts = [], segLen = [], pathLen = 0;

/* ==========================================================
   ユーティリティ
   ========================================================== */
const key = (c,r) => c + ',' + r;
const cx  = c => (c + 0.5) * CELL;
const cy  = r => (r + 0.5) * CELL;

function roundRect(x,y,w,h,rad){
  const k = Math.min(rad, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.arcTo(x+w,y,x+w,y+h,k); ctx.arcTo(x+w,y+h,x,y+h,k);
  ctx.arcTo(x,y+h,x,y,k);     ctx.arcTo(x,y,x+w,y,k);
  ctx.closePath();
}

/* 4方向にとがったキラキラ */
function sparkle(x,y,r,rot,color){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.fillStyle = color||'#fff';
  ctx.beginPath();
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function buildPath(){
  pathCells.clear();
  for (let i=0;i<WAY.length-1;i++){
    let [c0,r0] = WAY[i]; const [c1,r1] = WAY[i+1];
    const dc = Math.sign(c1-c0), dr = Math.sign(r1-r0);
    while (c0 !== c1 || r0 !== r1){ pathCells.add(key(c0,r0)); c0 += dc; r0 += dr; }
    pathCells.add(key(c1,r1));
  }
}
function measurePath(){
  pathPts = WAY.map(([c,r]) => ({ x:cx(c), y:cy(r) }));
  segLen = []; pathLen = 0;
  for (let i=0;i<pathPts.length-1;i++){
    const L = Math.hypot(pathPts[i+1].x-pathPts[i].x, pathPts[i+1].y-pathPts[i].y);
    segLen.push(L); pathLen += L;
  }
}
function posAt(d){
  let left = d;
  for (let i=0;i<segLen.length;i++){
    if (left <= segLen[i]){
      const t = segLen[i] ? left/segLen[i] : 0;
      return { x: pathPts[i].x + (pathPts[i+1].x-pathPts[i].x)*t,
               y: pathPts[i].y + (pathPts[i+1].y-pathPts[i].y)*t };
    }
    left -= segLen[i];
  }
  return pathPts[pathPts.length-1];
}

/* ==========================================================
   サウンド
   ========================================================== */
let actx = null, sndOn = true;
function beep(f, dur, type='sine', vol=0.05, slide=1.4){
  if (!sndOn) return;
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*slide, actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

/* ==========================================================
   ゲーム開始
   ========================================================== */
function reset(){
  towers = []; enemies = []; shots = []; parts = []; floats = []; rings = [];
  hearts = 20; stars = 250; wave = 0;
  selTool = null; selTower = null; running = false; over = false;
  spawnQ = []; spawnT = 0; speed = 1; flash = 0;
  btnSpd.textContent = '1x';
  buildPath(); measurePath(); makeSparks();
  syncHUD(); buildShop(); closeInfo();
  ov.classList.remove('on');
  colOv.classList.remove('on');
  btnWave.disabled = false;
  btnWave.textContent = 'つぎのウェーブ ▶';
}

/* 背景を流れるキラキラ */
function makeSparks(){
  sparks = [];
  for (let i=0;i<26;i++) sparks.push({
    x: Math.random()*COLS*CELL, y: Math.random()*ROWS*CELL,
    r: 1.5 + Math.random()*3, sp: 6 + Math.random()*16,
    ph: Math.random()*Math.PI*2,
  });
}

/* ==========================================================
   ショップ UI
   ========================================================== */
function buildShop(){
  shopEl.innerHTML = '';
  for (const k of ORDER){
    const T = TOWERS[k];
    const d = document.createElement('div');
    d.className = 'tw';
    d.dataset.k = k;
    d.innerHTML = `<div class="ic">${T.ic}</div><div class="nm">${T.name}</div><div class="cs">⭐${T.cost}</div>`;
    d.onclick = () => {
      selTower = null; closeInfo();

const dmgOf   = t => TOWERS[t.k].dmg   * Math.pow(1.6, t.lv-1);
const rangeOf = t => TOWERS[t.k].range * Math.pow(1.12, t.lv-1);
const rateOf  = t => TOWERS[t.k].rate  * Math.pow(0.9, t.lv-1);
const sellOf  = t => {
  let paid = TOWERS[t.k].cost;
  for (let i=1;i<t.lv;i++) paid += Math.round(TOWERS[t.k].cost*UP_MUL[i]);
  return Math.round(paid*0.6);
};

cv.addEventListener('pointerdown', e => {

  const b = cv.getBoundingClientRect();
  const px = (e.clientX-b.left) * (COLS*CELL/b.width);
  const py = (e.clientY-b.top)  * (ROWS*CELL/b.height);
  const c = Math.floor(px/CELL), r = Math.floor(py/CELL);
  if (c<0||c>=COLS||r<0||r>=ROWS) return;

  if (hit){ selTool = null; selTower = hit; syncShop(); openInfo(hit); return; }

  if (!selTool){ closeInfo(); return; }

  const T = TOWERS[selTool];

  stars -= T.cost;
  towers.push({ k:selTool, c, r, lv:1, cd:0, ang:-Math.PI/2, pulse:1, ph:Math.random()*6.3 });
  if (unlock('tw_' + selTool)){
    dex['tw_' + selTool].lv = 1; saveDex();

  }
  beep(620,.16,'triangle',.05);

});

function puff(x,y,color){
  const a = Math.random()*6.3, s = 20 + Math.random()*90;
  parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-20, life:.4+Math.random()*.4, age:0,
               r:1.5+Math.random()*3.5, color, rot:Math.random()*6.3 });
}
function floatTx(x,y,text,color){ floats.push({ x, y, text, color, age:0, life:.75 }); }
function ring(x,y,color,max){ rings.push({ x, y, r:4, max:max||CELL*1.4, age:0, life:.5, color }); }
function mote(x,y,color){
  parts.push({ x: x+(Math.random()-0.5)*CELL*0.55, y, vx:(Math.random()-0.5)*9,
               vy:-(14+Math.random()*24), g:0, life:.8+Math.random()*.5, age:0,
               r:1.2+Math.random()*2.4, color, rot:Math.random()*6.3 });

/* ==========================================================
   更新
   ========================================================== */
function update(dt){
  time += dt;
  if (flash > 0) flash = Math.max(0, flash - dt*2.2);

  // 敵の出現
  if (running && spawnQ.length){
    spawnT -= dt;
    if (spawnT <= 0){
      const k = spawnQ.shift();
      const E = ENEMIES[k];
      const hp = E.hp*hpScale(wave);
      enemies.push({ k, d:0, hp, max:hp, slow:0, slowAmt:0, wob:Math.random()*6.3, ph:Math.random()*6.3 });
      spawnT = (k === 'boss' || k === 'golem') ? 1.2 : 0.62;
    }
  }

  // 敵の移動
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i], E = ENEMIES[e.k];
    if (e.slow > 0) e.slow -= dt;
    const mul = e.slow > 0 ? (1 - e.slowAmt) : 1;
    e.d += E.spd * CELL * mul * dt;
    e.wob += dt*9;
    if (e.d >= pathLen){
      enemies.splice(i,1);
      hearts -= (e.k === 'boss' ? 5 : 1);
      flash = 1; beep(200,.28,'sawtooth',.06,.5);
      syncHUD();
      if (hearts <= 0){ gameOver(); return; }
    }
  }

  // タワーの攻撃
  for (const t of towers){
    if (t.lv >= 2 && Math.random() < dt*(t.lv-1)*1.7)
      mote(cx(t.c), cy(t.r) - CELL*0.08, t.lv >= 3 ? '#ffe27a' : '#ffffff');
    if (t.pulse > 0) t.pulse = Math.max(0, t.pulse - dt*2.6);
    t.cd -= dt;
    const R = rangeOf(t)*CELL, ox = cx(t.c), oy = cy(t.r);
    let best = null, bestD = -1;
    for (const e of enemies){
      const p = posAt(e.d);
      if (Math.hypot(p.x-ox, p.y-oy) <= R && e.d > bestD){ best = e; bestD = e.d; }
    }
    if (!best) continue;
    const p = posAt(best.d);
    t.ang = Math.atan2(p.y-oy, p.x-ox);
    if (t.cd > 0) continue;
    t.cd = rateOf(t);
    t.pulse = 0.5;
    shots.push({ k:t.k, x:ox, y:oy, target:best, dmg:dmgOf(t), lv:t.lv, life:0, trail:[] });
    beep(t.k==='star'?880:t.k==='choco'?300:660, .07, 'triangle', .028);
  }

  // 弾
  for (let i=shots.length-1;i>=0;i--){
    const s = shots[i];
    s.life += dt;
    if (!enemies.includes(s.target) || s.life > 2.2){ shots.splice(i,1); continue; }
    const p = posAt(s.target.d);
    const dx = p.x-s.x, dy = p.y-s.y, L = Math.hypot(dx,dy) || 1;
    const sp = (s.k==='star' ? 15 : 11) * CELL;
    s.trail.push({x:s.x,y:s.y}); if (s.trail.length > 3 + s.lv*3) s.trail.shift();
    if (L <= sp*dt){ hitTarget(s, p); shots.splice(i,1); continue; }
    s.x += dx/L*sp*dt; s.y += dy/L*sp*dt;
  }

  // パーティクル
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.age += dt;
    if (p.age >= p.life){ parts.splice(i,1); continue; }
    p.vy += (p.g === 0 ? 0 : 130)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*4;
  }
  for (let i=rings.length-1;i>=0;i--){
    const rg = rings[i]; rg.age += dt;
    if (rg.age >= rg.life){ rings.splice(i,1); continue; }
    const k = rg.age/rg.life;
    rg.r = rg.max * (1 - (1-k)*(1-k));
  }
  for (let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.age += dt; f.y -= dt*34;
    if (f.age >= f.life) floats.splice(i,1);
  }
  for (const s of sparks){
    s.y -= s.sp*dt; s.ph += dt*3;
    if (s.y < -8){ s.y = ROWS*CELL+8; s.x = Math.random()*COLS*CELL; }
  }

  // ウェーブ終了
  if (running && !spawnQ.length && !enemies.length){
    running = false;
    const bonus = 20 + wave*4;
    stars += bonus;
    floatTx(COLS*CELL/2, ROWS*CELL/2, '+⭐'+bonus, '#ffb43f');
    beep(700,.15,'triangle',.06); setTimeout(()=>beep(940,.22,'triangle',.06),130);
    btnWave.disabled = false;
    btnWave.textContent = 'つぎのウェーブ ▶';
    syncHUD();
    if (wave % STAGE_WAVES === 0) stageClear();
  }
}

// アーマーもちの敵はダメージを軽減する（最低1は通す）
const dmgTo = (e, d) => Math.max(1, d - (ENEMIES[e.k].armor || 0));

function hitTarget(s, p){
  const T = TOWERS[s.k];
  const dead = [];
  if (T.splash){
    const R = T.splash*CELL*Math.pow(1.1, s.lv-1);
    for (const e of enemies){
      const q = posAt(e.d);
      if (Math.hypot(q.x-p.x, q.y-p.y) <= R){ e.hp -= dmgTo(e, s.dmg); if (e.hp <= 0) dead.push(e); }
    }
    for (let i=0;i<10+5*s.lv;i++) puff(p.x, p.y, '#f0c08a');
    if (s.lv >= 3){ for (let i=0;i<6;i++) puff(p.x, p.y, '#ffffff'); ring(p.x, p.y, '#f0c08a', CELL*1.7); }
  } else {
    s.target.hp -= dmgTo(s.target, s.dmg);
    if (T.slow){ s.target.slow = T.slowT; s.target.slowAmt = T.slow; }
    if (s.target.hp <= 0) dead.push(s.target);
    for (let i=0;i<3+3*s.lv;i++) puff(p.x, p.y, T.color);
    if (s.lv >= 3){ for (let i=0;i<4;i++) puff(p.x, p.y, '#ffffff'); ring(p.x, p.y, T.color, CELL*1.1); }
  }
  for (const e of dead){
    const idx = enemies.indexOf(e);
    if (idx < 0) continue;
    enemies.splice(idx,1);
    if (unlock('en_' + e.k))
      floatTx(p.x, p.y - CELL*0.7, 'ずかんに とうろく！', '#b98ae0');
    const g = goldOf(e.k);
    stars += g;
    floatTx(p.x, p.y, '+'+g, '#ffb43f');
    for (let i=0;i<14;i++) puff(p.x, p.y, ENEMIES[e.k].color);
    beep(520,.1,'sine',.035);
    syncHUD();
  }
}

/* ---------- なかまの似顔絵（Canvasに直接描く） ---------- */
function charThumb(ch, size){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size + 'px'; c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  drawPortrait(g, ch.pid || ch.id, size);
  return c;
}

function drawPortrait(g, id, S){
  const TAU = 6.2832, M = S/2, R = S*0.27;
  const rrect = (x,y,w,h,r) => {
    const k = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+k,y);
    g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
    g.arcTo(x,y+h,x,y,k);     g.arcTo(x,y,x+w,y,k);
    g.closePath();
  };
  const ball = (x,y,r,col,dark) => {
    const gr = g.createRadialGradient(x-r*0.35, y-r*0.45, r*0.1, x, y, r*1.12);
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.35,col); gr.addColorStop(1,dark);
    g.fillStyle = gr;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    g.globalAlpha = .7; g.strokeStyle = dark; g.lineWidth = r*0.08;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.stroke(); g.globalAlpha = 1;
  };
  const face = (x,y,r,mood) => {
    g.fillStyle = 'rgba(255,120,165,.4)';
    for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.5, y+r*0.18, r*0.16, 0, TAU); g.fill(); }
    if (mood === 'angry'){
      g.strokeStyle = '#4a3348'; g.lineWidth = r*0.08; g.lineCap = 'round';
      for (const s of [-1,1]){
        g.beginPath(); g.moveTo(x+s*r*0.44, y-r*0.42); g.lineTo(x+s*r*0.15, y-r*0.29); g.stroke();
      }
    }
    g.fillStyle = '#503a52';
    for (const s of [-1,1]){ g.beginPath(); g.ellipse(x+s*r*0.26, y-r*0.05, r*0.09, r*0.13, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#fff';
    for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.22, y-r*0.1, r*0.045, 0, TAU); g.fill(); }
    g.strokeStyle = '#503a52'; g.lineWidth = r*0.06; g.lineCap = 'round';
    if (mood === 'angry'){
      g.beginPath(); g.arc(x, y+r*0.38, r*0.13, Math.PI*1.15, Math.PI*1.85); g.stroke();
    } else {
      g.beginPath(); g.arc(x, y+r*0.16, r*0.13, Math.PI*0.15, Math.PI*0.85); g.stroke();
    }
  };
  const star = (x,y,r,col) => {
    g.save(); g.translate(x,y); g.fillStyle = col;
    g.beginPath();
    for (let i=0;i<4;i++){

    g.lineTo(M, M - R*1.25); g.lineTo(M + R*0.12, M - R*0.75); g.lineTo(M + R*0.3, M - R*1.1);
    g.lineTo(M + R*0.5, M - R*0.7);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#ff9ec9';
    g.beginPath(); g.arc(M, M - R*1.0, R*0.08, 0, TAU); g.fill();
    face(M, M + R*0.08, R*0.75);
  } else if (id === 'king'){
    ball(M, M + S*0.02, R, '#ffe6d8', '#e8b898');
    // おうかん（フルーツつき）
    g.fillStyle = '#ffd76e'; g.strokeStyle = '#d99a1e'; g.lineWidth = S*0.01;
    g.beginPath();
    g.moveTo(M - R*0.6, M - R*0.5); g.lineTo(M - R*0.6, M - R*1.1); g.lineTo(M - R*0.3, M - R*0.8);
    g.lineTo(M, M - R*1.25); g.lineTo(M + R*0.3, M - R*0.8); g.lineTo(M + R*0.6, M - R*1.1);
    g.lineTo(M + R*0.6, M - R*0.5);
    g.closePath(); g.fill(); g.stroke();
    for (const [dx,col] of [[-0.35,'#ff5a7a'],[0,'#7fce7f'],[0.35,'#b98ae0']]){
      g.fillStyle = col;
      g.beginPath(); g.arc(M + dx*R, M - R*0.68, R*0.09, 0, TAU); g.fill();
    }
    // りっぱなひげ
    g.fillStyle = '#a56a3a';
    g.beginPath(); g.ellipse(M, M + S*0.02 + R*0.62, R*0.58, R*0.4, 0, 0, TAU); g.fill();
    face(M, M + S*0.02 - R*0.12, R*0.68);
  }

  // カードのキラキラ
  star(S*0.15, S*0.2,  S*0.04,  '#ffd76e');
  star(S*0.87, S*0.32, S*0.032, '#c9a7ff');
}

/* ==========================================================
   描画
   ========================================================== */
function drawBoard(){
  const W = COLS*CELL, H = ROWS*CELL;
  const TH = themeOf(wave);   // いまのステージのテーマ色

  // じめん
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    ctx.fillStyle = (r+c)%2 ? TH.g1 : TH.g2;
    ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
  }

  // 背景のキラキラ
  for (const s of sparks){
    ctx.globalAlpha = 0.35 + Math.sin(s.ph)*0.3;
    sparkle(s.x, s.y, s.r, s.ph*0.4, '#ffffff');
  }
  ctx.globalAlpha = 1;

  // 道（クッキー）
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = TH.p1; ctx.lineWidth = CELL*0.94;
  ctx.beginPath();
  pathPts.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.stroke();
  ctx.strokeStyle = TH.p2; ctx.lineWidth = CELL*0.78;
  ctx.stroke();

  // 道の上のカラースプレー（道に沿って等間隔に散らす）
  const cols = TH.spr;
  const N = 110;
  for (let i=0;i<N;i++){
    const d = (i+0.5)/N * pathLen;
    const a = posAt(d), b2 = posAt(Math.min(pathLen, d+2));
    const dx = b2.x-a.x, dy = b2.y-a.y, L = Math.hypot(dx,dy) || 1;
    const off = (((i*37) % 100)/100 - 0.5) * CELL*0.62;   // 道幅の中でずらす
    const x = a.x - dy/L*off, y = a.y + dx/L*off;
    ctx.save(); ctx.translate(x,y); ctx.rotate((i*97 % 360)/180*Math.PI);
    ctx.fillStyle = cols[i%4];
    ctx.fillRect(-CELL*0.055, -CELL*0.02, CELL*0.11, CELL*0.04);
    ctx.restore();
  }

  // 置ける場所のうっすらしたガイド
  if (selTool){
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      if (pathCells.has(key(c,r)) || towers.some(t=>t.c===c&&t.r===r)) continue;
      roundRect(c*CELL+3, r*CELL+3, CELL-6, CELL-6, 8); ctx.stroke();
    }
  }
}

/* まばたき：ときどきぱちっと目を閉じる（1=ひらく 0=とじる） */
function blinkK(ph){
  const t = (time + ph*0.57) % 3.6;
  if (t > 0.22) return 1;
  return Math.min(1, Math.abs(t/0.11 - 1));
}

/* つやつやのまるい体（ラジアルグラデ＋りんかく＋ハイライト） */
function glossyBall(R, color, dark){
  const g = ctx.createRadialGradient(-R*0.35,-R*0.45,R*0.1, 0,0,R*1.12);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(0.32,color);
  g.addColorStop(1,dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
  ctx.globalAlpha = .75;
  ctx.strokeStyle = dark; ctx.lineWidth = R*0.08;
  ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-R*0.32,-R*0.45,R*0.3,R*0.15,-0.55,0,6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(R*0.42,-R*0.3,R*0.07,0,6.3); ctx.fill();
}

/* 顔（まばたき・二重ハイライトの目・まつげ・グラデほっぺ） */
function drawFace(R, ph, mood){
  const bk = blinkK(ph);

  for (const s of [-1,1]){
    const ch = ctx.createRadialGradient(s*R*0.52, R*0.2, 0, s*R*0.52, R*0.2, R*0.24);
    ch.addColorStop(0,'rgba(255,120,165,.5)');
    ch.addColorStop(1,'rgba(255,120,165,0)');
    ctx.fillStyle = ch;
    ctx.beginPath(); ctx.arc(s*R*0.52, R*0.2, R*0.24, 0, 6.3); ctx.fill();
  }

  if (mood === 'angry'){
    ctx.strokeStyle = '#4a3348'; ctx.lineWidth = R*0.09; ctx.lineCap = 'round';
    for (const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*R*0.44, -R*0.4);
      ctx.lineTo(s*R*0.15, -R*0.27);
      ctx.stroke();
    }
  }

  if (bk > 0.2){
    for (const s of [-1,1]){
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(s*R*0.28, -R*0.04, R*0.15, R*0.19*bk, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#503a52';
      ctx.beginPath(); ctx.ellipse(s*R*0.28, -R*0.02, R*0.105, R*0.145*bk, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s*R*0.24, -R*0.02 - R*0.07*bk, R*0.05, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(s*R*0.33, R*0.03, R*0.025, 0, 6.3); ctx.fill();
      ctx.strokeStyle = '#503a52'; ctx.lineWidth = R*0.045; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s*R*0.41, -R*0.15);
      ctx.lineTo(s*R*0.49, -R*0.22);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = '#503a52'; ctx.lineWidth = R*0.07; ctx.lineCap = 'round';
    for (const s of [-1,1]){
      ctx.beginPath();
      ctx.arc(s*R*0.28, -R*0.01, R*0.13, Math.PI*1.15, Math.PI*1.85);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = '#503a52'; ctx.lineWidth = R*0.07; ctx.lineCap = 'round';
  if (mood === 'angry'){
    ctx.beginPath(); ctx.arc(0, R*0.4, R*0.15, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, R*0.17, R*0.15, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  }
}

/* ちいさなリボン */
function drawBow(x, y, r, color){
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
  ctx.fillStyle = color;
  for (const s of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*r*1.25, -r*0.85, s*r*1.15, 0);
    ctx.quadraticCurveTo(s*r*1.25, r*0.85, 0, 0);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r*0.34, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.arc(-r*0.38, -r*0.28, r*0.17, 0, 6.3); ctx.fill();
  ctx.restore();
}

function drawTower(t){
  const T = TOWERS[t.k];
  const x = cx(t.c), y = cy(t.r);
  const bob = Math.sin(time*2.4 + t.ph) * CELL*0.035;
  const pop = 1 + t.pulse*0.16;
  const R = CELL*(0.31 + (t.lv-1)*0.022);

  // 選択中は射程を表示
  if (selTower === t){
    ctx.fillStyle = 'rgba(255,143,196,.14)';
    ctx.strokeStyle = 'rgba(255,143,196,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, rangeOf(t)*CELL, 0, 6.3); ctx.fill(); ctx.stroke();
  }

  // 影（ゆれても地面に残る）
  ctx.fillStyle = 'rgba(120,90,120,.18)';
  ctx.beginPath(); ctx.ellipse(x, y + R*1.0, R*0.85, R*0.28, 0, 0, 6.3); ctx.fill();

  ctx.save(); ctx.translate(x, y + bob); ctx.scale(pop, pop);

  // ようせいのはね（ぱたぱた・レベルで大きく）
  const flap = Math.sin(time*7 + t.ph);
  const wk = 1 + (t.lv-1)*0.18;
  for (const s of [-1,1]){
    ctx.save();
    ctx.translate(s*R*0.6, -R*0.1);
    ctx.rotate(s*(0.35 + flap*0.22));
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.beginPath(); ctx.ellipse(s*R*0.42*wk, -R*0.18*wk, R*0.46*wk, R*0.24*wk, s*0.5, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.ellipse(s*R*0.34*wk, R*0.16*wk, R*0.3*wk, R*0.17*wk, s*0.85, 0, 6.3); ctx.fill();
    ctx.restore();
  }

  // マカロンの台座
  ctx.fillStyle = '#fff';
  roundRect(-R*0.95, R*0.4, R*1.9, R*0.55, R*0.28); ctx.fill();
  ctx.fillStyle = 'rgba(224,95,158,.12)';
  roundRect(-R*0.95, R*0.63, R*1.9, R*0.32, R*0.16); ctx.fill();
  ctx.strokeStyle = 'rgba(160,120,160,.3)'; ctx.lineWidth = 1.5;
  roundRect(-R*0.95, R*0.4, R*1.9, R*0.55, R*0.28); ctx.stroke();

  // 強化オーラ（Lv2でしろく、Lv3できんいろに）
  if (t.lv >= 2){
    const pu = 0.75 + Math.sin(time*3.2 + t.ph)*0.25;
    const col = t.lv >= 3 ? '255,214,110' : '255,255,255';
    const ag = ctx.createRadialGradient(0,0,R*0.6, 0,0,R*1.8);
    ag.addColorStop(0, 'rgba('+col+',0)');
    ag.addColorStop(0.62, 'rgba('+col+','+(0.34*pu)+')');
    ag.addColorStop(1, 'rgba('+col+',0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0,0,R*1.8,0,6.3); ctx.fill();
  }

  // 体と顔
  glossyBall(R, T.color, T.dark);
  drawFace(R, t.ph, 'smile');

  // 頭のかざり（レベルで大きくなる）
  ctx.save(); ctx.translate(0, -R*1.05);
  ctx.scale(1 + (t.lv-1)*0.22, 1 + (t.lv-1)*0.22);
  if (t.k === 'candy'){
    ctx.fillStyle = '#fff';
    ctx.fillRect(-R*0.045, -R*0.12, R*0.09, R*0.4);
    const lg = ctx.createRadialGradient(-R*0.12,-R*0.42,0, 0,-R*0.3,R*0.44);
    lg.addColorStop(0,'#fff'); lg.addColorStop(1,T.color);
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(0,-R*0.3,R*0.38,0,6.3); ctx.fill();
    ctx.strokeStyle = T.dark; ctx.lineWidth = R*0.085; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i=0;i<26;i++){
      const a = i*0.42, rr = i*R*0.0125;
      ctx.lineTo(Math.cos(a)*rr, -R*0.3 + Math.sin(a)*rr);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(224,95,158,.5)'; ctx.lineWidth = R*0.05;
    ctx.beginPath(); ctx.arc(0,-R*0.3,R*0.38,0,6.3); ctx.stroke();
  } else if (t.k === 'ice'){
    ctx.fillStyle = '#eaf8ff';
    ctx.strokeStyle = '#8fd0f0'; ctx.lineWidth = R*0.05;
    for (const [dx,h] of [[-0.34,0.34],[0,0.52],[0.34,0.34]]){
      ctx.beginPath();
      ctx.moveTo(dx*R, -R*(h+0.08));
      ctx.lineTo(dx*R + R*0.15, -R*0.04);
      ctx.lineTo(dx*R, R*0.1);
      ctx.lineTo(dx*R - R*0.15, -R*0.04);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    sparkle(R*0.34, -R*0.55, R*0.09, time*3, '#ffffff');
  } else if (t.k === 'choco'){
    ctx.rotate(-0.22);
    ctx.fillStyle = '#6b3f1f';
    roundRect(-R*0.42,-R*0.28,R*0.84,R*0.52,R*0.08); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    for (let i=0;i<3;i++) for (let j=0;j<2;j++)
      ctx.fillRect(-R*0.38+i*R*0.28, -R*0.24+j*R*0.24, R*0.22, R*0.18);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = R*0.05;
    roundRect(-R*0.42,-R*0.28,R*0.84,R*0.52,R*0.08); ctx.stroke();
    // いちごをのせる
    ctx.rotate(0.22);
    ctx.fillStyle = '#ff6f9c';
    ctx.beginPath(); ctx.arc(R*0.34, -R*0.42, R*0.14, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#7fce7f';
    ctx.beginPath(); ctx.ellipse(R*0.34, -R*0.55, R*0.08, R*0.045, 0, 0, 6.3); ctx.fill();
  } else {
    const glow = ctx.createRadialGradient(0,-R*0.18,0, 0,-R*0.18,R*0.62);
    glow.addColorStop(0,'rgba(255,240,150,.9)');
    glow.addColorStop(1,'rgba(255,240,150,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,-R*0.18,R*0.62,0,6.3); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.strokeStyle = '#e0a52e'; ctx.lineWidth = R*0.06;
    ctx.beginPath();
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + i*2*Math.PI/5;
      const b = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*R*0.42, -R*0.18 + Math.sin(a)*R*0.42);
      ctx.lineTo(Math.cos(b)*R*0.18, -R*0.18 + Math.sin(b)*R*0.18);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    sparkle(-R*0.42, -R*0.5, R*0.08, time*4, '#fff');
  }
  ctx.restore();

  // むねのリボン（Lv3できんいろ）
  drawBow(-R*0.6, -R*0.74, R*(0.3 + (t.lv-1)*0.05), t.lv >= 3 ? '#e8b12e' : T.dark);

  // Lv3はまわりを星がくるくるまわる
  if (t.lv >= 3){
    for (let i=0;i<5;i++){
      const a = time*2.4 + t.ph + i*1.2566;
      const rr = R*(1.45 + 0.12*Math.sin(time*3 + i*1.7));
      sparkle(Math.cos(a)*rr, Math.sin(a)*rr*0.62 - R*0.1,
              R*(i%2 ? 0.09 : 0.14), a*2, i%2 ? '#ffffff' : '#ffe27a');
    }
  }

  ctx.restore();

  // レベルの星（Lv3で小さな王冠も）
  for (let i=0;i<t.lv;i++)
    sparkle(x - (t.lv-1)*CELL*0.075 + i*CELL*0.15, y + CELL*0.4, CELL*0.06, 0, '#ffd76e');
  if (t.lv >= 3){
    ctx.save(); ctx.translate(x + R*0.7, y + bob - R*1.25); ctx.rotate(0.35);
    ctx.fillStyle = '#ffd76e'; ctx.strokeStyle = '#d99a1e'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-R*0.2, R*0.12); ctx.lineTo(-R*0.2, -R*0.08); ctx.lineTo(-R*0.07, 0);
    ctx.lineTo(0, -R*0.15); ctx.lineTo(R*0.07, 0); ctx.lineTo(R*0.2, -R*0.08); ctx.lineTo(R*0.2, R*0.12);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawEnemy(e){
  const E = ENEMIES[e.k];
  const p = posAt(e.d);
  const R = E.r*CELL;
  const sq = Math.sin(e.wob)*0.1;

  ctx.save(); ctx.translate(p.x, p.y);

  ctx.fillStyle = 'rgba(120,90,120,.16)';
  ctx.beginPath(); ctx.ellipse(0, R*0.92, R*0.8, R*0.24, 0, 0, 6.3); ctx.fill();

  ctx.scale(1+sq, 1-sq);

  const g = ctx.createRadialGradient(-R*0.3,-R*0.4,R*0.1, 0,0,R*1.15);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,E.color); g.addColorStop(1,E.dark);

  if (e.k === 'slime'){
    // すそがぷにぷに波打つスライム
    const w = Math.sin(e.wob*1.3)*R*0.07;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -R*0.08, R*0.92, Math.PI, 0);
    ctx.quadraticCurveTo(R*0.95, R*0.5, R*0.55, R*0.6+w);
    ctx.quadraticCurveTo(R*0.28, R*0.78-w, 0, R*0.66+w);
    ctx.quadraticCurveTo(-R*0.28, R*0.78-w, -R*0.55, R*0.6+w);
    ctx.quadraticCurveTo(-R*0.95, R*0.5, -R*0.92, -R*0.08);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.07;
    ctx.stroke(); ctx.globalAlpha = 1;
  } else if (e.k === 'fast'){
    // うさぎ耳がゆれる
    for (const s of [-1,1]){
      ctx.save();
      ctx.translate(s*R*0.4, -R*0.72);
      ctx.rotate(s*(0.28 + Math.sin(e.wob)*0.14));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, -R*0.32, R*0.2, R*0.56, 0, 0, 6.3); ctx.fill();
      ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.055;
      ctx.beginPath(); ctx.ellipse(0, -R*0.32, R*0.2, R*0.56, 0, 0, 6.3); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,175,205,.85)';
      ctx.beginPath(); ctx.ellipse(0, -R*0.3, R*0.1, R*0.36, 0, 0, 6.3); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
    ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.07;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.stroke(); ctx.globalAlpha = 1;
  } else if (e.k === 'tank'){
    // おもちのようなまるしかく
    ctx.fillStyle = g;
    roundRect(-R, -R*0.85, R*2, R*1.72, R*0.6); ctx.fill();
    ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.07;
    roundRect(-R, -R*0.85, R*2, R*1.72, R*0.6); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (e.k === 'crystal'){
    // あたまのまわりにこおりのとげ（かたい鎧のイメージ）
    ctx.fillStyle = '#eaf8ff'; ctx.strokeStyle = '#8fc8e8'; ctx.lineWidth = R*0.06;
    for (let i=0;i<5;i++){
      const a = Math.PI*1.1 + i*Math.PI*0.2;
      const nx = Math.cos(a), ny = Math.sin(a);
      const bx = nx*R*0.8, by = ny*R*0.8;
      ctx.beginPath();
      ctx.moveTo(bx - ny*R*0.16, by + nx*R*0.16);
      ctx.lineTo(bx + nx*R*0.62, by + ny*R*0.62);
      ctx.lineTo(bx + ny*R*0.16, by - nx*R*0.16);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
    ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.07;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.stroke(); ctx.globalAlpha = 1;
  } else if (e.k === 'bat'){
    // ぱたぱたのはね
    const fl = Math.sin(e.wob*1.6)*0.4;
    for (const s of [-1,1]){
      ctx.save();
      ctx.translate(s*R*0.72, -R*0.05);
      ctx.rotate(s*(0.5 + fl));
      ctx.fillStyle = 'rgba(150,110,220,.75)';
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(s*R*1.1, -R*0.8, s*R*1.3, -R*0.1);
      ctx.quadraticCurveTo(s*R*0.9, R*0.15, 0, R*0.2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
    ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.07;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.stroke(); ctx.globalAlpha = 1;
    // とがったみみ
    ctx.fillStyle = E.dark;
    for (const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*R*0.68, -R*0.5);
      ctx.lineTo(s*R*0.3,  -R*0.75);
      ctx.lineTo(s*R*0.82, -R*1.0);
      ctx.closePath(); ctx.fill();
    }
  } else if (e.k === 'golem'){
    // とろけたチョコの大きなゴーレム
    ctx.fillStyle = g;
    roundRect(-R, -R*0.95, R*2, R*1.85, R*0.5); ctx.fill();
    ctx.globalAlpha = .7; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.07;
    roundRect(-R, -R*0.95, R*2, R*1.85, R*0.5); ctx.stroke();
    ctx.globalAlpha = 1;
    // あたまからたれるチョコ
    ctx.fillStyle = E.dark; ctx.globalAlpha = .8;
    for (const [dx,len] of [[-0.55,0.42],[-0.1,0.62],[0.4,0.34]]){
      roundRect(dx*R - R*0.09, -R*0.95, R*0.18, R*len, R*0.09); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
    ctx.globalAlpha = .8; ctx.strokeStyle = E.dark; ctx.lineWidth = R*0.08;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.stroke(); ctx.globalAlpha = 1;
    // ボスのおうかん
    ctx.save(); ctx.translate(0, -R*1.0);
    ctx.fillStyle = '#ffd76e'; ctx.strokeStyle = '#d99a1e'; ctx.lineWidth = R*0.05;
    ctx.beginPath();
    ctx.moveTo(-R*0.42, R*0.14); ctx.lineTo(-R*0.42, -R*0.2); ctx.lineTo(-R*0.18, -R*0.02);
    ctx.lineTo(0, -R*0.3); ctx.lineTo(R*0.18, -R*0.02); ctx.lineTo(R*0.42, -R*0.2); ctx.lineTo(R*0.42, R*0.14);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff6f9c';
    ctx.beginPath(); ctx.arc(0, -R*0.02, R*0.07, 0, 6.3); ctx.fill();
    ctx.restore();
  }

  // つや
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-R*0.3,-R*0.44,R*0.28,R*0.13,-0.5,0,6.3); ctx.fill();

  // 顔
  drawFace(R*0.95, e.ph, (e.k === 'boss' || e.k === 'golem') ? 'angry' : 'smile');

  // こおり状態
  if (e.slow > 0){
    ctx.fillStyle = 'rgba(160,220,255,.4)';
    ctx.beginPath(); ctx.arc(0,0,R*1.05,0,6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = R*0.06; ctx.lineCap = 'round';
    for (let i=0;i<3;i++){
      const a = i*Math.PI/3 + time*0.8;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(a)*R*0.42, -Math.sin(a)*R*0.42);
      ctx.lineTo(Math.cos(a)*R*0.42, Math.sin(a)*R*0.42);
      ctx.stroke();
    }
  }
  ctx.restore();

  // HPバー
  const w = R*1.9, h = Math.max(3, CELL*0.075), yy = p.y - R - h*2.4;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  roundRect(p.x-w/2, yy, w, h, h/2); ctx.fill();
  const ratio = Math.max(0, e.hp/e.max);
  ctx.fillStyle = ratio > .5 ? '#7fe0a8' : ratio > .25 ? '#ffd166' : '#ff7d9c';
  roundRect(p.x-w/2, yy, w*ratio, h, h/2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,120,.3)'; ctx.lineWidth = 1;
  roundRect(p.x-w/2, yy, w, h, h/2); ctx.stroke();
}

function drawShot(s){
  const T = TOWERS[s.k];
  const k = s.lv;
  const rad = CELL*(0.08 + (k-1)*0.03);

  // 軌跡（レベルで長く・太く）
  ctx.strokeStyle = T.color; ctx.lineWidth = CELL*(0.055 + k*0.02); ctx.lineCap='round';
  ctx.globalAlpha = .4;
  ctx.beginPath();
  s.trail.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.lineTo(s.x,s.y); ctx.stroke();
  ctx.globalAlpha = 1;

  // Lv2からまわりが光る
  if (k >= 2){
    const glow = ctx.createRadialGradient(s.x,s.y,0, s.x,s.y,rad*3);
    glow.addColorStop(0, 'rgba(255,255,255,.6)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(s.x,s.y,rad*3,0,6.3); ctx.fill();
  }

  if (s.k === 'star'){
    sparkle(s.x, s.y, rad*2.1, time*7, k >= 3 ? '#ffffff' : '#fff2a8');
    if (k >= 2) sparkle(s.x, s.y, rad*1.2, -time*9, '#ffd76e');
  } else {
    ctx.fillStyle = T.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 6.3); ctx.fill();
    ctx.globalAlpha = .6; ctx.strokeStyle = T.dark; ctx.lineWidth = rad*0.32;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 6.3); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(s.x-rad*0.3, s.y-rad*0.32, rad*0.4, 0, 6.3); ctx.fill();
    // Lv3はキラキラをまとって飛ぶ
    if (k >= 3)
      sparkle(s.x + Math.cos(time*11)*rad*1.7, s.y + Math.sin(time*11)*rad*1.7, rad*0.55, time*6, '#ffffff');
  }
}

function render(){
  const W = COLS*CELL, H = ROWS*CELL;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  roundRect(0,0,W,H,20); ctx.clip();

  drawBoard();
  for (const t of towers) drawTower(t);
  for (const e of enemies) drawEnemy(e);
  for (const s of shots) drawShot(s);

  for (const p of parts){
    const k = 1 - p.age/p.life;
    ctx.globalAlpha = k;
    sparkle(p.x, p.y, p.r*k*1.6, p.rot, p.color);
  }
  ctx.globalAlpha = 1;
  for (const rg of rings){
    const k = rg.age/rg.life;
    ctx.globalAlpha = (1-k)*0.85;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = Math.max(1.5, CELL*0.1*(1-k));
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.3); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of floats){
    const k = f.age/f.life;
    ctx.globalAlpha = 1 - k*k;
    ctx.font = '800 ' + (CELL*0.42) + 'px system-ui,sans-serif';
    ctx.lineWidth = CELL*0.11; ctx.strokeStyle='#fff';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle=f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,90,140,' + (flash*0.3) + ')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

/* ==========================================================
   サイズ
   ========================================================== */
function resize(){
  const w = Math.min(document.getElementById('app').clientWidth - 20, 460);
  const h = window.innerHeight - 250;
  CELL = Math.max(24, Math.floor(Math.min(w/COLS, h/ROWS)));
  const W = COLS*CELL, H = ROWS*CELL;
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  measurePath();
  for (const s of sparks){ s.x = Math.min(s.x, W); s.y = Math.min(s.y, H); }
}
window.addEventListener('resize', resize);

/* ==========================================================
   メインループ
   ========================================================== */
let last = 0;
function loop(ts){
  let dt = Math.min(0.05, (ts-last)/1000 || 0);
  last = ts;
  if (!over) for (let i=0;i<speed;i++) update(dt);
  render();
  requestAnimationFrame(loop);
}

reset();
resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
