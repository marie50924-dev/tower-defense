    g.fillStyle = c;
    for (const [dx,dy,w,h] of [[-0.5,0.86,0.3,0.3],[0.5,0.86,0.3,0.3],
                               [-0.94,0.06,0.26,0.4],[0.94,0.06,0.26,0.4]]){
      gRR(g, x+r*dx-r*w, y+r*dy-r*h, r*w*2, r*h*2, r*0.1); g.fill();
    }
    gRR(g, x-r*0.72, y-r*0.72, r*1.44, r*1.5, r*0.16); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.3)';
    for (const [dx,dy,w,h] of [[-0.4,-0.4,0.24,0.2],[0.34,-0.1,0.2,0.24],[-0.1,0.4,0.28,0.18]]){
      gRR(g, x+r*dx-r*w, y+r*dy-r*h, r*w*2, r*h*2, r*0.06); g.fill();
    }
  },

  robot: (g,S,x,y,r,c,m,c2) => {                      // ロボット
    g.strokeStyle = c2 || '#8a92a4'; g.lineWidth = r*0.13; g.lineCap='round';
    for (const s2 of [-1,1]){
      g.beginPath(); g.moveTo(x+s2*r*0.5,y+r*0.1); g.lineTo(x+s2*r*0.86,y+r*0.5); g.stroke();
      g.beginPath(); g.moveTo(x+s2*r*0.24,y+r*0.8); g.lineTo(x+s2*r*0.26,y+r*1.2); g.stroke();
    }
    g.fillStyle = c;
    gRR(g, x-r*0.56, y-r*0.16, r*1.12, r*1.0, r*0.14); g.fill();
    gRR(g, x-r*0.5, y-r*1.06, r*1.0, r*0.94, r*0.18); g.fill();
    g.strokeStyle = c2 || '#8a92a4'; g.lineWidth = r*0.07;
    g.beginPath(); g.moveTo(x,y-r*1.06); g.lineTo(x,y-r*1.4); g.stroke();
    g.fillStyle = m || '#ffd76e';
    g.beginPath(); g.arc(x,y-r*1.48,r*0.14,0,GTAU); g.fill();
    g.fillStyle = c2 || '#8fe3c4';
    for (let i=-1;i<=1;i++){ g.beginPath(); g.arc(x+r*i*0.24,y+r*0.4,r*0.09,0,GTAU); g.fill(); }
  },

  /* ================= お菓子（追加） ================= */

  cupcake: (g,S,x,y,r,c,m,c2) => {                // カップケーキ
    g.fillStyle = c2 || '#e8a0b8';
    g.beginPath();
    g.moveTo(x-r*0.72,y+r*0.1); g.lineTo(x+r*0.72,y+r*0.1);
    g.lineTo(x+r*0.5,y+r*1.0); g.lineTo(x-r*0.5,y+r*1.0); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=r*0.06;
    for (let i=-2;i<=2;i++){ g.beginPath();
      g.moveTo(x+r*i*0.26,y+r*0.12); g.lineTo(x+r*i*0.18,y+r*0.98); g.stroke(); }
    g.fillStyle = c;                               // しぼった クリーム
    for (let i=0;i<3;i++){
      g.beginPath(); g.ellipse(x, y-r*(0.06+i*0.34), r*(0.72-i*0.18), r*0.3, 0,0,GTAU); g.fill();
    }
    g.fillStyle='#ff5f8a';
    g.beginPath(); g.arc(x,y-r*0.98,r*0.14,0,GTAU); g.fill();
  },

  tart: (g,S,x,y,r,c,m,c2) => {                   // タルト
    g.fillStyle = c2 || '#e0b878';
    g.beginPath();
    g.moveTo(x-r*1.0,y-r*0.2); g.lineTo(x+r*1.0,y-r*0.2);
    g.lineTo(x+r*0.78,y+r*0.6); g.lineTo(x-r*0.78,y+r*0.6); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,255,255,.45)'; g.lineWidth=r*0.06;
    for (let i=-3;i<=3;i++){ g.beginPath();
      g.moveTo(x+r*i*0.28,y-r*0.18); g.lineTo(x+r*i*0.22,y+r*0.58); g.stroke(); }
    g.fillStyle = 'rgba(255,250,240,.9)';
    g.beginPath(); g.ellipse(x,y-r*0.24,r*1.0,r*0.2,0,0,GTAU); g.fill();
    g.fillStyle = c;                               // フルーツ
    for (const [dx,dy,rr] of [[-0.5,-0.32,0.2],[0,-0.42,0.22],[0.5,-0.32,0.2],[-0.24,-0.2,0.16],[0.26,-0.2,0.16]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*rr,0,GTAU); g.fill();
    }
  },

  eclair: (g,S,x,y,r,c,m,c2) => {                 // エクレア（シュー生地・クリーム・チョコがけ）
    const top = (dy) => {                          // うわ面の カーブ。チョコがけと 生地で 共用
      g.moveTo(x-r*1.06,y+r*0.12+dy);
      g.bezierCurveTo(x-r*1.14,y-r*0.42+dy, x-r*0.6,y-r*0.5+dy, x, y-r*0.48+dy);
      g.bezierCurveTo(x+r*0.6,y-r*0.5+dy, x+r*1.14,y-r*0.42+dy, x+r*1.06,y+r*0.12+dy);
    };
    g.fillStyle = c2 || '#f2d29c';                 // シュー生地（あかるい きつね色）
    g.beginPath(); top(0);
    g.bezierCurveTo(x+r*1.14,y+r*0.62, x+r*0.6,y+r*0.7, x, y+r*0.68);
    g.bezierCurveTo(x-r*0.6,y+r*0.7, x-r*1.14,y+r*0.62, x-r*1.06,y+r*0.12);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(150,100,55,.3)'; g.lineWidth = r*0.05;   // わりめ（クリームは のぞくだけ）
    g.beginPath();
    g.moveTo(x-r*0.98,y+r*0.36);
    for (let i=-3;i<=3;i++) g.quadraticCurveTo(x+r*(i*0.3+0.15), y+r*(i%2?0.44:0.3), x+r*i*0.3, y+r*0.38);
    g.lineTo(x+r*0.98,y+r*0.36); g.stroke();
    // チョコがけ。うわ面の 4わり だけに して、下は 生地を のこす
    g.fillStyle = c;
    g.beginPath(); top(0);
    g.lineTo(x+r*1.0,y+r*0.04);
    for (let i=3;i>=-3;i--)
      g.quadraticCurveTo(x+r*(i*0.3+0.15), y+r*(i%2?0.1:-0.06), x+r*i*0.3, y-r*0.02);
    g.lineTo(x-r*1.0,y+r*0.04);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.4)';          // チョコの てり
    g.beginPath(); g.ellipse(x-r*0.3,y-r*0.32,r*0.4,r*0.1,0.04,0,GTAU); g.fill();
  },

  cream: (g,S,x,y,r,c,m,c2) => {                  // シュークリーム
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<=14;i++){
      const a=i/14*GTAU, rr=r*(0.94+0.08*Math.sin(i*3));
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*0.88;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || 'rgba(255,250,235,.9)';    // わったところの クリーム
    g.beginPath();
    g.moveTo(x-r*0.92,y+r*0.1);
    for (let i=-3;i<=3;i++) g.quadraticCurveTo(x+r*(i*0.3+0.15), y+r*(i%2?0.34:0.02), x+r*i*0.3, y+r*0.18);
    g.lineTo(x+r*0.92,y+r*0.1); g.lineTo(x+r*0.9,y+r*0.32); g.lineTo(x-r*0.9,y+r*0.32);
    g.closePath(); g.fill();
  },

  roll: (g,S,x,y,r,c,m,c2) => {                   // ロールケーキ（よこに ねた 円柱。だんめんの うずが 主役）
    const ec = c2 || '#f2d29c';
    g.fillStyle = ec;
    // よこに ながい 円柱に する。まるいと ただの ボールに 見える
    g.beginPath();
    g.moveTo(x-r*0.62,y-r*0.86); g.lineTo(x+r*0.72,y-r*0.86);
    g.bezierCurveTo(x+r*1.14,y-r*0.86, x+r*1.14,y+r*0.86, x+r*0.72,y+r*0.86);
    g.lineTo(x-r*0.62,y+r*0.86); g.closePath(); g.fill();
    g.fillStyle = 'rgba(150,105,60,.22)';          // おくがわの かげ
    g.beginPath();
    g.moveTo(x+r*0.5,y-r*0.86); g.lineTo(x+r*0.72,y-r*0.86);
    g.bezierCurveTo(x+r*1.14,y-r*0.86, x+r*1.14,y+r*0.86, x+r*0.72,y+r*0.86);
    g.lineTo(x+r*0.5,y+r*0.86); g.closePath(); g.fill();
    const cx2 = x - r*0.6;
    g.fillStyle = ec;                              // 手まえの だんめん
    g.beginPath(); g.ellipse(cx2, y, r*0.5, r*0.88, 0,0,GTAU); g.fill();
    g.save();                                      // うずは だんめんから はみ出させない
    g.beginPath(); g.ellipse(cx2, y, r*0.5, r*0.88, 0,0,GTAU); g.clip();
    for (const [w,col] of [[0.26,'rgba(255,250,238,.98)'],[0.15,c]]){
      g.strokeStyle = col; g.lineWidth = r*w; g.lineCap='round';
      g.beginPath();
      for (let i=0;i<=72;i++){
        const t=i/72, a2=t*GTAU*1.8 - 1.4, rr=0.66*(1-t*0.86);
        const px=cx2+Math.cos(a2)*r*rr*0.62, py=y+Math.sin(a2)*r*rr*1.1;
        i? g.lineTo(px,py) : g.moveTo(px,py);
      }
      g.stroke();
    }
    g.restore();
    g.fillStyle='#ff5f8a';                         // まん中の いちご
    g.beginPath(); g.ellipse(cx2, y, r*0.11, r*0.15, 0,0,GTAU); g.fill();
    g.strokeStyle='rgba(160,110,60,.35)'; g.lineWidth=r*0.05;
    g.beginPath(); g.ellipse(cx2, y, r*0.5, r*0.88, 0,0,GTAU); g.stroke();
    g.fillStyle='rgba(255,250,238,.98)';           // 上の 生クリーム
    g.beginPath(); g.ellipse(x+r*0.36, y-r*0.92, r*0.24, r*0.16, 0, Math.PI, 0); g.fill();
    g.fillStyle='#ff3f6b';
    g.beginPath(); g.ellipse(x+r*0.36, y-r*1.12, r*0.15, r*0.18, 0,0,GTAU); g.fill();
    g.fillStyle='#5fb35f';
    g.beginPath(); g.ellipse(x+r*0.36, y-r*1.26, r*0.12, r*0.05, 0,0,GTAU); g.fill();
  },

  baum: (g,S,x,y,r,c,m,c2) => {                   // バウムクーヘン
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y,r*1.0,r*0.92,0,0,GTAU); g.fill();
    g.strokeStyle = c2 || 'rgba(255,240,215,.8)'; g.lineWidth = r*0.07;
    for (let i=1;i<=3;i++){
      g.beginPath(); g.ellipse(x,y,r*(1.0-i*0.24),r*(0.92-i*0.22),0,0,GTAU); g.stroke();
    }
    g.globalCompositeOperation='destination-out';
    g.beginPath(); g.ellipse(x,y,r*0.22,r*0.2,0,0,GTAU); g.fill();
    g.globalCompositeOperation='source-over';
  },

  mont: (g,S,x,y,r,c,m,c2) => {                   // モンブラン（そうめん状の マロンクリーム）
    g.fillStyle = '#e0b878';                       // タルトの 土台
    gRR(g, x-r*0.96, y+r*0.42, r*1.92, r*0.5, r*0.1); g.fill();
    g.fillStyle = 'rgba(150,100,50,.28)';          // 土台の ぎざぎざ
    for (let i=0;i<9;i++){
      g.beginPath(); g.moveTo(x-r*0.96+i*r*0.215, y+r*0.42);
      g.lineTo(x-r*0.96+i*r*0.215+r*0.06, y+r*0.92);
      g.lineTo(x-r*0.96+i*r*0.215+r*0.12, y+r*0.42); g.closePath(); g.fill();
    }
    const dome = () => {
      g.beginPath();
      g.moveTo(x-r*0.9,y+r*0.46);
      g.bezierCurveTo(x-r*0.84,y-r*0.44, x-r*0.36,y-r*0.9, x, y-r*0.92);
      g.bezierCurveTo(x+r*0.36,y-r*0.9, x+r*0.84,y-r*0.44, x+r*0.9,y+r*0.46);
      g.closePath();
    };
    g.fillStyle = c; dome(); g.fill();
    g.save(); dome(); g.clip();
    // すじを むきも 長さも ばらして かさねる。そろえると かごの あみ目に なる
    g.lineCap = 'round'; g.lineWidth = r*0.1;
    const TONE = [c2 || 'rgba(150,100,50,.4)', 'rgba(255,255,255,.4)',
                  'rgba(150,100,50,.22)', 'rgba(255,255,255,.22)'];
    for (let i=0;i<70;i++){
      const u = Math.sin(i*12.9898)*43758.5453, v = u - Math.floor(u);      // ばらつきの たね
      const w = Math.sin(i*78.233)*12345.6789, q = w - Math.floor(w);
      const px = x + (v*2-1)*r*0.88, py = y + (q*1.5-0.62)*r*0.92;
      const ang = (v+q)*3.6 - 1.8;                 // すじの むき
      const len = r*(0.4 + q*0.5);
      g.strokeStyle = TONE[i%4];
      g.beginPath();
      g.moveTo(px - Math.cos(ang)*len, py - Math.sin(ang)*len*0.5);
      g.quadraticCurveTo(px, py + r*0.1, px + Math.cos(ang)*len, py + Math.sin(ang)*len*0.5);
      g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.14)';         // 左上からの ひかり
    g.beginPath(); g.ellipse(x-r*0.32, y-r*0.4, r*0.4, r*0.5, -0.4, 0, GTAU); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,250,238,.98)';         // てっぺんの 生クリーム
    g.beginPath(); g.arc(x, y-r*0.9, r*0.25, 0, GTAU); g.fill();
    g.fillStyle = '#8a5a30';                       // マロン
    g.beginPath(); g.ellipse(x, y-r*1.14, r*0.2, r*0.17, 0,0,GTAU); g.fill();
    g.fillStyle = '#c98a54';
    g.beginPath(); g.ellipse(x, y-r*1.2, r*0.18, r*0.08, 0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)';          // こなざとう
    for (let i=0;i<10;i++){
      const a2=i*2.399;
      g.beginPath();
      g.arc(x+Math.cos(a2)*r*0.62, y-r*0.14+Math.sin(a2)*r*0.44, r*0.04, 0, GTAU); g.fill();
    }
  },

  mille: (g,S,x,y,r,c,m,c2) => {                  // ミルフィーユ（パイと クリームの そう）
    for (let i=0;i<3;i++){
      const ly = y - r*0.92 + i*r*0.7;
      g.fillStyle = c2 || '#e8c090';               // パイ生地
      gRR(g, x-r*0.94, ly, r*1.88, r*0.3, r*0.05); g.fill();
      g.strokeStyle = 'rgba(160,110,60,.45)'; g.lineWidth = r*0.035;
      for (let k=0;k<3;k++){
        g.beginPath();
        g.moveTo(x-r*0.9, ly+r*0.08+k*r*0.07); g.lineTo(x+r*0.9, ly+r*0.08+k*r*0.07); g.stroke();
      }
      if (i < 2){                                  // クリームと いちご
        g.fillStyle = 'rgba(255,250,240,.97)';
        gRR(g, x-r*0.9, ly+r*0.3, r*1.8, r*0.24, r*0.05); g.fill();
        for (let k=-3;k<=3;k++){
          g.beginPath(); g.arc(x+r*k*0.26, ly+r*0.54, r*0.15, Math.PI, 0); g.fill();
        }
        g.fillStyle = '#ff5f8a';
        for (let k=-2;k<=2;k++){
          g.beginPath(); g.ellipse(x+r*k*0.38, ly+r*0.46, r*0.11, r*0.14, 0,0,GTAU); g.fill();
        }
      }
    }
    g.fillStyle = 'rgba(255,255,255,.9)';          // こなざとう
    for (let i=-4;i<=4;i++){
      g.beginPath(); g.arc(x+r*i*0.2, y-r*0.98, r*0.04, 0, GTAU); g.fill();
    }
    g.fillStyle = '#ff3f6b';                       // てっぺんの いちご
    g.beginPath();
    g.moveTo(x+r*0.52, y-r*0.84);
    g.bezierCurveTo(x+r*0.2,y-r*1.12, x+r*0.28,y-r*1.44, x+r*0.52,y-r*1.42);
    g.bezierCurveTo(x+r*0.76,y-r*1.44, x+r*0.84,y-r*1.12, x+r*0.52,y-r*0.84);
    g.closePath(); g.fill();
    g.fillStyle = '#5fb35f';
    g.beginPath(); g.ellipse(x+r*0.52,y-r*1.42,r*0.17,r*0.07,0,0,GTAU); g.fill();
  },

  waffle: (g,S,x,y,r,c,m,c2) => {                 // ワッフル
    g.fillStyle = c;
    gRR(g, x-r*0.94, y-r*0.8, r*1.88, r*1.6, r*0.16); g.fill();
    g.fillStyle = c2 || 'rgba(150,105,60,.4)';
    for (let a=0;a<3;a++) for (let b=0;b<3;b++){
      gRR(g, x-r*0.78+a*r*0.56, y-r*0.64+b*r*0.5, r*0.4, r*0.34, r*0.05); g.fill();
    }
  },

  pancake: (g,S,x,y,r,c,m,c2) => {                // パンケーキ（3まい・バター・シロップ）
    g.fillStyle = 'rgba(255,255,255,.92)';        // おさら
    g.beginPath(); g.ellipse(x, y+r*1.04, r*1.26, r*0.24, 0,0,GTAU); g.fill();
    for (let i=2;i>=0;i--){                        // 3まい かさねる
      const cy2 = y + r*(0.7 - i*0.44);
      g.fillStyle = c2 || '#d8a050';               // 側面（やけ色）
      gRR(g, x-r*0.92, cy2-r*0.2, r*1.84, r*0.44, r*0.2); g.fill();
      g.fillStyle = c;                             // 上の面
      g.beginPath(); g.ellipse(x, cy2-r*0.2, r*0.92, r*0.21, 0,0,GTAU); g.fill();
    }
    g.fillStyle = 'rgba(185,105,35,.8)';           // シロップ
    g.beginPath();
    g.moveTo(x-r*0.8,y-r*0.42);
    g.quadraticCurveTo(x, y-r*0.12, x+r*0.8,y-r*0.42);
    g.quadraticCurveTo(x+r*0.9,y+r*0.24, x+r*0.66,y+r*0.42);
    g.quadraticCurveTo(x+r*0.64,y-r*0.06, x+r*0.34,y-r*0.08);
    g.quadraticCurveTo(x,y+r*0.1, x-r*0.34,y-r*0.08);
    g.quadraticCurveTo(x-r*0.58,y+r*0.3, x-r*0.72,y+r*0.06);
    g.quadraticCurveTo(x-r*0.9,y-r*0.16, x-r*0.8,y-r*0.42);
    g.closePath(); g.fill();
    g.fillStyle = '#ffe08a';                       // バター
    gRR(g, x-r*0.26, y-r*0.72, r*0.52, r*0.32, r*0.05); g.fill();
    g.fillStyle = '#ffcf52';
    gRR(g, x-r*0.26, y-r*0.5, r*0.52, r*0.12, r*0.03); g.fill();
  },

  pretzel: (g,S,x,y,r,c,m,c2) => {                // プレッツェル
    g.strokeStyle = c; g.lineWidth = r*0.24; g.lineCap='round'; g.lineJoin='round';
    g.beginPath();
    g.moveTo(x-r*0.3,y+r*0.78);
    g.bezierCurveTo(x-r*1.3,y+r*0.2, x-r*1.0,y-r*0.96, x-r*0.16,y-r*0.5);
    g.bezierCurveTo(x+r*0.3,y-r*0.28, x-r*0.3,y-r*0.28, x+r*0.16,y-r*0.5);
    g.bezierCurveTo(x+r*1.0,y-r*0.96, x+r*1.3,y+r*0.2, x+r*0.3,y+r*0.78);
    g.stroke();
    g.fillStyle = c2 || 'rgba(255,255,255,.7)';
    for (const [dx,dy] of [[-0.7,0.1],[0.7,0.1],[-0.2,-0.5],[0.2,0.6]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*0.06,0,GTAU); g.fill();
    }
  },

  churro: (g,S,x,y,r,c,m,c2) => {                 // チュロス（紙コップに 3本。みぞと さとう）
    // 1本を えがく。ほし形の だんめんを たてみぞ で あらわす
    const stick = (bx, by, rot, len) => {
      g.save(); g.translate(bx, by); g.rotate(rot);
      g.fillStyle = c;
      gRR(g, -r*0.24, -len, r*0.48, len, r*0.24); g.fill();
      g.strokeStyle = c2 || 'rgba(150,95,45,.55)'; g.lineWidth = r*0.06;
      for (const dx of [-0.13, 0.0, 0.13]){
        g.beginPath(); g.moveTo(r*dx, -len+r*0.16); g.lineTo(r*dx, -r*0.1); g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,.3)';        // 左はしの てり
      gRR(g, -r*0.22, -len+r*0.14, r*0.08, len-r*0.3, r*0.04); g.fill();
      g.fillStyle = 'rgba(255,255,255,.9)';        // シナモンシュガー
      for (let i=0;i<9;i++){
        g.beginPath();
        g.arc(r*(-0.16+0.08*(i%4)), -len+r*0.24+i*(len-r*0.4)/9, r*0.042, 0, GTAU); g.fill();
      }
      g.restore();
    };
    stick(x-r*0.34, y+r*0.5, -0.34, r*1.7);
    stick(x+r*0.34, y+r*0.5,  0.34, r*1.7);
    stick(x,        y+r*0.56, 0.0,  r*1.86);
    // 紙コップ（赤と白の しま）
    g.fillStyle = '#fdfaff';
    g.beginPath();
    g.moveTo(x-r*0.6,y+r*0.34); g.lineTo(x+r*0.6,y+r*0.34);
    g.lineTo(x+r*0.42,y+r*1.14); g.lineTo(x-r*0.42,y+r*1.14);
    g.closePath();
    g.save(); g.clip(); g.fill();
    g.fillStyle = '#ff8fa8';
    for (let i=-3;i<=3;i++){
      g.save(); g.translate(x+r*i*0.3, y+r*0.7); g.rotate(0.1);
      g.fillRect(-r*0.07, -r*0.6, r*0.14, r*1.2); g.restore();
    }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.95)';         // コップの ふち
    gRR(g, x-r*0.64, y+r*0.28, r*1.28, r*0.16, r*0.08); g.fill();
  },

  popcorn: (g,S,x,y,r,c,m,c2) => {                // ポップコーン
    g.fillStyle = c2 || '#e8503f';
    g.beginPath();
    g.moveTo(x-r*0.76,y+r*0.02); g.lineTo(x+r*0.76,y+r*0.02);
    g.lineTo(x+r*0.56,y+r*1.06); g.lineTo(x-r*0.56,y+r*1.06); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.75)';
    for (let i=-1;i<=1;i++){ gRR(g, x+r*i*0.4-r*0.1, y+r*0.06, r*0.2, r*1.0, r*0.04); g.fill(); }
    g.fillStyle = c;                               // はじけた つぶ
    for (const [dx,dy] of [[-0.5,-0.16],[0,-0.36],[0.5,-0.16],[-0.24,-0.62],[0.28,-0.6],[0,-0.86]]){
      for (let k=0;k<4;k++){
        const a=k*GTAU/4+0.4;
        g.beginPath(); g.arc(x+r*dx+Math.cos(a)*r*0.14, y+r*dy+Math.sin(a)*r*0.14, r*0.17,0,GTAU); g.fill();
      }
    }
  },

  marshmallow: (g,S,x,y,r,c,m,c2) => {            // マシュマロ
    g.fillStyle = c;
    gRR(g, x-r*0.86, y-r*0.6, r*1.72, r*1.2, r*0.4); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.6)';
    g.beginPath(); g.ellipse(x,y-r*0.44,r*0.72,r*0.2,0,0,GTAU); g.fill();
  },

  gummy: (g,S,x,y,r,c,m,c2) => {                  // グミ（くまの形）
    g.globalAlpha = 0.88;
    g.fillStyle = c;
    g.beginPath(); g.arc(x,y-r*0.5,r*0.42,0,GTAU); g.fill();
    for (const s2 of [-1,1]) { g.beginPath(); g.arc(x+s2*r*0.36,y-r*0.8,r*0.18,0,GTAU); g.fill(); }
    g.beginPath(); g.ellipse(x,y+r*0.3,r*0.52,r*0.6,0,0,GTAU); g.fill();
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(x+s2*r*0.6,y+r*0.14,r*0.2,r*0.3,s2*0.4,0,GTAU); g.fill();
      g.beginPath(); g.ellipse(x+s2*r*0.34,y+r*0.92,r*0.2,r*0.26,s2*0.2,0,GTAU); g.fill();
    }
    g.globalAlpha = 1;
  },

  jelly2: (g,S,x,y,r,c,m,c2) => {                 // ゼリー
    g.globalAlpha = 0.85;
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*0.8,y-r*0.6); g.lineTo(x+r*0.8,y-r*0.6);
    g.lineTo(x+r*0.6,y+r*0.86); g.lineTo(x-r*0.6,y+r*0.86); g.closePath(); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = c2 || 'rgba(255,255,255,.55)';
    g.beginPath(); g.ellipse(x,y-r*0.6,r*0.8,r*0.18,0,0,GTAU); g.fill();
    g.beginPath(); g.ellipse(x-r*0.34,y-r*0.06,r*0.16,r*0.3,0.2,0,GTAU); g.fill();
  },
  /* --- 和菓子 --- */

  monaka: (g,S,x,y,r,c,m,c2) => {                 // もなか
    g.fillStyle = c;
    gRR(g, x-r*0.92, y-r*0.56, r*1.84, r*1.12, r*0.22); g.fill();
    g.fillStyle = c2 || '#5b3a4a';
    gRR(g, x-r*0.86, y-r*0.12, r*1.72, r*0.26, r*0.08); g.fill();
    g.strokeStyle='rgba(160,120,80,.45)'; g.lineWidth=r*0.05;
    for (let i=-2;i<=2;i++){
      g.beginPath(); g.moveTo(x+r*i*0.32,y-r*0.5); g.lineTo(x+r*i*0.32,y-r*0.16); g.stroke();
      g.beginPath(); g.moveTo(x+r*i*0.32,y+r*0.16); g.lineTo(x+r*i*0.32,y+r*0.5); g.stroke();
    }
  },

  kintsuba: (g,S,x,y,r,c,m,c2) => {               // きんつば
    g.fillStyle = c;
    gRR(g, x-r*0.86, y-r*0.66, r*1.72, r*1.32, r*0.1); g.fill();
    g.fillStyle = c2 || 'rgba(255,250,240,.75)';
    g.lineWidth=r*0.08; g.strokeStyle=c2||'rgba(255,250,240,.75)';
    gRR(g, x-r*0.86, y-r*0.66, r*1.72, r*1.32, r*0.1); g.stroke();
    g.fillStyle='rgba(60,40,55,.35)';
    for (const [dx,dy] of [[-0.34,-0.2],[0.2,0.1],[-0.1,0.42],[0.4,-0.34]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*0.11,0,GTAU); g.fill();
    }
  },

  ohagi: (g,S,x,y,r,c,m,c2) => {                  // おはぎ
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y+r*0.06,r*0.92,r*0.8,0,0,GTAU); g.fill();
    g.fillStyle = c2 || 'rgba(90,55,70,.45)';
    for (let i=0;i<26;i++){
      const a=i*2.399, rr=r*0.78*Math.sqrt(i/26);
      g.beginPath(); g.arc(x+Math.cos(a)*rr, y+r*0.06+Math.sin(a)*rr*0.86, r*0.09,0,GTAU); g.fill();
    }
  },

  warabi: (g,S,x,y,r,c,m,c2) => {                 // わらびもち
    g.globalAlpha=0.9; g.fillStyle = c;
    for (const [dx,dy] of [[-0.42,0.1],[0.42,0.1],[0,-0.3],[0,0.5]]){
      gRR(g, x+r*dx-r*0.36, y+r*dy-r*0.32, r*0.72, r*0.64, r*0.16); g.fill();
    }
    g.globalAlpha=1;
    g.fillStyle = c2 || '#8a6a4a';                 // きなこ
    for (let i=0;i<24;i++){
      const a=i*2.399, rr=r*0.9*Math.sqrt(i/24);
      g.beginPath(); g.arc(x+Math.cos(a)*rr, y+Math.sin(a)*rr, r*0.05,0,GTAU); g.fill();
    }
  },

  sakuramochi: (g,S,x,y,r,c,m,c2) => {            // さくらもち
    g.fillStyle = c2 || '#6f9e5e';                 // さくらの は
    g.beginPath();
    g.moveTo(x-r*1.1,y+r*0.2);
    g.quadraticCurveTo(x, y-r*0.9, x+r*1.1,y+r*0.2);
    g.quadraticCurveTo(x, y+r*0.9, x-r*1.1,y+r*0.2);
    g.closePath(); g.fill();
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y+r*0.06,r*0.72,r*0.56,0,0,GTAU); g.fill();
  },

  manju: (g,S,x,y,r,c,m,c2) => {                  // まんじゅう
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y+r*0.12,r*0.94,r*0.72,0,0,GTAU); g.fill();
    g.fillStyle = c2 || '#e8503f';                 // やきいん
    g.beginPath(); g.arc(x,y-r*0.06,r*0.26,0,GTAU); g.fill();
    g.fillStyle='rgba(255,255,255,.6)';
    g.beginPath(); g.arc(x,y-r*0.06,r*0.14,0,GTAU); g.fill();
  },

  senbei: (g,S,x,y,r,c,m,c2) => {                 // せんべい
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<=18;i++){
      const a=i/18*GTAU, rr=r*(0.98+0.04*Math.sin(i*4));
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || '#3a2c20';                 // のり
    gRR(g, x-r*0.34, y-r*1.0, r*0.68, r*2.0, r*0.04); g.fill();
  },

  castella: (g,S,x,y,r,c,m,c2) => {               // カステラ（上下の こげと ざらめ）
    const bx = x-r*0.98, by = y-r*0.72, bw = r*1.96, bh = r*1.5;
    g.fillStyle = c;                               // きじ（あわい たまご色）
    gRR(g, bx, by, bw, bh, r*0.1); g.fill();
    const crust = c2 || '#a0602a';
    g.save(); gRR(g, bx, by, bw, bh, r*0.1); g.clip();
    g.fillStyle = crust;                           // 上の こげ
    g.fillRect(bx, by, bw, r*0.26);
    g.fillStyle = 'rgba(255,255,255,.25)';
    g.fillRect(bx, by+r*0.2, bw, r*0.07);
    g.fillStyle = crust;                           // 下の こげ（ざらめが つく ところ）
    g.fillRect(bx, y+r*0.36, bw, r*0.42);
    // きめ（あわの あな）。カステラは たてに ながい あなが ならぶ
    g.fillStyle = 'rgba(190,140,70,.28)';
    for (let i=0;i<22;i++){
      const a2=i*2.399, rr=r*0.82*Math.sqrt(i/22);
      g.beginPath();
      g.ellipse(x+Math.cos(a2)*rr, y-r*0.06+Math.sin(a2)*rr*0.42, r*0.045, r*0.07, 0,0,GTAU); g.fill();
    }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.85)';         // ざらめの つぶ
    for (let i=0;i<11;i++){
      g.beginPath();
      g.arc(x-r*0.86+i*r*0.172, y+r*(0.6+0.06*Math.sin(i*2.1)), r*0.055, 0, GTAU); g.fill();
    }
    g.strokeStyle = 'rgba(160,110,50,.4)'; g.lineWidth = r*0.05;   // ふちを しめる
    gRR(g, bx, by, bw, bh, r*0.1); g.stroke();
  },

  konpeito: (g,S,x,y,r,c,m,c2) => {               // こんぺいとう
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<18;i++){
      const a=i*GTAU/18, rr=r*(i%2?0.6:1.0);
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
  },

  anmitsu: (g,S,x,y,r,c,m,c2) => {                // あんみつ（うつわに かんてん・くだもの・あん）
    g.fillStyle = 'rgba(226,242,252,.95)';         // ガラスの おわん
    g.beginPath();
    g.moveTo(x-r*1.06,y-r*0.34);
    g.bezierCurveTo(x-r*1.0,y+r*0.72, x-r*0.6,y+r*0.94, x, y+r*0.94);
    g.bezierCurveTo(x+r*0.6,y+r*0.94, x+r*1.0,y+r*0.72, x+r*1.06,y-r*0.34);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)';          // ふちの あつみ
    g.beginPath(); g.ellipse(x, y-r*0.34, r*1.06, r*0.2, 0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(190,220,240,.7)';          // 台（高台）
    gRR(g, x-r*0.16, y+r*0.86, r*0.32, r*0.2, r*0.04); g.fill();
    g.beginPath(); g.ellipse(x, y+r*1.06, r*0.44, r*0.13, 0,0,GTAU); g.fill();
    // かんてんの さいころ。すきとおる ので ふちを 白く のこす
    for (const [dx,dy,cc] of [[-0.56,0.06,'#a8e8d4'],[-0.2,0.3,'#ffe0b0'],
                              [0.2,0.3,'#a8dcf4'],[0.56,0.06,'#d8f0ff'],
                              [-0.4,0.56,'#c9f0d8'],[0.06,0.62,'#ffd0e0'],[0.44,0.56,'#e8ddff']]){
      g.fillStyle = cc;
      gRR(g, x+r*dx-r*0.19, y+r*dy-r*0.19, r*0.38, r*0.38, r*0.07); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)';
      gRR(g, x+r*dx-r*0.14, y+r*dy-r*0.15, r*0.2, r*0.1, r*0.03); g.fill();
    }
    g.fillStyle = c2 || '#4a2f3c';                 // あん（つやのある 山）
    g.beginPath(); g.ellipse(x-r*0.02, y-r*0.14, r*0.42, r*0.34, 0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)';
    g.beginPath(); g.ellipse(x-r*0.14, y-r*0.26, r*0.18, r*0.08, -0.3,0,GTAU); g.fill();
    g.fillStyle = '#ffa54a';                       // みかん
    g.beginPath(); g.ellipse(x-r*0.64, y-r*0.36, r*0.26, r*0.18, 0.25,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)';
    for (let i=0;i<4;i++){ g.beginPath(); g.moveTo(x-r*0.64,y-r*0.36);
      g.arc(x-r*0.64, y-r*0.36, r*0.24, 2.9+i*0.34, 3.0+i*0.34); g.fill(); }
    g.fillStyle = '#fdfaff';                       // しらたま
    g.beginPath(); g.arc(x+r*0.5, y-r*0.4, r*0.2, 0, GTAU); g.fill();
    g.fillStyle = '#ff3f6b';                       // さくらんぼ
    g.beginPath(); g.arc(x+r*0.14, y-r*0.62, r*0.19, 0, GTAU); g.fill();
    g.strokeStyle='#5fb35f'; g.lineWidth=r*0.05; g.lineCap='round';
    g.beginPath(); g.moveTo(x+r*0.14,y-r*0.78);
    g.quadraticCurveTo(x+r*0.3,y-r*1.04, x+r*0.5,y-r*1.0); g.stroke();
  },

  tower: (g,S,x,y,r,c,m,c2) => {                  // マカロンタワー（まるい マカロンを つみあげる）
    const mac = (mx,my,mr,col) => {
      g.fillStyle = col;
      g.beginPath(); g.ellipse(mx,my-mr*0.36,mr,mr*0.44,0,0,GTAU); g.fill();
      g.beginPath(); g.ellipse(mx,my+mr*0.36,mr,mr*0.44,0,0,GTAU); g.fill();
      g.fillStyle = 'rgba(255,250,240,.95)';
      gRR(g, mx-mr*0.94, my-mr*0.14, mr*1.88, mr*0.28, mr*0.13); g.fill();
    };
    const cols = [c, c2 || '#c9a7ff', '#8fe3c4', '#ffd9a8'];
    for (let row=0; row<4; row++){
      const n = 4 - row, mr = r*0.27, gap = r*0.6;
      for (let i=0;i<n;i++)
        mac(x + (i-(n-1)/2)*gap, y + r*(1.0 - row*0.5), mr, cols[(row+i)%4]);
    }
    g.fillStyle = m || '#ffd76e';                  // てっぺんの ほし
    g.beginPath();
    for (let i=0;i<10;i++){
      const a2=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.09:r*0.22;
      i? g.lineTo(x+Math.cos(a2)*rr, y-r*1.2+Math.sin(a2)*rr)
       : g.moveTo(x+Math.cos(a2)*rr, y-r*1.2+Math.sin(a2)*rr);
    }
    g.closePath(); g.fill();
  },

  dango: (g,S,x,y,r,c,m,c2) => {                  // 三色だんご
    g.strokeStyle = '#d8b98a'; g.lineWidth = r*0.14; g.lineCap='round';
    g.beginPath(); g.moveTo(x, y+r*1.24); g.lineTo(x, y-r*1.0); g.stroke();
    const cols = [c, c2 || '#c9e8a8', '#ffc2d4'];
    for (let i=0;i<3;i++){
      g.fillStyle = cols[i];
      g.beginPath(); g.arc(x, y+r*0.7 - i*r*0.7, r*0.44, 0, GTAU); g.fill();
    }
  },

  daifuku: (g,S,x,y,r,c,m,c2) => {                // だいふく（もちと 中の あん）
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x, y+r*0.06, r*1.02, r*0.84, 0, 0, GTAU); g.fill();
    g.fillStyle = c2 || 'rgba(200,160,180,.35)';  // 中の あんが すける
    g.beginPath(); g.ellipse(x, y+r*0.16, r*0.5, r*0.36, 0, 0, GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.6)';         // もちとり粉
    for (let i=0;i<10;i++){
      const a2=i*2.399, rr=r*0.8*Math.sqrt(i/10);
      g.beginPath(); g.arc(x+Math.cos(a2)*rr, y+Math.sin(a2)*rr*0.8, r*0.045,0,GTAU); g.fill();
    }
  },

  youkan: (g,S,x,y,r,c,m,c2) => {                 // ようかん（つやのある 直方体）
    g.fillStyle = c;
    g.beginPath();                                 // 上の面（おくゆき）
    g.moveTo(x-r*0.8,y-r*0.5); g.lineTo(x+r*0.62,y-r*0.72);
    g.lineTo(x+r*0.94,y-r*0.44); g.lineTo(x-r*0.5,y-r*0.22); g.closePath(); g.fill();
    g.fillStyle = c2 || '#3a2430';                 // 手まえの 面
    g.beginPath();
    g.moveTo(x-r*0.8,y-r*0.5); g.lineTo(x-r*0.5,y-r*0.22);
    g.lineTo(x-r*0.5,y+r*0.72); g.lineTo(x-r*0.8,y+r*0.46); g.closePath(); g.fill();
    g.fillStyle = c;
    gRR(g, x-r*0.5, y-r*0.24, r*1.44, r*0.96, r*0.05); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)';         // つや
    gRR(g, x-r*0.4, y-r*0.14, r*1.24, r*0.16, r*0.04); g.fill();
  },

  dorayaki: (g,S,x,y,r,c,m,c2) => {               // どらやき
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x, y-r*0.36, r*1.0, r*0.46, 0, 0, GTAU); g.fill();
    g.beginPath(); g.ellipse(x, y+r*0.36, r*1.0, r*0.46, 0, 0, GTAU); g.fill();
    g.fillStyle = c2 || '#6b4530';                 // あんこ
    gRR(g, x-r*0.92, y-r*0.16, r*1.84, r*0.32, r*0.14); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)';         // やけの てり

  taiyaki: (g,S,x,y,r,c,m,c2) => {                // たいやき

    g.lineTo(x+r*1.34,y-r*0.54); g.lineTo(x+r*1.2,y);
    g.lineTo(x+r*1.34,y+r*0.54); g.closePath(); g.fill();
    g.strokeStyle = c2 || '#c98a44'; g.lineWidth = r*0.06;

    for (let i=0;i<3;i++){                         // うろこ
      g.beginPath();

  cookie: (g,S,x,y,r,c,m,c2) => {                 // まるいクッキー

      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || '#8a5a30';                 // チョコチップ
    for (const [dx,dy,rr] of [[-0.4,-0.3,0.14],[0.35,-0.12,0.12],[-0.12,0.4,0.13],
                              [0.44,0.4,0.11],[0.06,-0.5,0.1],[-0.52,0.2,0.1]]){

  },

  donut: (g,S,x,y,r,c,m,c2) => {                  // ドーナツ（グレーズと スプレー）
    g.fillStyle = c;

    g.fillStyle = c2 || '#ff9ec9';                 // うえの グレーズ（ふちが たれる）
    g.beginPath();
    for (let i=0;i<=24;i++){
      const a2=i/24*GTAU, rr=r*(0.86+0.1*Math.sin(i*2.2));
      const px=x+Math.cos(a2)*rr, py=y+Math.sin(a2)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.arc(x,y,r*0.36,0,GTAU,true); g.fill();
    const spr=['#ffffff','#ffd76e','#8fe3c4','#9ed8ff'];   // スプレー
    for (let i=0;i<12;i++){
      const a2=i*2.1, rr=r*(0.5+0.24*((i*7)%3)/2);
      g.save(); g.translate(x+Math.cos(a2)*rr, y+Math.sin(a2)*rr); g.rotate(a2*1.7);
      g.fillStyle = spr[i%4];
      gRR(g, -r*0.09, -r*0.03, r*0.18, r*0.06, r*0.03); g.fill();

  purin: (g,S,x,y,r,c,m,c2) => {                  // プリン（カラメルつき）

  kakigori: (g,S,x,y,r,c,m,c2) => {               // かきごおり（うつわと シロップ）

    g.quadraticCurveTo(x+r*0.6,y-r*0.98, x+r*0.92, y+r*0.3);
    g.closePath(); g.fill();
    g.fillStyle = c;                               // シロップ（上から かかる）
    g.beginPath();
    g.moveTo(x-r*0.74,y-r*0.02);

    g.fillStyle = c2 || '#ffffff';                 // れんにゅう

  parfait: (g,S,x,y,r,c,m,c2) => {                // パフェ（グラスに 層）

    g.fillStyle = 'rgba(240,248,255,.85)';

/* かお。図鑑のカードは小さいので 点の目とまるいほっぺ */
function gface(g,S,x,y,r,mood){
  g.fillStyle = 'rgba(255,120,165,.4)';
  for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.52, y+r*0.2, r*0.17, 0, GTAU); g.fill(); }
  if (mood === 'angry' || mood === 'naughty'){
    const k = mood === 'angry' ? 1 : 0.6;
    g.strokeStyle = '#4a3348'; g.lineWidth = r*0.09; g.lineCap='round';
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(x+s*r*0.46, y-r*(0.36+0.06*k));
      g.lineTo(x+s*r*0.16, y-r*(0.34-0.05*k));
      g.stroke();
    }
  }
  g.fillStyle = '#4a3348';
  for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.3, y-r*0.08, r*0.11, 0, GTAU); g.fill(); }
  g.fillStyle = '#fff';
  for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.3-r*0.04, y-r*0.12, r*0.045, 0, GTAU); g.fill(); }
  g.strokeStyle = '#4a3348'; g.lineWidth = r*0.075; g.lineCap='round';
  g.beginPath();
  if (mood === 'angry') { g.moveTo(x-r*0.14,y+r*0.28); g.lineTo(x+r*0.14,y+r*0.28); }
  else g.arc(x, y+r*0.14, r*0.16, 0.25, Math.PI-0.25);
  g.stroke();
}

/* 4方向にとがった キラキラ */
function gspark(g,x,y,r,rot,col){
  g.save(); g.translate(x,y); g.rotate(rot||0); g.fillStyle = col||'#fff';
  g.beginPath();
  for (let i=0;i<4;i++){
    const a=i*Math.PI/2;
    g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    g.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
  }
  g.closePath(); g.fill(); g.restore();
}

/* ---------- ① 立体感をつける前に えがく（からだと かお） ---------- */
function drawGen(g, S, rc){
  const M = S/2, R = S*0.285, L = LV[rc.lv];   // からだで見わけるので 大きめに
  // 色は その子じたいの色（シャチなら 黒と白）。レベルでは 変えない。
  // 生きものが ほんとうの色をしていないと、ただの色ちがいに 見えてしまうから
  const pal = rc.pal || L.c;
  const c0 = pal[0], c1 = pal[1] || pal[0], c2 = pal[2] || c1;
  const yy = M + S*0.02;
  // 首の長い鳥は からだごと 下がるので、かおと かざりも 同じだけ 下げる
  const nk = (rc.opt && rc.opt.neck) || 0;
  const nkq = rc.body === 'quad' ? nk : 0;   // けものは 下げ幅が ちがう
  // たてに長い子・よこに長い子は わくから はみ出す。
  // からだの形を いじると 別の子まで くずれるので、1体ごとに ずらして 入れる
  const dx = (rc.opt && rc.opt.dx) || 0, dy = (rc.opt && rc.opt.dy) || 0;
  const sc = (rc.opt && rc.opt.sc) || 1;   // 小さすぎる子・大きすぎる子を わくに あわせる
  g.save(); g.translate(S*dx, S*dy);
  if (sc !== 1){ g.translate(M, M); g.scale(sc, sc); g.translate(-M, -M); }
  (GBACK[rc.back] || GBACK.none)(g, S, M, yy, R, c1, L.metal, c2, rc);
  (GBODY[rc.body] || GBODY.ball)(g, S, M, yy, R, c0, L.metal, c2, rc);
  (GHEAD[rc.head] || GHEAD.none)(g, S,
     M + R*(GHX[rc.body] || 0), yy + R*((GHY[rc.body] || 0) - nk*(nkq?0.5:0.38)),
     R*(GFR[rc.body] ? GFR[rc.body]*1.25 : 1), c1, L.metal, c2);
  // あたまの形を かえた子は、かおも その大きさに 合わせる。
  // でないと 小さい頭から かおが はみ出す
  const HF = { small:0.74, flat:0.94, wide:1.14, big:1.26, boxy:1.06, long:1.0, round:1 };
  const hk = HF[(rc.opt && rc.opt.head) || 'round'] || 1;
  const fx = M + R*(GFX[rc.body] || 0), fy = yy + R*((GFY[rc.body] || 0) - nk*(nkq?0.5:0.38));
  const fr = R*(GFR[rc.body] || 0.74) * hk;
  // からだが こい子は、かおまわりを 明るくしてから えがく。
  // でないと こい目が こい体に しずんで、顔が 見えなくなる
  if (rc.fbg){
    // かおの まわりだけ 明るくする。ひろげすぎると 体の色まで 白くとんで、
    // チョコが 灰色の板に 見えてしまう
    const fg = g.createRadialGradient(fx, fy, 0, fx, fy, fr*1.05);
    fg.addColorStop(0,   'rgba(255,255,255,.8)');
    fg.addColorStop(0.5, 'rgba(255,255,255,.55)');
    fg.addColorStop(1,   'rgba(255,255,255,0)');
    g.fillStyle = fg;
    g.beginPath(); g.ellipse(fx, fy, fr*1.05, fr*0.95, 0, 0, GTAU); g.fill();
  }
  gface(g, S, fx, fy, fr, rc.mood);
  (GHOLD[rc.hold] || GHOLD.none)(g, S, M, yy, R, c1, L.metal, c2);
  g.restore();
}

/* ---------- ② 立体感をつけた あとに かさねる（レベルの見せかた） ----------
   かけ算のかげは 色もキラキラも 暗くしてしまうので、
   レベルらしさは 立体感のあとに のせる。
   これをしないと レベル7のにじいろが いちばん くすんで見える */
function drawGenFx(g, S, rc){
  const M = S/2, L = LV[rc.lv], RB = rc.rainbow || L.rainbow;

  // レベル7：にじいろ。「色相だけ」をかえる合成をつかう。
  // ふつうに色をかぶせると 明るさまで変わって、かおも つやも 消えてしまう。
  // ただし この合成は すきとおった外がわまで ぬってしまうので、
  // かける前の形を とっておいて あとで 切りぬく
  if (RB){
    const cv2 = g.canvas;
    const mask = document.createElement('canvas');
    mask.width = cv2.width; mask.height = cv2.height;
    mask.getContext('2d').drawImage(cv2, 0, 0);

    g.save();
    g.globalCompositeOperation = 'color';
    // にじが 1体のなかに ぜんぶ おさまるように、
    // キャンバス全体ではなく キャラのいる範囲に かける。
    // ひろげすぎると 1体につき 1〜2色しか通らず、ただの色ちがいに見える
    const r = g.createLinearGradient(S*0.22, S*0.76, S*0.78, S*0.24);
    // やわらかい にじにするのは 色の「まざりかた」で。
    // ここで うすい色をつかうと 彩度まで うつってしまい、灰色に にごる
    // （この合成は 色あいと 彩度を そのまま もっていくため）。
    // シリーズのパステルを そのままつかうのが ちょうどよい
    const st = ['#ff9ec9','#ffbe8f','#ffd76e','#8fe3c4','#9ed8ff','#c9a7ff','#ff9ec9'];
    const off = (rc.c0 || 0) % st.length;
    for (let k=0;k<st.length;k++) r.addColorStop(k/(st.length-1), st[(k+off)%st.length]);
    g.globalAlpha = 1;
    g.fillStyle = r; g.fillRect(0,0,S,S);
    // ななめの帯だけだと しまに見えるので、まるい色も かさねて にじませる
    const r2 = g.createRadialGradient(S*0.36, S*0.32, 0, S*0.5, S*0.5, S*0.46);
    r2.addColorStop(0, st[(off+3)%st.length]);
    r2.addColorStop(0.6, 'rgba(255,255,255,0)');
    g.globalAlpha = 0.7;
    g.fillStyle = r2; g.fillRect(0,0,S,S);
    g.restore();

    g.save();                                  // もとの形で 切りぬく
    g.globalCompositeOperation = 'destination-in';
    g.setTransform(1,0,0,1,0,0);
    g.drawImage(mask, 0, 0);
    g.restore();

    g.save();                                  // にじの上に 白い照りを もどす
    g.globalCompositeOperation = 'source-atop';
    const w = g.createRadialGradient(M-S*0.19, M-S*0.23, 0, M-S*0.05, M-S*0.05, S*0.4);
    w.addColorStop(0,'rgba(255,255,255,.5)'); w.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = w; g.fillRect(0,0,S,S);
    g.restore();
  }

  // レベル5から：下から金の照りかえしを かるく のせて とくべつ感を出す
  if (L.metal){
    g.save();
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = 0.2;
    const m = g.createLinearGradient(0, S*0.86, 0, S*0.42);
    m.addColorStop(0, L.metal); m.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = m; g.fillRect(0,0,S,S);
    g.restore();
  }

  // キラキラ。レベルが上がるほど 数も大きさも ふえる
  const n = L.sp;
  for (let i=0;i<n;i++){
    const a = i*2.399 + (rc.c0||0)*0.7;
    const rr = S*(0.33 + 0.09*Math.sin(i*1.7 + (rc.c1||0)));
    const big = i % 3 === 0;
    gspark(g, M + Math.cos(a)*rr, M + Math.sin(a)*rr*0.9,
           S*(big ? 0.062 : 0.034), a*2,
           RB ? (i%2 ? '#ffffff' : '#fff0a0') : (big && L.metal ? L.metal : '#ffffff'));
  }
}

function buildRoster(){
  const out = [];
  for (const [body, name, pal, lv, side, opt] of CREATURES){
    const fopt = FIT[name] ? Object.assign({}, opt, FIT[name]) : opt;
    out.push({ id:'c_'+(opt && opt.key ? opt.key : body), name, body, pal, lv, side, opt:fopt,
               head:'none', back:'none', hold:'none',
               // からだが こい子は かおまわりを 明るくする
               // からだが こい子は かおまわりを 明るくする（でないと 目が しずむ）
               fbg: ['orca','dragon','butterfly','penguin','manta','clownfish',
                     'ohagi','kintsuba','youkan','ghost','golem'].includes(body)
                    || (opt && ['ladybug','beetle','swallow','peacock','tiger','panda','wolf',
                                'raccoon','bear','tanuki','owl','eagle','chicken',
                                'crow','zebra','ostrich','woodpecker','weasel',
                                'ninja','devil','wizard','griffin'].includes(opt.key))
                    || ['golem','robot'].includes(body),
               mood: side === 'en' ? 'naughty' : 'smile',
               cells: lv >= 7 ? 4 : lv >= 5 ? 2 : 1 });
  }
  for (const key of RAINBOW_OF){
    const b = out.find(o => (o.opt && o.opt.key ? o.opt.key : o.body) === key);
    if (!b) continue;
    out.push({ ...b, id:'c_'+key+'_rb', name:'にじいろ'+b.name,
               rainbow:true, lv:7, cells:4 });
  }
  return out;
}


/* ==========================================================
   アバター（じぶん・ともだち）
   ------------------------------------------------------------
   かお・かみがた・ふく・なまえ を えらんで つくる。
   えらんだものは 1もじずつの キーで もつ。
   あいことばに して LINEで おくるので、みじかいほど よい。
   ========================================================== */
const AV_SKIN  = ['#fff0e4','#ffe0cc','#ffd2b0','#f0bd92','#d99b6e','#a9714b','#7d5236'];
const AV_HAIRC = ['#4a3a3a','#2f2f3a','#7a5230','#c98a44','#f0d090','#fff0c0',
                  '#ff8fc4','#e8506f','#c9a7ff','#8fd8ff','#8fe3c4','#fdfaff'];
const AV_WEARC = ['#ff8fc4','#e8506f','#c9a7ff','#8f6fd8','#8fe3c4','#9ed8ff',
                  '#ffd76e','#fff6e9','#ffa8c8','#b0e0d0','#5f7ab0','#4a4450'];
const AV_HAIR  = ['ショート','ロング','ツインテール','おだんご','ポニーテール','くるくる','みつあみ','うしろがみ',
                  'ぱっつん','ボブ','サイドテール','ドリル','はねっけ','アップ'];
const AV_EYE   = ['まる','にこ','きらきら','おすまし','うるうる','ウインク','ハート','ねむい'];
const AV_MOUTH = ['にこ','ちいさい','わらい','おすまし','べー','にっこり','ハート'];
const AV_WEAR  = ['ワンピース','パーカー','セーラー','ドレス','まほうのローブ','パジャマ',
                  'きもの','Tシャツ','コート','チュチュ','スポーツ','エプロン'];
const AV_ACC   = ['なし','リボン','ぼうし','めがね','かんむり','ねこみみ','ヘッドホン',
                  'ヘアピン','おはな','てんしのわ','うさみみ','マフラー'];

const avDefault = () => ({ n:'', s:0, h:0, hc:0, e:0, m:0, w:0, wc:0, a:0 });

/* かみの けを ふさっと えがく。まるを かさねると 手がきの やわらかさが 出る */
function avHairBlob(g, x, y, rx, ry, rot){
  g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, GTAU); g.fill();
}

function drawAvatar(g, S, av){
  const M = S/2;
  const R = S*0.2;                        // あたまの 半けい（2頭身の かわいい ばらんす）
  const hy = M - S*0.17;                  // あたまの まん中
  const by = M + S*0.193;                 // からだの まん中（くつが 下で 切れない ぎりぎり）
  const skin = AV_SKIN[av.s % AV_SKIN.length];
  const hair = AV_HAIRC[av.hc % AV_HAIRC.length];
  const wear = AV_WEARC[av.wc % AV_WEARC.length];
  const H = av.h % AV_HAIR.length, W = av.w % AV_WEAR.length, A = av.a % AV_ACC.length;

  /* ---- うしろがみ（からだより おく）---- */
  g.fillStyle = hair;
  if (H === 1 || H === 7){                // ロング・うしろがみ
    g.beginPath();
    // ぜんぶ おおうと マトリョーシカに 見えるので、はばを つめて こしで とめる
    g.moveTo(M - R*1.0, hy);
    g.bezierCurveTo(M - R*1.18, hy + R*1.1, M - R*1.02, hy + R*1.7, M - R*0.8, hy + R*1.88);
    g.quadraticCurveTo(M, hy + R*2.12, M + R*0.8, hy + R*1.88);
    g.bezierCurveTo(M + R*1.02, hy + R*1.7, M + R*1.18, hy + R*1.1, M + R*1.0, hy);
    g.closePath(); g.fill();
  } else if (H === 2){                    // ツインテール
    for (const s of [-1,1]){
      avHairBlob(g, M + s*R*1.24, hy + R*0.44, R*0.4, R*0.82, s*0.3);
      avHairBlob(g, M + s*R*1.38, hy + R*1.34, R*0.32, R*0.62, s*0.2);
    }
  } else if (H === 4){                    // ポニーテール
    g.beginPath();
    g.moveTo(M + R*0.8, hy - R*0.3);
    g.bezierCurveTo(M + R*1.76, hy - R*0.2, M + R*1.66, hy + R*1.5, M + R*1.02, hy + R*1.82);
    g.bezierCurveTo(M + R*1.3, hy + R*0.96, M + R*1.14, hy + R*0.3, M + R*0.7, hy + R*0.2);
    g.closePath(); g.fill();
  } else if (H === 6){                    // みつあみ
    for (const s of [-1,1]) for (let i=0;i<3;i++)
      avHairBlob(g, M + s*R*1.1, hy + R*(0.46 + i*0.56), R*0.27, R*0.32, 0);
  } else if (H === 8){                    // ぱっつん：かたに つく まっすぐな かみ
    g.beginPath();
    g.moveTo(M - R*1.02, hy);
    g.lineTo(M - R*1.02, hy + R*1.34);
    g.quadraticCurveTo(M, hy + R*1.56, M + R*1.02, hy + R*1.34);
    g.lineTo(M + R*1.02, hy);
    g.closePath(); g.fill();
  } else if (H === 9){                    // ボブ：あごの あたりで まるく
    g.beginPath();
    g.moveTo(M - R*1.04, hy);
    g.bezierCurveTo(M - R*1.14, hy + R*0.8, M - R*0.8, hy + R*1.12, M, hy + R*1.14);
    g.bezierCurveTo(M + R*0.8, hy + R*1.12, M + R*1.14, hy + R*0.8, M + R*1.04, hy);
    g.closePath(); g.fill();
  } else if (H === 10){                   // サイドテール：かた がわだけ
    avHairBlob(g, M + R*1.22, hy + R*0.3, R*0.42, R*0.66, 0.34);
    avHairBlob(g, M + R*1.42, hy + R*1.1, R*0.34, R*0.56, 0.2);
    avHairBlob(g, M + R*1.5,  hy + R*1.78, R*0.26, R*0.4, 0.1);
  } else if (H === 11){                   // ドリル：まきげ（まるを らせんに）
    for (const s of [-1,1]) for (let i=0;i<4;i++){
      const t = i/3;
      avHairBlob(g, M + s*R*(1.1 + Math.sin(i*1.9)*0.16), hy + R*(0.4 + i*0.5),
                 R*(0.4 - t*0.13), R*(0.4 - t*0.13), 0);
    }
  } else if (H === 12){                   // はねっけ：えりあしが そとへ はねる
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.7, hy + R*0.2);
      g.quadraticCurveTo(M + s*R*1.5, hy + R*0.66, M + s*R*1.44, hy + R*1.02);
      g.quadraticCurveTo(M + s*R*1.06, hy + R*0.7, M + s*R*0.6, hy + R*0.7);
      g.closePath(); g.fill();
    }
  } else if (H === 13){                   // アップ：まとめた かみが 上に
    avHairBlob(g, M, hy - R*1.12, R*0.58, R*0.5, 0);
    for (const s of [-1,1])               // おくれ毛
      avHairBlob(g, M + s*R*1.0, hy + R*0.44, R*0.2, R*0.5, s*0.16);
  }

  /* ---- あしと くつ ----
     ふくより 先に えがいて、ももを すその 下に もぐりこませる。
     あとから えがくと、すその 下はしと あしの 上はしの あいだが
     すき間に なって「ふくと あしが はなれている」ように 見える */
  g.fillStyle = skin;
  for (const s of [-1,1]){
    g.beginPath();
    g.ellipse(M + s*R*0.3, by + R*0.95, R*0.17, R*0.42, 0, 0, GTAU); g.fill();
  }
  g.fillStyle = '#8a6d8d';                // くつ
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(M + s*R*0.3, by + R*1.32, R*0.22, R*0.14, 0, 0, GTAU); g.fill();
  }

  /* ---- からだ（ふく）---- */
  g.fillStyle = wear;
  if (W === 3 || W === 4 || W === 6 || W === 9){   // ドレス・ローブ・きもの・チュチュ：すそが ひろがる
    g.beginPath();
    g.moveTo(M - R*0.52, by - R*0.8);
    g.bezierCurveTo(M - R*0.68, by + R*0.1, M - R*1.0, by + R*0.5, M - R*1.1, by + R*0.82);
    g.quadraticCurveTo(M, by + R*1.06, M + R*1.1, by + R*0.82);
    g.bezierCurveTo(M + R*1.0, by + R*0.5, M + R*0.68, by + R*0.1, M + R*0.52, by - R*0.8);
    g.closePath(); g.fill();
  } else {
    gRR(g, M - R*0.7, by - R*0.84, R*1.4, R*1.5, R*0.4); g.fill();
    g.fillStyle = wear;                   // スカート／ズボンの すそ
    gRR(g, M - R*0.84, by + R*0.16, R*1.68, R*0.5, R*0.2); g.fill();
  }
  /* ふくの もよう */
  if (W === 1){                           // パーカー：フードと ひも
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.beginPath(); g.ellipse(M, by - R*0.6, R*0.6, R*0.3, 0, 0, Math.PI); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = R*0.07; g.lineCap='round';
    for (const s of [-1,1]){
      g.beginPath(); g.moveTo(M + s*R*0.14, by - R*0.42); g.lineTo(M + s*R*0.18, by + R*0.06); g.stroke();
    }
  } else if (W === 2){                    // セーラー：えりと スカーフ
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.beginPath();
    g.moveTo(M - R*0.6, by - R*0.62); g.lineTo(M + R*0.6, by - R*0.62);
    g.lineTo(M + R*0.4, by - R*0.14); g.lineTo(M, by + R*0.04); g.lineTo(M - R*0.4, by - R*0.14);
    g.closePath(); g.fill();
    g.fillStyle = '#ff5f8a';
    g.beginPath();
    g.moveTo(M, by - R*0.34); g.lineTo(M + R*0.15, by - R*0.14);
    g.lineTo(M, by + R*0.24); g.lineTo(M - R*0.15, by - R*0.14);
    g.closePath(); g.fill();
  } else if (W === 4){                    // ローブ：ほしの もよう
    g.fillStyle = 'rgba(255,255,255,.7)';
    for (const [dx,dy] of [[-0.46,0.34],[0.42,0.5],[0.0,0.66],[-0.2,-0.16]])
      gspark(g, M + R*dx, by + R*dy, R*0.13, 0.4, 'rgba(255,255,255,.85)');
  } else if (W === 5){                    // パジャマ：しましま
    g.fillStyle = 'rgba(255,255,255,.45)';
    g.save(); gRR(g, M - R*0.7, by - R*0.84, R*1.4, R*1.5, R*0.4); g.clip();
    for (let i=-1;i<=4;i++){ gRR(g, M - R*0.7, by - R*0.6 + i*R*0.3, R*1.4, R*0.13, R*0.065); g.fill(); }
    g.restore();
  } else if (W === 6){                    // きもの：あわせと おび
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.beginPath();                        // えりの あわせ
    g.moveTo(M - R*0.44, by - R*0.72); g.lineTo(M, by - R*0.1);
    g.lineTo(M + R*0.44, by - R*0.72); g.lineTo(M + R*0.2, by - R*0.8);
    g.lineTo(M, by - R*0.36); g.lineTo(M - R*0.2, by - R*0.8);
    g.closePath(); g.fill();
    g.fillStyle = '#e8506f';              // おび
    gRR(g, M - R*0.62, by - R*0.06, R*1.24, R*0.3, R*0.08); g.fill();
    g.fillStyle = '#ffd76e';              // おびじめ
    gRR(g, M - R*0.62, by + R*0.06, R*1.24, R*0.08, R*0.04); g.fill();
    g.fillStyle = 'rgba(255,255,255,.4)';  // すそもよう
    for (const [dx,dy] of [[-0.5,0.6],[0.1,0.76],[0.56,0.58]]){
      g.beginPath(); g.arc(M + R*dx, by + R*dy, R*0.11, 0, GTAU); g.fill();
    }
  } else if (W === 7){                    // Tシャツ：むねに ほし
    g.fillStyle = 'rgba(255,255,255,.9)';
    gspark(g, M, by - R*0.2, R*0.3, 0.5, 'rgba(255,255,255,.95)');
    g.fillStyle = 'rgba(120,90,120,.16)';  // そでの きれめ
    for (const s2 of [-1,1]){
      gRR(g, M + s2*R*0.58 - R*0.05, by - R*0.7, R*0.1, R*0.44, R*0.05); g.fill();
    }
  } else if (W === 8){                    // コート：まえあきと ボタン
    g.strokeStyle = 'rgba(120,90,120,.3)'; g.lineWidth = R*0.05;
    g.beginPath(); g.moveTo(M, by - R*0.8); g.lineTo(M, by + R*0.62); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.85)';
    for (let i=0;i<3;i++){
      g.beginPath(); g.arc(M + R*0.14, by - R*0.5 + i*R*0.38, R*0.08, 0, GTAU); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,.55)';  // おおきな えり
    g.beginPath();
    g.moveTo(M - R*0.6, by - R*0.84); g.lineTo(M, by - R*0.3); g.lineTo(M + R*0.6, by - R*0.84);
    g.closePath(); g.fill();
  } else if (W === 9){                    // チュチュ：ふわふわの すそ
    g.fillStyle = 'rgba(255,255,255,.55)';
    for (let i=-3;i<=3;i++){
      g.beginPath();
      g.ellipse(M + R*i*0.3, by + R*0.72, R*0.28, R*0.2, 0, 0, GTAU); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,.9)';   // むねの リボン
    g.beginPath(); g.arc(M, by - R*0.34, R*0.11, 0, GTAU); g.fill();
  } else if (W === 10){                   // スポーツ：そでの ライン
    g.fillStyle = 'rgba(255,255,255,.85)';
    for (const s2 of [-1,1]){
      gRR(g, M + s2*R*0.56 - R*0.04, by - R*0.72, R*0.08, R*0.9, R*0.04); g.fill();
    }
    gRR(g, M - R*0.7, by + R*0.14, R*1.4, R*0.1, R*0.05); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.beginPath(); g.arc(M, by - R*0.42, R*0.14, 0, GTAU); g.fill();
  } else if (W === 11){                   // エプロン
    g.fillStyle = 'rgba(255,255,255,.9)';
    g.beginPath();
    g.moveTo(M - R*0.3, by - R*0.74); g.lineTo(M + R*0.3, by - R*0.74);
    g.lineTo(M + R*0.36, by - R*0.1); g.lineTo(M + R*0.5, by + R*0.62);
    g.lineTo(M - R*0.5, by + R*0.62); g.lineTo(M - R*0.36, by - R*0.1);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(120,90,120,.22)'; g.lineWidth = R*0.05;
    g.beginPath(); g.moveTo(M - R*0.5, by - R*0.08); g.lineTo(M + R*0.5, by - R*0.08); g.stroke();
    g.fillStyle = '#ff8fa8';               // こしの リボン
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(M + s2*R*0.16, by - R*0.08, R*0.12, R*0.08, s2*0.4, 0, GTAU); g.fill();
    }
  }
  /* うで */
  g.fillStyle = wear;
  g.strokeStyle = 'rgba(120,90,120,.22)'; g.lineWidth = R*0.05;   // おなじ色だと 胴に とけるので ふちを引く
  for (const s of [-1,1]){
    g.beginPath();
    g.ellipse(M + s*R*0.84, by - R*0.28, R*0.18, R*0.46, s*0.3, 0, GTAU);
    g.fill(); g.stroke();
  }
  g.fillStyle = skin;                     // て
  for (const s of [-1,1]){
    g.beginPath(); g.arc(M + s*R*1.0, by + R*0.16, R*0.17, 0, GTAU); g.fill();
  }
  /* ---- くび と あたま ---- */
  g.fillStyle = skin;
  gRR(g, M - R*0.2, hy + R*0.68, R*0.4, R*0.44, R*0.12); g.fill();
  g.beginPath(); g.ellipse(M, hy, R*1.02, R*0.98, 0, 0, GTAU); g.fill();
  /* みみ */
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(M + s*R*1.0, hy + R*0.12, R*0.16, R*0.22, 0, 0, GTAU); g.fill();
  }

  /* ---- まえがみ ----
     かみを かおの上に かぶせると 目が かくれてしまう。
     「かみで あたまを おおう → かおを 出す → ひたいに まえがみを かける」の順にする */
  g.fillStyle = hair;
  if (H === 5){                           // くるくる：大きめの まるを ふんわり
    for (const s2 of [[-0.92,-0.3,0.46],[-0.58,-0.72,0.42],[0,-0.86,0.44],
                      [0.58,-0.72,0.42],[0.92,-0.3,0.46]])
      avHairBlob(g, M + R*s2[0], hy + R*s2[1], R*s2[2], R*s2[2]*0.92, 0);
    avHairBlob(g, M, hy - R*0.24, R*1.06, R*0.86, 0);
  } else if (H === 3){                    // おだんご
    avHairBlob(g, M, hy - R*0.16, R*1.06, R*0.88, 0);
    avHairBlob(g, M, hy - R*1.16, R*0.44, R*0.42, 0);
  } else if (H === 11){                   // ドリル：てっぺんも ふんわり
    avHairBlob(g, M, hy - R*0.2, R*1.08, R*0.94, 0);
  } else {
    avHairBlob(g, M, hy - R*0.14, R*1.06, R*0.9, 0);
  }
  /* かおを 出す（かみは まわりの ふちとして のこる）*/
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(M, hy + R*0.22, R*0.84, R*0.78, 0, 0, GTAU); g.fill();
  /* ひたいの まえがみ。かおの 上がわに ゆるく かける */
  g.fillStyle = hair;
  g.beginPath();
  if (H === 8 || H === 9){                // ぱっつん・ボブ：まっすぐ そろえた まえがみ
    g.moveTo(M - R*0.88, hy - R*0.06);
    g.quadraticCurveTo(M, hy + R*0.06, M + R*0.88, hy - R*0.06);
    g.lineTo(M + R*0.88, hy - R*0.7); g.lineTo(M - R*0.88, hy - R*0.7);
  } else if (H === 13){                   // アップ：ひたいを ひろく 見せる
    g.moveTo(M - R*0.86, hy - R*0.3);
    g.quadraticCurveTo(M - R*0.2, hy + R*0.06, M + R*0.5, hy - R*0.34);
    g.quadraticCurveTo(M + R*0.76, hy - R*0.2, M + R*0.86, hy - R*0.4);
    g.lineTo(M + R*0.86, hy - R*0.7); g.lineTo(M - R*0.86, hy - R*0.7);
  } else {
    g.moveTo(M - R*0.86, hy - R*0.2);
    g.quadraticCurveTo(M - R*0.5, hy + R*0.24, M - R*0.16, hy - R*0.06);
    g.quadraticCurveTo(M + R*0.2, hy + R*0.3, M + R*0.56, hy - R*0.1);
    g.quadraticCurveTo(M + R*0.78, hy + R*0.1, M + R*0.86, hy - R*0.2);
    g.lineTo(M + R*0.86, hy - R*0.7); g.lineTo(M - R*0.86, hy - R*0.7);
  }
  g.closePath(); g.fill();
  /* かみの つや（左上からの ひかり）*/
  g.fillStyle = 'rgba(255,255,255,.28)';
  g.beginPath(); g.ellipse(M - R*0.4, hy - R*0.6, R*0.34, R*0.13, -0.3, 0, GTAU); g.fill();

  /* ---- かお ---- */
  const fy = hy + R*0.16, ex = R*0.38, er = R*0.19;
  g.fillStyle = '#4a3a4a';
  const E = av.e % AV_EYE.length;
  const shut = (x) => {                    // とじた目（にこ・ウインクで つかう）
    g.strokeStyle = '#4a3a4a'; g.lineWidth = R*0.09; g.lineCap='round';
    g.beginPath(); g.arc(x, fy + er*0.4, er*0.9, Math.PI*1.15, Math.PI*1.85); g.stroke();
  };
  for (const s of [-1,1]){
    const x = M + s*ex;
    if (E === 1 || (E === 5 && s > 0)){    // にこ／ウインク（右だけ とじる）
      shut(x); continue;
    }
    if (E === 3){                          // おすまし（ほそめ）
      g.fillStyle = '#4a3a4a';
      gRR(g, x - er*0.9, fy - er*0.22, er*1.8, er*0.44, er*0.22); g.fill();
      continue;
    }
    if (E === 6){                          // ハートの ひとみ
      g.fillStyle = '#ff5f8a';
      g.beginPath();
      g.moveTo(x, fy + er*1.0);
      g.bezierCurveTo(x - er*1.3, fy + er*0.1, x - er*0.7, fy - er*1.0, x, fy - er*0.3);
      g.bezierCurveTo(x + er*0.7, fy - er*1.0, x + er*1.3, fy + er*0.1, x, fy + er*1.0);
      g.closePath(); g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x - er*0.34, fy - er*0.24, er*0.26, 0, GTAU); g.fill();
      continue;
    }
    g.fillStyle = '#4a3a4a';
    g.beginPath(); g.ellipse(x, fy, er*(E===4?1.0:0.86), er*(E===4?1.2:1.05), 0, 0, GTAU); g.fill();
    if (E === 7){                          // ねむい：上まぶたを かぶせる
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(x, fy - er*0.9, er*1.3, er*0.9, 0, 0, GTAU); g.fill();
      g.strokeStyle = '#4a3a4a'; g.lineWidth = R*0.06; g.lineCap='round';
      g.beginPath(); g.moveTo(x - er*0.9, fy - er*0.2); g.lineTo(x + er*0.9, fy - er*0.28); g.stroke();
      continue;
    }
    g.fillStyle = '#ffffff';               // ハイライト（かならず 入れる）
    g.beginPath(); g.arc(x - er*0.3, fy - er*0.36, er*0.34, 0, GTAU); g.fill();
    if (E === 2 || E === 4){
      g.beginPath(); g.arc(x + er*0.3, fy + er*0.3, er*0.2, 0, GTAU); g.fill();
    }
    if (E === 2) gspark(g, x + er*1.1, fy - er*1.1, er*0.5, 0.5, '#fff0a0');
  }
  /* ほっぺ（ピンクの はんとうめい）*/
  g.fillStyle = 'rgba(255,143,196,.42)';
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(M + s*R*0.66, fy + R*0.26, R*0.2, R*0.14, 0, 0, GTAU); g.fill();
  }
  /* くち */
  const MO = av.m % AV_MOUTH.length, my = fy + R*0.44;
  g.strokeStyle = '#c05f7a'; g.lineWidth = R*0.075; g.lineCap='round';
  if (MO === 0){ g.beginPath(); g.arc(M, my - R*0.06, R*0.16, 0.25, Math.PI-0.25); g.stroke(); }
  else if (MO === 1){ g.beginPath(); g.arc(M, my - R*0.02, R*0.08, 0.2, Math.PI-0.2); g.stroke(); }
  else if (MO === 2){
    g.fillStyle = '#c05f7a';
    g.beginPath(); g.ellipse(M, my, R*0.19, R*0.15, 0, 0, GTAU); g.fill();
    g.fillStyle = '#ffd0dc';
    g.beginPath(); g.ellipse(M, my + R*0.05, R*0.11, R*0.07, 0, 0, GTAU); g.fill();
  } else if (MO === 3){ g.beginPath(); g.moveTo(M - R*0.11, my); g.lineTo(M + R*0.11, my); g.stroke(); }
  else if (MO === 4){                      // べー（したを 出す）
    g.beginPath(); g.arc(M, my - R*0.06, R*0.16, 0.25, Math.PI-0.25); g.stroke();
    g.fillStyle = '#ff8fa8';
    g.beginPath(); g.ellipse(M + R*0.06, my + R*0.12, R*0.1, R*0.09, 0.2, 0, GTAU); g.fill();
  } else if (MO === 5){                    // にっこり（口を あけて わらう）
    g.fillStyle = '#c05f7a';
    g.beginPath(); g.arc(M, my - R*0.06, R*0.2, 0.12, Math.PI-0.12); g.closePath(); g.fill();
    g.fillStyle = '#ffffff';
    gRR(g, M - R*0.16, my - R*0.07, R*0.32, R*0.07, R*0.03); g.fill();
  } else {                                 // ハートの くち
    g.fillStyle = '#ff5f8a';
    g.beginPath();
    g.moveTo(M, my + R*0.14);
    g.bezierCurveTo(M - R*0.2, my - R*0.02, M - R*0.1, my - R*0.14, M, my - R*0.04);
    g.bezierCurveTo(M + R*0.1, my - R*0.14, M + R*0.2, my - R*0.02, M, my + R*0.14);
    g.closePath(); g.fill();
  }

  /* ---- かざり ---- */
  if (A === 1){                            // リボン
    g.fillStyle = '#ff5f8a';
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + R*0.5, hy - R*0.78);
      g.quadraticCurveTo(M + R*0.5 + s*R*0.5, hy - R*1.16, M + R*0.5 + s*R*0.46, hy - R*0.66);
      g.quadraticCurveTo(M + R*0.5 + s*R*0.2, hy - R*0.6, M + R*0.5, hy - R*0.78);
      g.closePath(); g.fill();
    }
    g.beginPath(); g.arc(M + R*0.5, hy - R*0.78, R*0.12, 0, GTAU); g.fill();
  } else if (A === 2){                     // ぼうし
    g.fillStyle = wear;
    g.beginPath(); g.ellipse(M, hy - R*0.62, R*1.34, R*0.24, 0, 0, GTAU); g.fill();
    g.beginPath(); g.ellipse(M, hy - R*0.98, R*0.78, R*0.46, 0, 0, GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)';
    gRR(g, M - R*0.8, hy - R*0.74, R*1.6, R*0.16, R*0.08); g.fill();
  } else if (A === 3){                     // めがね
    g.strokeStyle = 'rgba(90,70,100,.8)'; g.lineWidth = R*0.07;
    for (const s of [-1,1]){
      g.beginPath(); g.arc(M + s*ex, fy, er*1.5, 0, GTAU); g.stroke();
    }
    g.beginPath(); g.moveTo(M - ex + er*1.5, fy); g.lineTo(M + ex - er*1.5, fy); g.stroke();
  } else if (A === 4){                     // かんむり
    g.fillStyle = '#ffd76e';
    g.beginPath();
    g.moveTo(M - R*0.6, hy - R*0.72); g.lineTo(M - R*0.6, hy - R*1.1);
    g.lineTo(M - R*0.3, hy - R*0.88); g.lineTo(M, hy - R*1.26);
    g.lineTo(M + R*0.3, hy - R*0.88); g.lineTo(M + R*0.6, hy - R*1.1);
    g.lineTo(M + R*0.6, hy - R*0.72);
    g.closePath(); g.fill();
    g.fillStyle = '#ff5f8a';
    g.beginPath(); g.arc(M, hy - R*0.86, R*0.1, 0, GTAU); g.fill();
  } else if (A === 5){                     // ねこみみ
    g.fillStyle = hair;
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.3, hy - R*0.72);
      g.lineTo(M + s*R*0.78, hy - R*0.6); g.lineTo(M + s*R*0.52, hy - R*1.2);
      g.closePath(); g.fill();
    }
    g.fillStyle = '#ffc2d4';
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.4, hy - R*0.72);
      g.lineTo(M + s*R*0.68, hy - R*0.66); g.lineTo(M + s*R*0.52, hy - R*1.02);
      g.closePath(); g.fill();
    }
  } else if (A === 6){                     // ヘッドホン
    g.strokeStyle = '#c9a7ff'; g.lineWidth = R*0.13;
    g.beginPath(); g.arc(M, hy - R*0.1, R*1.06, Math.PI*1.1, Math.PI*1.9); g.stroke();
    g.fillStyle = '#c9a7ff';
    for (const s of [-1,1]){
      gRR(g, M + s*R*1.06 - R*0.19, hy - R*0.22, R*0.38, R*0.56, R*0.16); g.fill();
    }
  } else if (A === 7){                     // ヘアピン
    g.fillStyle = '#ffd76e';
    for (let i=0;i<2;i++){
      g.save();
      g.translate(M - R*0.56, hy - R*0.34 + i*R*0.22); g.rotate(-0.5);
      gRR(g, -R*0.22, -R*0.045, R*0.44, R*0.09, R*0.045); g.fill();
      g.restore();
    }
    g.fillStyle = '#ff8fa8';
    g.beginPath(); g.arc(M - R*0.74, hy - R*0.3, R*0.09, 0, GTAU); g.fill();
  } else if (A === 8){                     // おはな
    g.fillStyle = '#ff8fa8';
    for (let i=0;i<5;i++){
      const a2 = i*GTAU/5 - 1.2;
      g.beginPath();
      g.ellipse(M + R*0.66 + Math.cos(a2)*R*0.14, hy - R*0.56 + Math.sin(a2)*R*0.14,
                R*0.12, R*0.09, a2, 0, GTAU); g.fill();
    }
    g.fillStyle = '#ffd76e';
    g.beginPath(); g.arc(M + R*0.66, hy - R*0.56, R*0.07, 0, GTAU); g.fill();
  } else if (A === 9){                     // てんしのわ
    g.strokeStyle = '#ffd76e'; g.lineWidth = R*0.1;
    g.beginPath(); g.ellipse(M, hy - R*1.18, R*0.42, R*0.14, 0, 0, GTAU); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = R*0.04;
    g.beginPath(); g.ellipse(M, hy - R*1.2, R*0.42, R*0.14, 0, Math.PI*1.1, Math.PI*1.7); g.stroke();
  } else if (A === 10){                    // うさみみ
    g.fillStyle = hair;
    for (const s of [-1,1]){
      g.save(); g.translate(M + s*R*0.32, hy - R*0.96); g.rotate(s*0.22);
      g.beginPath(); g.ellipse(0, 0, R*0.19, R*0.5, 0, 0, GTAU); g.fill();
      g.fillStyle = '#ffc2d4';
      g.beginPath(); g.ellipse(0, R*0.04, R*0.09, R*0.36, 0, 0, GTAU); g.fill();
      g.fillStyle = hair; g.restore();
    }
  } else if (A === 11){                    // マフラー
    g.fillStyle = wear;
    gRR(g, M - R*0.42, hy + R*0.7, R*0.84, R*0.3, R*0.14); g.fill();
    g.beginPath();
    g.moveTo(M + R*0.2, hy + R*0.86);
    g.quadraticCurveTo(M + R*0.56, hy + R*1.3, M + R*0.44, hy + R*1.62);
    g.lineTo(M + R*0.16, hy + R*1.5);
    g.quadraticCurveTo(M + R*0.24, hy + R*1.16, M + R*0.06, hy + R*0.9);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)';
    for (let i=0;i<3;i++){ gRR(g, M - R*0.42, hy + R*0.74 + i*R*0.09, R*0.84, R*0.04, R*0.02); g.fill(); }
  }
}

/* ==========================================================
   ずかん（あつめた記録はブラウザに残る）
   dex[id] = { w:入手ウェーブ, d:入手日, lv:とうたつレベル(おかしのみ) }
   ========================================================== */

try{ dex = JSON.parse(localStorage.getItem('sweetTD.dex') || '{}') || {}; }catch(e){}

  if (old.length){ localStorage.removeItem('sweetTD.col'); saveDex(); }
}catch(e){}
function saveDex(){ try{ localStorage.setItem('sweetTD.dex', JSON.stringify(dex)); }catch(e){} }
/* 前の版で 'tw_c_xxx' という ありもしない id を ためてしまっていたので かたづける。
   ほんとうの id（c_xxx）に つけかえて、あつめた ぶんを むだにしない */
(function fixDexIds(){
  let dirty = false;
  for (const k of Object.keys(dex)){
    if (!k.startsWith('tw_c_')) continue;
    const real = k.slice(3);
    if (!dex[real]) dex[real] = dex[k];
    delete dex[k]; dirty = true;
  }
  // でんせつの 出会った ウェーブを 条件の ウェーブに そろえる。
  // 前は やりなおした直後の ウェーブが そのまま 入っていた
  for (const L of LEGENDS){
    const e = dex['lg_' + L.id];
    if (e && e.w !== L.wave){ e.w = L.wave; dirty = true; }
  }
  if (dirty) saveDex();
})();
function dateStr(){
  const d = new Date();
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
/* はじめての登録なら true。いつ手に入れたかも残す */
function unlock(id){
  if (dex[id]) return false;
  dex[id] = { w: wave, d: dateStr() };
  saveDex();
  checkComplete();   // これが最後のひとりだったら、おかしの国がかんせいする
  return true;
}

/* 200体は つくるのに 少し時間がかかるので、1回だけ 作って ためておく */
const GEN_LIST = buildRoster();
const GEN_BY_ID = Object.fromEntries(GEN_LIST.map(o => [o.id, o]));

/* ばんめんに 出す用の 絵。まいフレーム drawGen を よぶと 重いので、
   1回えがいて とっておき、あとは はりつけるだけにする（じめんの 焼きこみと 同じ考え） */
const genSpriteCache = new Map();
function genSprite(o, px){
  px = Math.max(24, Math.round(px / 8) * 8);        // 8ピクセルきざみに まるめて 数をへらす
  const k = o.id + '@' + px;
  const hit = genSpriteCache.get(k);
  if (hit) return hit;
  const c = document.createElement('canvas');
  const d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = px*d; c.height = px*d;
  const g = c.getContext('2d');
  g.setTransform(d,0,0,d,0,0); drawGen(g, px, o);
  g.setTransform(d,0,0,d,0,0); portraitShade(g, px);
  g.setTransform(d,0,0,d,0,0); drawGenFx(g, px, o);
  genSpriteCache.set(k, c);
  return c;
}

/* なかま（コレクションの味方）を おかしと おなじ「タワー」に する。
   152体ぶんの つよさを 手で 書くと 調整できなくなるので、
   ★の高さから 計算し、attack の くせだけ 4つの型から えらぶ。
   こうすると 置く・つよくする・売る・たまを とばす しくみは そのまま つかえる */
const ALLY_ARCH = ['candy','ice','choco','star'];
/* おなじ ねだんでも 型で こうげきの 数字が だいぶ ちがう（アイスは 弱いかわりに おそくする）。
   数字だけ ならべると 損に 見えるので、なにが とくいな子かも 出す */
const ALLY_ROLE = { candy:'はやうち', ice:'おそくする', choco:'まとめて', star:'とおくまで' };
const ALLY_COST = { 1:60, 2:100, 3:150, 4:230, 5:340, 6:500, 7:720 };
function allyArchOf(id){                              // id から いつも おなじ型を えらぶ
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) & 0x7fffffff;
  return ALLY_ARCH[h % ALLY_ARCH.length];
}
for (const o of GEN_LIST){
  if (o.side !== 'ch') continue;
  const A = TOWERS[allyArchOf(o.id)];
  const k = 1 + (o.lv - 1) * 0.62;                    // ★が上がるほど こうげきが つよい
  TOWERS[o.id] = {
    ...A, name:o.name, gen:o, ally:true, cells:o.cells, role:ALLY_ROLE[allyArchOf(o.id)],
    cost: ALLY_COST[o.lv],
    dmg:   Math.round(A.dmg * k * (o.cells >= 4 ? 1.5 : o.cells >= 2 ? 1.2 : 1)),
    rate:  +(A.rate / (1 + (o.lv - 1) * 0.05)).toFixed(3),
    range: +(A.range * (1 + (o.lv - 1) * 0.04)).toFixed(2),
    desc: '★' + o.lv + 'の なかま。' + A.desc + (o.cells >= 4 ? '（4マスつかう）' : ''),
  };
}
/* 4マスの子は 2×2 を つかう。ふさがっている ますを かぞえるのに つかう */
const spanOf = k => (TOWERS[k] && TOWERS[k].cells >= 4) ? 2 : 1;
const tSpan  = t => spanOf(t.k);
/* 2×2 の子の まん中は ますの かど。たまの 出どころも 射程の 中心も ここ */
const tcx = t => cx(t.c) + (tSpan(t) - 1) * CELL / 2;
const tcy = t => cy(t.r) + (tSpan(t) - 1) * CELL / 2;
/* (c,r) を ふさいでいる タワーを さがす（2×2 も 見る） */
function towerAt(c, r){
  return towers.find(t => { const s2 = tSpan(t); return c >= t.c && c < t.c + s2 && r >= t.r && r < t.r + s2; });
}

/* てきの 見た目を コレクションの子から えらぶ。
   つよさ（HP・そくど）は これまでどおり ENEMIES のまま。
   見た目と 名前だけ さしかえるので、ゲームの つりあいは 変わらない */
const EN_BY_LV = {};
for (const o of GEN_LIST) if (o.side === 'en') (EN_BY_LV[o.lv] = EN_BY_LV[o.lv] || []).push(o);
/* かたい子・ボスは 見た目も 強そうに する */
const EN_BUMP = { slime:0, fast:0, tank:1, crystal:1, bat:0, golem:2, boss:2 };
function enemyLook(k, n, i){
  const lv = Math.min(7, Math.max(1, 1 + Math.floor(n / 12) + (EN_BUMP[k] || 0)));
  let pool = null;
  for (let d = 0; d < 7 && !pool; d++)                 // その ★に 子がいなければ 近い★から
    pool = EN_BY_LV[lv - d] || EN_BY_LV[lv + d] || null;
  if (!pool || !pool.length) return null;
  // おなじウェーブなら いつも おなじ顔ぶれに する（あつめる目あてが 立つように）
  return pool[(n * 7 + i * 3) % pool.length];
}
/* 見た目を えがく。えがく じゅんばんは drawGen → かげ → にじいろ の 順 */
function genThumb(o, size){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size + 'px'; c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); drawGen(g, size, o);
  g.setTransform(dpr,0,0,dpr,0,0); portraitShade(g, size);
  g.setTransform(dpr,0,0,dpr,0,0); drawGenFx(g, size, o);
  return c;
}
/* 200体ぶんを いちどに えがくと 開くたびに かたまるので、
   スクロールで 見えたものから えがく */
let colIo = null;
function lazyThumb(o, size){
  const box = document.createElement('div');
  box.style.cssText = 'width:' + size + 'px;height:' + size + 'px;margin:0 auto';
  box.__draw = () => box.replaceWith(o.gen ? genThumb(o.gen, size) : charThumb(o, size));
  colIo.observe(box);
  return box;
}

function buildColGrid(){
  // じぶんの きろくは どの タブでも 出す
  colStats.innerHTML =
    '<div class="cst best"><div class="ck">🏆 じぶんベスト</div><div class="cn">ウェーブ' + rec.bw + '</div></div>' +
    '<div class="cst"><div class="ck">たおしたかず</div><div class="cn">' + rec.kills + '</div></div>' +
    '<div class="cst"><div class="ck">ランキング(めやす)</div><div class="cn">' + (rec.bw > 0 ? 'じょうい' + rankPct() + '%' : '—') + '</div></div>';
  if (colTab === 'fr'){ buildFriendGrid(); return; }
  const all = dexList();
  if (colIo) colIo.disconnect();
  colIo = new IntersectionObserver(es => {
    for (const e of es){
      if (!e.isIntersecting || !e.target.__draw) continue;
      const f = e.target.__draw; e.target.__draw = null;
      colIo.unobserve(e.target); f();
    }
  }, { root: colOv, rootMargin: '240px' });
  const list = colTab === 'all' ? all : all.filter(o => o.cat === colTab);
  colCount.textContent = list.filter(o => dex[o.id]).length + ' / ' + list.length;
  colHint.style.display = (colTab === 'ch') ? '' : 'none';
  colHint.innerHTML = '📌 なかまをタップでバーに はる／はがす（' + pins.length + '/' + PIN_MAX + '）<br>いっぱいのときは いちばん左と こうたい';
  colDone.style.display = CHARS.every(c => dex['ch_'+c.id]) ? '' : 'none';
  colGrid.innerHTML = '';
  for (const o of list){
    const rec = dex[o.id];
    const d = document.createElement('div');
    d.className = 'cCard' + (rec ? '' : ' no');
    if (rec){
      d.append(lazyThumb(o, 64));
      let html = '<div class="cNm">' + o.name + '</div>';
      if (o.cat === 'tw' && rec.lv) html += '<div class="cLv">' + '★'.repeat(rec.lv) + '</div>';
      const isSk = o.cat === 'ch' && SKILLS.some(s => s.ch === o.pid);
      if (isSk) html += '<div class="cLv" style="color:var(--pink-d)">×' + (items[o.pid] || 0) + ' もってる</div>';
      html += '<div class="cTt">' + o.title + '</div>';
      if (o.fx) html += '<div class="cTt" style="color:#b98ae0">✨' + o.fx + '</div>';
      if (rec.d) html += '<div class="cGet">' + (rec.w ? 'ウェーブ' + rec.w + '・' : '') + rec.d + '</div>';
      d.insertAdjacentHTML('beforeend', html);
      // なかまはタップでワザバーに はる／はがす。0こなら おほしさまで買い足せる
      if (isSk){
        if (pins.includes(o.pid)) d.insertAdjacentHTML('beforeend', '<div class="cPin">📌</div>');
        d.style.cursor = 'pointer';
        d.onclick = () => {
          const sDef = SKILLS.find(s => s.ch === o.pid);
          if (!pins.includes(o.pid) && (items[o.pid] || 0) < 1){
            // 2回タップで1こ購入（スターの使い道）
            const cost = skillCost(sDef);
            if (buyWait === o.pid){
              buyWait = null;
              if (stars < cost){
                colHint.textContent = 'おほしさまが たりない…（⭐' + cost + '）';
                beep(160,.09,'square',.03,.7);
              } else {
                stars -= cost;
                items[o.pid] = Math.min(ITEM_MAX, (items[o.pid]||0) + 1); saveItems();
                beep(760,.1,'triangle',.05); syncHUD(); buildColGrid();
                colHint.innerHTML = o.name + 'を 1こ かった！<br>もういちどタップで はろう';
              }
            } else {
              buyWait = o.pid;
              colHint.innerHTML = '⭐' + cost + 'で ' + o.name + 'を 1こかう？<br>（もういちどタップで けってい）';
              beep(600,.06,'triangle',.04);
            }
            return;
          }
          buyWait = null;
          const r2 = togglePin(o.pid);
          beep(r2 === 'off' ? 480 : 760, .08, 'triangle', .04);
          buildColGrid();
          if (r2 === 'off'){
            colHint.textContent = o.name + 'を ずかんに もどしたよ';
          } else if (r2 && r2.swap){
            const sw = r2.swap === 'rpurin' ? 'にじいろプリン' : (CHARS.find(c => c.id === r2.swap) || {}).name;
            colHint.innerHTML = o.name + 'を はった！<br>（' + sw + 'は ずかんにもどったよ）';
          }
        };
      }
    } else if (o.legend){
      // でんせつはシルエットで「なにかがいる」感を出して期待させる
      d.append(silhouetteThumb(o.pid, 64));
      d.insertAdjacentHTML('beforeend',
        '<div class="cNm">？？？</div><div class="cTt" style="color:#b98ae0">✨' + o.hint + '</div>');
    } else {
      // まだ いない子も うすく 見せる。だれが のこっているか わかると、
      // どの たまごを ひらくか・何を すれば いいかが わかる。
      // 「？」だけだと 何が あるのかも わからない
      d.classList.add('yet');
      d.append(lazyThumb(o, 64));
      d.insertAdjacentHTML('beforeend',
        '<div class="cNm">' + o.name + '</div>' +
        '<div class="cTt">' + o.title + '</div>' +
        '<div class="cTt" style="color:#b98ae0">' + o.hint + '</div>');
    }
    colGrid.append(d);
  }
  const gotAll = all.filter(o => dex[o.id]).length;
  colTotal.textContent = 'ぜんぶで ' + gotAll + ' / ' + all.length + ' とうろく';
}

/* ==========================================================
   なかまワザ（あつめたなかまが戦いを手伝ってくれる）
   スターの使い道でもある。ねだんはウェーブとともに上がる
   ========================================================== */
const SKILLS = [
  { ch:'purin',  name:'まもり',     base:70,  cd:12, needEnemy:true,  color:'#ffd98a', desc:'てき全員を3.5びょう足止め。とつげきをしのぐときに' },
  { ch:'choco',  name:'ばくだん',   base:110, cd:15, needEnemy:true,  color:'#a5713f', desc:'てき全体に大ダメージ（HPのわりあい）。ピンチの切りふだ' },
  { ch:'gumgum', name:'スロー',     base:60,  cd:10, needEnemy:true,  color:'#9be89b', desc:'てき全員を6びょうスロー。はやい敵のむれに' },
  { ch:'donut',  name:'かいふく',   base:120, cd:20, needEnemy:false, color:'#ff9ec9', desc:'ハート+4。まもりがくずれたあとに' },
  { ch:'taffy',  name:'マーチ',     base:90,  cd:25, needEnemy:false, color:'#9ed8ff', desc:'8びょう こうげきそくど2ばい。ボスがきたら' },
  { ch:'cake',   name:'おいわい',   base:90,  cd:18, needEnemy:true,  color:'#fff0b8', desc:'てき全体に小ダメージ。ざこそうじに' },
  { ch:'fairy',  name:'こな',       base:80,  cd:25, needEnemy:false, color:'#ffd0df', desc:'8びょう はんい1.4ばい。とどかない敵に' },
  { ch:'prince', name:'はた',       base:90,  cd:30, needEnemy:false, color:'#ff8f8f', desc:'10びょう ⭐2ばい。かせぎどきに' },
  { ch:'apple',  name:'いやし',     base:60,  cd:12, needEnemy:false, color:'#ff5a5a', desc:'ハート+2。かるくて安い回復' },
  { ch:'queen',  name:'いのり',     base:130, cd:45, needEnemy:false, color:'#dcebf8', desc:'ほかのワザのじゅんびを完了させる' },
  { ch:'king',   name:'ごうれい',   base:150, cd:30, needEnemy:false, color:'#ffe27a', desc:'8びょう こうげき2ばい。ボスや どすんケーキに' },
  { ch:'rpurin', name:'おくりもの', base:100, cd:35, needEnemy:false, color:'#c9a7ff', desc:'プレゼントを2こもらう' },
];
let skCd = {}, skTick = -1;
for (const s of SKILLS) skCd[s.ch] = 0;
/* ワザの一時バフ（のこり秒数） */
let buffs = { spd:0, dmg:0, rng:0, gold:0 };
function hasCh(id){ return id === 'rpurin' ? !!dex['sp_rpurin'] : !!dex['ch_' + id]; }
const skillCost = s => Math.round(s.base * (1 + wave*0.03) * (hasCh('queen') ? 0.8 : 1));

/* ---------- なかまの所持数（つかうと1こへる。ドロップでふえて、ブラウザに残る） ---------- */
const ITEM_MAX = 99;
let items = {};
for (const s of SKILLS) items[s.ch] = 0;
try{
  const it = JSON.parse(localStorage.getItem('sweetTD.items') || '{}');
  for (const k in items) if (typeof it[k] === 'number') items[k] = Math.max(0, Math.min(ITEM_MAX, it[k]|0));
}catch(e){}
function saveItems(){ try{ localStorage.setItem('sweetTD.items', JSON.stringify(items)); }catch(e){} }
// 消耗式に変わる前のセーブへの引っこし：もっているなかまに1こずつ保証する（1回だけ）
try{
  if (!localStorage.getItem('sweetTD.itemsV2')){
    for (const s of SKILLS) if (hasCh(s.ch) && items[s.ch] < 1) items[s.ch] = 1;
    localStorage.setItem('sweetTD.itemsV2', '1');
    saveItems();
  }
}catch(e){}

/* ---------- タスクバーのピン（はったなかま。7こまで・ブラウザに残る） ---------- */
const PIN_MAX = 7;
let pins = null;
try{ pins = JSON.parse(localStorage.getItem('sweetTD.pins') || 'null'); }catch(e){}
if (Array.isArray(pins)){
  pins = pins.filter(ch => SKILLS.some(s => s.ch === ch)).slice(0, PIN_MAX);
} else {
  // はじめて（旧バージョンから）のときは、もっているワザもちを自動でならべる
  pins = ['purin','choco','gumgum','donut'].filter(ch => hasCh(ch));
}
function savePins(){ try{ localStorage.setItem('sweetTD.pins', JSON.stringify(pins)); }catch(e){} }
/* はる／はがすの切り替え。'on'／'off'／'none'／{swap:もどったなかま} を返す。
   はがしても数はへらない（ずかんにもどるだけ）。へるのはワザを使ったときだけ。
   バーがいっぱいのときは、いちばん左のなかまが ずかんにもどって こうたい */
function togglePin(ch){
  const i = pins.indexOf(ch);
  if (i >= 0){ pins.splice(i, 1); savePins(); buildSkillBar(); return 'off'; }
  if (items[ch] < 1) return 'none';
  let swapped = null;
  if (pins.length >= PIN_MAX) swapped = pins.shift();
  pins.push(ch); savePins(); buildSkillBar();
  return swapped ? { swap: swapped } : 'on';
}

/* たおした敵がプレゼントを落とす確率。大物ほど落としやすい。
   にじいろプリン（ログインボーナス7日目のなかま）がいると1.5倍 */
const DROP_RATE = { golem:0.35, boss:0.6 };
const dropRate = k => (DROP_RATE[k] || 0.07) * (dex['sp_rpurin'] ? 1.5 : 1);

/* プレゼントキャンディがワザバーへ飛んでいく演出 */
let gifts = [];
function spawnGift(x, y){
  const opts = SKILLS.filter(s => hasCh(s.ch) && items[s.ch] < ITEM_MAX);   // 99こでカンスト
  if (!opts.length) return;
  const s = opts[(Math.random()*opts.length)|0];
  // はってあるスロットの位置へ飛ばす（はっていないワザは中央へ）
  const pi = pins.indexOf(s.ch);
  const frac = pi >= 0 ? (Math.min(pi, PIN_MAX-1) + 0.5) / PIN_MAX : 0.5;
  gifts.push({ sx:x, sy:y, x, y,
               tx: frac * COLS*CELL, ty:ROWS*CELL - CELL*0.15,
               t:0, life:0.8, ch:s.ch, rot:Math.random()*6.3 });
}

function buildSkillBar(){
  // つかいきったなかまはバーからはずれる（この整理では1こへらさない）
  const alive = pins.filter(ch => SKILLS.some(s => s.ch === ch) && hasCh(ch) && items[ch] > 0);
  if (alive.length !== pins.length){ pins = alive; savePins(); }
  skillBar.innerHTML = '';
  // はってあるなかまのワザボタン（さいだい7こ・横スクロール）
  for (const ch of pins){
    const s = SKILLS.find(x => x.ch === ch);
    const b = document.createElement('button');
    b.className = 'sk';
    b.dataset.ch = ch;
    b.append(charThumb({ pid:ch }, 38));
    b.insertAdjacentHTML('beforeend',
      '<div class="skN">' + s.name + '</div><div class="skC"></div>' +
      '<div class="skCd" style="display:none"></div>');
    // タップで発動、ながおし（0.55秒）でずかんにもどす
    let lpTimer = null, lpFired = false;
    const cancelLp = () => { if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; } };
    b.addEventListener('pointerdown', () => {
      lpFired = false;
      lpTimer = setTimeout(() => {
        lpFired = true;
        const nm = ch === 'rpurin' ? 'にじいろプリン' : (CHARS.find(c => c.id === ch) || {}).name;
        togglePin(ch);
        floatTx(COLS*CELL/2, ROWS*CELL - CELL*0.6, nm + 'を ずかんにもどした', '#b98ae0');
        beep(480,.1,'triangle',.04);
      }, 550);
    });
    b.addEventListener('pointerup', cancelLp);
    b.addEventListener('pointerleave', cancelLp);
    b.addEventListener('pointercancel', cancelLp);
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.onclick = () => { if (lpFired){ lpFired = false; return; } useSkill(s); };
    skillBar.append(b);
  }
  // のこりは「はれる」空きスロット
  for (let i = skillBar.children.length; i < PIN_MAX; i++){
    const b = document.createElement('button');
    b.className = 'sk empty';
    b.disabled = true;
    b.innerHTML = '<div style="font-size:21px;line-height:38px">＋</div><div class="skN">ずかんではる</div>';
    skillBar.append(b);
  }
  syncSkills();
}
function syncSkills(){
  for (const b of skillBar.children){
    if (!b.dataset.ch) continue;
    const s = SKILLS.find(x => x.ch === b.dataset.ch);
    if (!hasCh(s.ch)) continue;
    const st = items[s.ch];
    b.querySelector('.skC').textContent = 'のこり ×' + st;
    const cd = skCd[s.ch], cdEl = b.querySelector('.skCd');
    cdEl.style.display = cd > 0 ? '' : 'none';
    if (cd > 0) cdEl.textContent = Math.ceil(cd);
    // disabled属性だと「ながおしではがす」もできなくなるので、見た目だけ無効化
    // （発動条件はuseSkill側でチェックずみ）
    b.classList.toggle('off', over || cd > 0 || st < 1);
  }
}

function saveRun(w){

    localStorage.setItem('sweetTD.run', JSON.stringify({
      w: (w !== undefined ? w : wave), st: stars, hp: hearts,
      cu: continueUsed ? 1 : 0,
      tw: towers.map(t => {
        return { k:t.k, c:t.c, r:t.r, lv:t.lv };
      }),
    }));

function clearRun(){ try{ localStorage.removeItem('sweetTD.run'); }catch(e){} setNextHeartAt(0); }
/* 回復までのカウントダウン。時間がきたらボタンが「つづきから」にかわる */
function armLifeButton(fromBoot){
  if (lifeTimer){ clearInterval(lifeTimer); lifeTimer = null; }
  const tick = () => {
    applyRegen();      // 時間がたっていれば💗をふやす
    syncHUD();         // HUDのハート表示も一緒に更新
    if (hearts >= 1){
      // 1こでもあれば、そのぶんを持って すぐ再開できる
      ovBtn.disabled = false;
      ovBtn.innerHTML = 'つづきから ' + PLAY + '（💗' + hearts + '）';
      ovBtn.onclick = () => continueRun(hearts, fromBoot);
    } else {
      // まだ0こ：つぎの💗までの残り時間をボタンに出す
      ovBtn.disabled = true;
      ovBtn.onclick = null;
      const at = nextHeartAt();
      if (at){
        const sec = Math.max(0, Math.ceil((at - Date.now())/1000));
        ovBtn.textContent = 'つぎの💗まで あと ' + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
      } else {
        ovBtn.textContent = '💗が たまるまで まってね';
      }
    }
  };
  tick();
  lifeTimer = setInterval(tick, 1000);
}
/* 起動時：回復まちの途中なら、そのつづきの画面を出す */
function checkLife(){
  if (!nextHeartAt()) return;
  let rn = null;
  try{ rn = JSON.parse(localStorage.getItem('sweetTD.run') || 'null'); }catch(e){}
  if (!rn){ setNextHeartAt(0); return; }   // 進行セーブがないなら回復まちも意味がない
  over = true; running = false; continueUsed = true;

    '<span style="opacity:.75">' + REGEN_MIN + 'ふんごとに 💗が1こずつ もどるよ（さいだい' + maxHearts() + '）</span>';

/* 起動時：セーブがあれば、そのウェーブから再開する */
function tryResume(){
  let rn = null;
  try{ rn = JSON.parse(localStorage.getItem('sweetTD.run') || 'null'); }catch(e){}
  if (!rn) return;
  wave = Math.max(0, rn.w | 0);
  stars = Math.max(0, rn.st | 0);
  hearts = Math.min(HEART_STOCK_MAX, Math.max(0, rn.hp | 0));   // ためた💗も、やすみ中の💗もそのまま引きつぐ
  towers = (rn.tw || [])
    .filter(t => TOWERS[t.k] && !pathCells.has(key(t.c, t.r)))
    .map(t => ({ k:t.k, c:t.c, r:t.r, lv:Math.min(5, Math.max(1, t.lv|0)),
                 cd:0, ang:-Math.PI/2, pulse:0, ph:Math.random()*6.3 }));
  continueUsed = !!rn.cu;
  floatTx(COLS*CELL/2, ROWS*CELL/2, 'つづきから さいかい！', '#b98ae0');
  syncHUD();
}
/* ゲームオーバーからの「つづきから」：たまっている💗の数だけ持って、そのウェーブから再開
   keepWave は起動時の再開用（保存の時点でウェーブがもどしてあるので、二重にもどさない） */
function continueRun(refill, keepWave){
  over = false; running = false;
  enemies = []; shots = []; spawnQ = []; gifts = [];
  if (!keepWave) wave = Math.max(0, wave - 1);
  hearts = Math.min(HEART_STOCK_MAX, refill || 1);
  continueUsed = true;
  setNextHeartAt(0);   // 再開したら回復タイマーは止める
  ovBtn.disabled = false;
  phoenixUsed = false; nextT = 0;
  for (const k in skCd) skCd[k] = 0;
  for (const k in buffs) buffs[k] = 0;
  ov.classList.remove('on');
  ovAlt.style.display = 'none';
  btnWave.disabled = false;
  btnWave.innerHTML = 'つぎのウェーブ ' + PLAY;
  floatTx(COLS*CELL/2, ROWS*CELL/2, 'つづきから！がんばろう💗', '#ff6f9c');
  beep(660,.15,'triangle',.06);
  saveRun();
  syncHUD();
}
