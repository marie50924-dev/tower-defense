      ctx.fillText('ざんねん〜', 0, 0);
      ctx.restore();
      ctx.font = "700 " + (CELL*0.3) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      ctx.fillStyle = '#b98ae0';
      ctx.fillText('おかしを おとしちゃった…', W2/2, by + bh*0.68);
      ctx.fillText('ゲット ' + bonus.got + 'こ', W2/2, by + bh*0.88);
    } else {
      for (const it of bonus.items){
        ctx.save(); ctx.translate(it.x, it.y);
        ctx.rotate(Math.sin(it.ph)*0.25);
        ctx.font = (CELL*0.72) + 'px sans-serif';
        ctx.fillText(it.em, 0, 0);
        ctx.restore();
        sparkle(it.x + CELL*0.34, it.y - CELL*0.3, CELL*0.07, it.ph*2, '#ffffff');
      }
      const left = bonus.spawnLeft + bonus.items.length;
      const txt = '🎁 のこり ' + left + 'こ';
      ctx.font = "800 " + (CELL*0.4) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      ctx.lineWidth = CELL*0.12; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
      ctx.strokeText(txt, COLS*CELL/2, CELL*1.2);
      ctx.fillStyle = '#e05f9e';
      ctx.fillText(txt, COLS*CELL/2, CELL*1.2);
    }
  }

  // 応援パレード（なかまがふきだしつきで行進）
  for (const p of paraders){
    const bob = Math.abs(Math.sin(p.ph)) * CELL*0.18;
    ctx.drawImage(portraitOf(p.pid), p.x - 22, p.y - 22 - bob, 44, 44);
    if (p.msg){
      ctx.font = '800 ' + (CELL*0.28) + 'px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w2 = ctx.measureText(p.msg).width + CELL*0.4;
      const bx = p.x, by = p.y - CELL*1.05 - bob;
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      roundRect(bx - w2/2, by - CELL*0.26, w2, CELL*0.52, CELL*0.26); ctx.fill();
      ctx.strokeStyle = 'rgba(224,95,158,.4)'; ctx.lineWidth = 1.5;
      roundRect(bx - w2/2, by - CELL*0.26, w2, CELL*0.52, CELL*0.26); ctx.stroke();
      ctx.fillStyle = '#e05f9e';
      ctx.fillText(p.msg, bx, by);
    }
  }

  for (const p of parts){
    const k = 1 - p.age/p.life;
    ctx.globalAlpha = k;
    sparkle(p.x, p.y, p.r*k*1.6, p.rot, p.color);
  }
  ctx.globalAlpha = 1;
  for (const rg of rings){
    const k = rg.age/rg.life;
    ctx.globalAlpha = (1-k)*0.85;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = Math.max(1.5, CELL*0.1*(1-k));
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.3); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of floats){
    const k = f.age/f.life;
    ctx.globalAlpha = 1 - k*k;
    ctx.font = '800 ' + (CELL*0.42) + 'px system-ui,sans-serif';
    ctx.lineWidth = CELL*0.11; ctx.strokeStyle='#fff';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle=f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // お祝いの光芒（金色の光線がくるくる回る）
  if (celebT > 0){
    const a = Math.min(1, celebT) * 0.4;
    ctx.save();
    ctx.translate(W/2, H*0.42);
    ctx.rotate(time*0.6);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9a8';
    for (let i=0;i<12;i++){
      ctx.rotate(Math.PI/6);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0, 0, H*0.75, -0.09, 0.09);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,90,140,' + (flash*0.3) + ')';
    ctx.fillRect(0,0,W,H);
  }
  if (wflash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (wflash*0.7) + ')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

/* ==========================================================
   じめんの焼きこみ

   じめんと道は うごかないので、1枚の絵に 1回だけ描いておいて
   毎フレーム 貼るだけにする。トッピングだけで110個あり、
   毎フレーム 描きなおすのは むだだから。
   ステージ・きせかえ・画面サイズが かわったときだけ 焼きなおす。
   ========================================================== */
let groundCv = null, groundKeyNow = '';

/* 焼くあいだだけ ctx を さしかえる。
   これまでの描画コードを 1行も変えずに 別の絵へ描けるようにするため */
function withCtx(g, fn){ const p = ctx; ctx = g; try{ fn(); } finally { ctx = p; } }

/* じめんの見た目が かわる条件。ここが変わったときだけ 焼きなおす */
const groundKey = () => themeOf(wave).name + '/' + CELL + '/' + DPR;

function bakeGround(){
  const W = COLS*CELL, H = ROWS*CELL;
  if (!groundCv) groundCv = document.createElement('canvas');
  groundCv.width = Math.ceil(W*DPR); groundCv.height = Math.ceil(H*DPR);
  const g = groundCv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  withCtx(g, () => {
    g.save();
    roundRect(0, 0, W, H, 20); g.clip();   // 角まるは 焼くときに入れておく
    drawGround();
    g.restore();
  });
  groundKeyNow = groundKey();
}

/* ==========================================================
   サイズ
   ========================================================== */
function resize(){
  const w = Math.min(document.getElementById('app').clientWidth - 20, 460);
  const h = window.innerHeight - 362;   // なかまワザのバーと🔑ボタンのぶんも確保する
  CELL = Math.max(24, Math.floor(Math.min(w/COLS, h/ROWS)));
  const W = COLS*CELL, H = ROWS*CELL;
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  measurePath();
  for (const s of sparks){ s.x = Math.min(s.x, W); s.y = Math.min(s.y, H); }
  bakeGround();
}
window.addEventListener('resize', resize);

/* 盤面のタップ。タッチもマウスも Pointer Events で 同じようにあつかえる */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const b = cv.getBoundingClientRect();
  boardTap((e.clientX-b.left) * (COLS*CELL/b.width),
           (e.clientY-b.top)  * (ROWS*CELL/b.height));
});

/* ==========================================================
   メインループ
   ========================================================== */
let last = 0;
function loop(ts){
  let dt = Math.min(0.05, (ts-last)/1000 || 0);
  last = ts;
  if (!over) for (let i=0;i<speed;i++) update(dt);
  if (!over) bonusUpdate(dt);   // ボーナスは実時間（速度倍率のえいきょうなし）
  if (groundKey() !== groundKeyNow) bakeGround();   // ステージが かわった
  render();
  requestAnimationFrame(loop);
}

/* ==========================================================
   ゲーム開始
   ========================================================== */
reset();
resize();
giveStarters();   // はじめての人に ★1の なかまを 5人
avFromLink();     // ともだちの リンクで ひらいたなら、その人を むかえる
tryResume();      // とちゅうのセーブがあれば、そのウェーブから再開
checkLogin();     // きょうはじめての起動ならプレゼントを渡す
checkLife();      // 💗の回復まちの途中なら、その画面にもどす
requestAnimationFrame(loop);

/* 検査ツール（tools/check-chars.mjs）から えがく関数を よべるようにする。
   ゲーム本体は 外から さわられたくないので、検査に いる2つだけ 出す */
window.__chk = {
  buildRoster, drawGen,
  // アバターも キャラなので おなじ検査に かける。
  // ぜんぶの くみあわせは 何万とおりも あるので、各こうもくを もれなく 1回は とおす数だけ 作る
  avatarSamples: () => {
    const N = Math.max(AV_SKIN.length, AV_HAIR.length, AV_HAIRC.length, AV_EYE.length,
                       AV_MOUTH.length, AV_WEAR.length, AV_WEARC.length, AV_ACC.length);
    const out = [];
    for (let i = 0; i < N * 3; i++)
      // かけ算で ずらすと 約数の ぶんだけ 出ない番号が できる（3と12なら 4つしか 出ない）。
      // ぜんぶ とおすために、そのまま あまりを つかう
      out.push({ n:'見本' + i, s:i%AV_SKIN.length, h:i%AV_HAIR.length, hc:i%AV_HAIRC.length,
                 e:i%AV_EYE.length, m:i%AV_MOUTH.length, w:i%AV_WEAR.length,
                 wc:(i+3)%AV_WEARC.length, a:i%AV_ACC.length });
    return out;
  },
  drawAvatar, portraitShade,
  AV_HAIR, AV_WEAR, AV_ACC, AV_EYE, AV_MOUTH,
};
/* 見た目の たしかめ用。?dbg=1 のときだけ 出す。
   ふつうに あそぶときに ウェーブを とばせてしまうと じぶんベストの いみが なくなる */
if (location.search.includes('dbg=1')) window.__dbg = {
  setWave: w => { wave = w; syncHUD(); },
  setStars: n => { stars = n; syncHUD(); syncShop(); },
  setTool: k => { selTool = k; },
  towers: () => towers.map(t => ({ k:t.k, c:t.c, r:t.r, sp:tSpan(t), lv:t.lv })),
  friendWave: () => friendWave,
  flyerTest: () => {   // どの でんせつが とぶか（見た目の たしかめ用）
    const owned = LEGENDS.filter(l => dex['lg_' + l.id]);
    const next = LEGENDS.find(l => !dex['lg_' + l.id]);
    const near = next && wave >= next.wave - 15;
    const canOwned = owned.length && wave >= 5;
    if (canOwned) return 'もってる子';
    if (near) return next.name + 'のかげ';
    return 'なし';
  },
  stars: () => stars,
  shards: () => shards,
  bunch: () => {   // ともだちを ぎゅっと ならべて なまえの かさなりを 見る
    enemies = []; spawnSeq = 0; friendWave = true;
    for (let i = 0; i < avFriends.length; i++){
      spawnEnemy('golem', pathLen*0.42 + i*CELL*0.75);
      spawnSeq += 2;
    }
  },
  enemies: () => enemies.map(e => ({ k:e.k, av:e.av ? e.av.n : null, gi:e.gi ? e.gi.name : null })),
  run: () => { running = true; },
  fill: () => {
    enemies = []; spawnSeq = 0;
    const q = waveList(wave);
    for (let i = 0; i < 9; i++) spawnEnemy(q[i % q.length], (i + 0.6) / 10 * pathLen);
  },
};

})();
</script>
